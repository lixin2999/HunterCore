[project]
name = "ota-service"
version = "0.1.0"
description = "OTA 管理：版本仓库管理、升级任务调度、灰度发布、升级监控、A/B 分区回滚"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100,<1.0",
    "uvicorn[standard]>=0.23",
    "prometheus-client>=0.20,<1",
    "boto3>=1.28,<2",          # MinIO（S3 协议）：预签名/元数据/流式哈希
    "cryptography>=42,<46",    # RSA-2048 验签（RSASSA-PKCS1-v1_5 + SHA-256，发布门禁）
]

# 注意：hunter_common 由仓库统一安装（先执行 pip install -e "common/python"），
# 服务内通过 import hunter_common 使用；不声明为 PyPI 依赖以免误装同名包。
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
