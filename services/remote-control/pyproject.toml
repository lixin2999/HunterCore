[project]
name = "remote-control"
version = "0.1.0"
description = "远程操控：WebRTC 视频流转发、控制指令转发（20Hz）、操作员权限管理、操控会话与录像记录"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100,<1.0",
    "uvicorn[standard]>=0.23",      # [standard] 含 websockets（WS 端点运行时）
    "prometheus-client>=0.20,<1",
    "PyJWT>=2.8,<3",                # WS 握手 JWT 验签（G-09，与 api-gateway 共享密钥）
]

# 注意：hunter_common 由仓库统一安装（先执行 pip install -e "common/python"），
# 服务内通过 import hunter_common 使用；不声明为 PyPI 依赖以免误装同名包。
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008：FastAPI 依赖注入的标准写法（`Depends()` 作为参数默认值），框架惯例豁免
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
