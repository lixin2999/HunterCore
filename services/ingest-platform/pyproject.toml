[project]
name = "ingest-platform"
version = "0.1.0"
description = "服务端数据消费解析与处理：ROS bag 解析、跨模态对齐、质量检查、元数据入库"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100,<1.0",
    "uvicorn[standard]>=0.23",
    "prometheus-client>=0.20,<1",
    "boto3>=1.28,<2",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "Pillow>=10.0",
    # rosbag2 读取：rosbags 是纯 Python 库，无需 ROS2 运行时
    "rosbags>=0.9",
]

# hunter_common 由仓库统一安装（pip install -e "common/python"），不声明为 PyPI 依赖。
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008：FastAPI 依赖注入的标准写法（`Depends()` 作为参数默认值），框架惯例豁免
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
