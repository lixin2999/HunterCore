[project]
name = "api-gateway"
version = "0.1.0"
description = "API 网关：统一接入、JWT 认证鉴权、五级限流熔断、路由转发、日志审计"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100,<1.0",
    "uvicorn[standard]>=0.23",
    "prometheus-client>=0.20,<1",
    # 统一认证与转发（契约 /api/v1/user/** 自持 + x-hunter-gateway-routes 反向代理）
    "PyJWT>=2.8,<3",       # JWT 签发/校验（设计文档 3.2.2 节）
    "bcrypt>=4.1,<5",      # 口令哈希（user_svc.users.password_hash）
    "httpx>=0.27,<1",      # 异步反向代理客户端（流式转发）
]

# 注意：hunter_common 由仓库统一安装（先执行 pip install -e "common/python"），
# 服务内通过 import hunter_common 使用；不声明为 PyPI 依赖以免误装同名包。
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008：FastAPI 依赖注入的标准写法（`Depends()` 作为参数默认值），框架惯例豁免
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
