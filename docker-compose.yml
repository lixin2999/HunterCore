# =====================================================================
# HunterCore 本地开发环境（仓库根目录执行：docker compose up -d）
# 版本严格对齐《数据采集与分析系统详细设计文档 V4.0》技术栈约束：
#   PostgreSQL 15 + TimescaleDB 2.13 / Apache Kafka 3.6 / Redis 7 / MinIO
# 说明：
#   1) 本地开发 Kafka 使用 PLAINTEXT 监听器；生产环境及车端接入必须
#      SASL_SSL + SCRAM-SHA-512（设计文档：Kafka 安全约束，禁止 PLAINTEXT）。
#   2) Kafka 关闭了自动建 Topic，平台内部 Topic 由 kafka-init 按契约创建；
#      车端 Topic（hunter.{vehicle_id}.*）在车辆注册时按契约创建（后续层级实现）。
# =====================================================================

services:
  # ---------- PostgreSQL 15 + TimescaleDB 2.13（业务库 + 时序库） ----------
  postgres:
    image: timescale/timescaledb:2.13.1-pg15
    container_name: hunter-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hunter_dev_123}
      POSTGRES_DB: ${POSTGRES_DB:-hunter_core}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本：启用 timescaledb 扩展（vehicle_telemetry / algorithm_metrics hypertable 依赖）
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hunter} -d ${POSTGRES_DB:-hunter_core}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ---------- Apache Kafka 3.6（KRaft 单节点，本地开发） ----------
  kafka:
    image: bitnami/kafka:3.6.2
    container_name: hunter-kafka
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"   # Topic 必须按契约创建（见 kafka-init）
      KAFKA_CFG_NUM_PARTITIONS: "3"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # 创建平台内部 Topic（分区数/保留时间严格对齐 contracts/kafka/README.md，禁止新增未定义 Topic）
  kafka-init:
    image: bitnami/kafka:3.6.2
    container_name: hunter-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
    volumes:
      - ./infra/docker/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]
    restart: "no"

  # ---------- Redis 7（会话/缓存/分布式锁/限流） ----------
  redis:
    image: redis:7.2
    container_name: hunter-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------- MinIO（S3 兼容对象存储，单节点开发模式） ----------
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: hunter-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      # G-07：Console 仅绑回环（与生产 infra/deploy 同一基线），跨机器访问用 SSH 隧道
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # 创建 7 个 Bucket 并设置生命周期规则（Bucket 名称与生命周期见设计文档，不可更改）
  minio-init:
    image: minio/mc:RELEASE.2024-06-13T16-39-23Z
    container_name: hunter-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./infra/docker/minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["bash", "/init-buckets.sh"]
    restart: "no"

volumes:
  postgres_data:
  kafka_data:
  redis_data:
  minio_data:
