[pytest]
# Monorepo 统一 pytest 配置（pytest-asyncio 自动模式：所有 async 测试无需显式标记）
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# 各服务测试包同名（app.tests.*），必须用 importlib 模式避免 sys.modules 冲突
addopts = --import-mode=importlib
# 默认测试路径：共享库单元测试 + L5 测试层
# ⚠ services/* 不能与 common/tests 在同一个 pytest 进程内收集：6 个服务共用顶层包名 app，
#    会触发 ModuleNotFoundError: No module named 'app.schemas...' 或 ValueError: Plugin already registered
#    全量单元回归（含各服务）请使用：python scripts/run_unit_tests.py
testpaths = common/python/tests tests
markers =
    unit: 纯单元测试：不依赖容器/网络（默认运行）
    integration: 集成测试：需要 Docker 容器或已启动的中间件
    e2e: 端到端业务流程测试（11.1 数据采集 / 11.2 OTA / 11.3 远程操控）
    performance: 性能基准与阈值断言（对照第 10 条性能指标）
    cw: 契约：文档约定值（车端/云端字段、阈值、状态名）一致性校验
    l5_case: 用例号（如 11.1/11.2/11.3），供测试报告归档与设计文档章节对齐
filterwarnings =
    ignore::DeprecationWarning
