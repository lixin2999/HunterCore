[pytest]
# Monorepo 统一 pytest 配置（pytest-asyncio 自动模式：所有 async 测试无需显式标记）
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# 各服务测试包同名（app.tests.*），必须用 importlib 模式避免 sys.modules 冲突
addopts = --import-mode=importlib
# 默认测试路径：共享库单元测试 + 各微服务测试
testpaths = common/python/tests services
filterwarnings =
    ignore::DeprecationWarning
