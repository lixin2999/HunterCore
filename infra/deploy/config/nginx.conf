# =====================================================================
# HunterCore 单机部署包 — web-portal Nginx 配置（config/nginx.conf）
# 容器：hunter-web（服务名 web-portal，端口 80，对外）
# 挂载方式（二选一）：
#   用法 A（推荐）：- ./config/nginx.conf:/etc/nginx/nginx.conf:ro
#   用法 B：删除 events / http 外层后，作为 /etc/nginx/conf.d/hunter.conf:ro
#
# 关键约束（不可更改）：
#   - 前后端同源：前端 VITE_API_BASE_URL=/api/v1、VITE_WS_BASE_URL=/ws（禁止硬编码后端主机）
#   - /api/ → api-gateway:8080（网关统一 JWT 鉴权 / 五级限流 / 路由转发）
#   - /ws/  → remote-control:8085（网关路由表 /ws/remote/**，WebSocket 握手需 Upgrade 头）
#   - /rtc/ → srs:9090（WHEP/WHIP 信令同源反代，V1.21.1：规避跨源 CSP/CORS 拦截）
#     上游必须写成「resolver + 变量」（V1.21.7）：静态 proxy_pass 在 srs 重建换 IP 后必 502
#   - Vue Router history 模式：非静态资源一律 fallback 到 /index.html
# =====================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65536;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------- 日志（结构化 JSON，含 request_id，便于按 trace_id 串联网关日志） ----------
    log_format hunter_json escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
      '"uri":"$request_uri","status":$status,"body_bytes":$body_bytes_sent,'
      '"req_time":$request_time,"upstream_time":"$upstream_response_time",'
      '"request_id":"$http_x_request_id","referer":"$http_referer","ua":"$http_user_agent"}';

    access_log  /var/log/nginx/access.log  hunter_json;

    # ---------- 传输与超时 ----------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    server_tokens   off;

    # 大文件上传（传感器文件 / ROS Bag 经网关中转；OTA 包上传）：1G
    client_max_body_size  1g;
    client_body_timeout   300s;
    client_header_timeout 60s;
    send_timeout          300s;

    # ---------- gzip（Vue 构建产物为文本资源） ----------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml application/xml+rss text/javascript image/svg+xml
                      application/wasm;

    # ---------- WebSocket 升级映射（/ws/ 通道） ----------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------- 入口粗粒度限流（附录 D：单 IP 200 QPS；细粒度限流由 api-gateway 承担） ----------
    limit_req_zone  $binary_remote_addr zone=hunter_api:10m  rate=200r/s;
    limit_conn_zone $binary_remote_addr zone=hunter_conn:10m;

    # ---------- 上游（同一 hunter-net 网络，用服务名通信） ----------
    # Docker 内嵌 DNS：供 /rtc/ 的「变量 + proxy_pass」写法在**运行期**重新解析（V1.21.7）。
    # 只作用于带变量的 proxy_pass；upstream 块仍是加载期一次性解析（见下方 /rtc/ 注释）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_gateway {
        server api-gateway:8080;
        keepalive 64;
    }

    upstream remote_control {
        server remote-control:8085;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  _;

        # 静态资源根目录（Vue 构建产物 frontend/dist 复制进镜像）
        root  /usr/share/nginx/html;
        index index.html;

        # ---------- 安全响应头 ----------
        add_header X-Content-Type-Options   "nosniff"                         always;
        add_header X-Frame-Options          "SAMEORIGIN"                      always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(self), fullscreen=(self)" always;
        # CSP：Element Plus 需要 style inline；ECharts/Three.js 需要 blob:；WebSocket 需 ws/wss
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: blob:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;

        # ---------- 存活探针（供 compose healthcheck / 负载均衡使用） ----------
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ---------- 静态资源（Vite 产物文件名带 hash，可长缓存） ----------
        # 注意：nginx 的 add_header 不具备叠加语义——一旦某 location 内出现 add_header，
        # 该 location 将不再继承 server 级安全头。因此此处只用 expires 控制缓存，
        # 不写 add_header，以免 /assets/ 丢失 nosniff / CSP 等安全响应头。
        location ^~ /assets/ {
            access_log off;
            expires 30d;
            try_files $uri =404;
        }

        # index.html 不缓存（保证前端发版即时生效）；expires -1 → Cache-Control: no-cache
        location = /index.html {
            expires -1;
        }

        # ---------- REST：网关统一入口 ----------
        # 网关路由表：/api/v1/{scene|data|analytics|ota|remote|vehicle|user}/**
        location /api/ {
            limit_req  zone=hunter_api burst=400 nodelay;
            limit_conn hunter_conn 200;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # 链路追踪：$request_id 作为 X-Request-ID 透传（网关回包携带 request_id 字段）
            proxy_set_header   X-Request-ID      $request_id;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    300s;
            # OTA 发布接口为契约性能例外（网关超时 ≥300s），此处保持一致
            proxy_read_timeout    300s;

            # 大文件上传：不做请求缓冲，边收边转发（避免 1G 请求体落盘二次拷贝）
            proxy_request_buffering off;
            proxy_buffering         on;
            proxy_buffers           8 16k;
            proxy_busy_buffers_size 32k;
        }

        # ---------- WebSocket：/ws/remote/** → remote-control ----------
        location /ws/ {
            proxy_pass         http://remote_control;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;

            # 操控会话为长连接（心跳 10s，会话 TTL 6h）：关闭缓冲、放宽读写超时
            proxy_connect_timeout 10s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;
            proxy_buffering       off;
        }

        # ---------- SRS WebRTC 信令（WHEP/WHIP）同源反代 ----------
        # V1.21.1：浏览器 WHEP 拉流改走同源 :80/rtc/ → srs:9090（hunter-net 内部）。
        # 根因：直连 http://SERVER_IP:9090 属跨源，被本页 CSP connect-src 'self' 拦截，
        #       且 Content-Type: application/sdp 触发 CORS 预检 → fetch 报 "Failed to fetch"。
        # 同源后 CSP 天然覆盖、无 CORS；SRS 对外 9090 可收回为仅 127.0.0.1 调试用。
        # ⚠ Host 必须透传 $http_host（含端口）：SRS answer 的 Link 头 resource 地址据此生成，
        #   前端 stop 时对该地址发 DELETE，仍需经本反代同源回到 srs:9090。
        # ⚠ 上游必须写成「变量 + resolver」（V1.21.7 实机教训），不能直写 proxy_pass http://srs:9090：
        #   后者 nginx 只在**加载配置时**解析一次域名。而改 candidate 的唯一路径是
        #   `up -d --force-recreate srs`（单文件 bind mount，restart 不重挂），重建后 srs 会换容器 IP，
        #   hunter-web 仍连旧 IP → 浏览器 WHEP 一直 502，只有 `docker restart hunter-web` 才恢复；
        #   变量形式则按 resolver 的 valid=10s 在运行期重解析，srs 重建不再牵连 web-portal。
        #   注意：proxy_pass 含变量时 nginx 不再自动改写 URI，故必须显式接 $request_uri
        #   （含查询串 ?app=…&stream=…；与原先「proxy_pass 不带 URI」的转发结果完全一致）。
        location /rtc/ {
            # V1.21.10：SRS 切换为 host 网络模式，不再在 hunter-net 桥上有容器 IP。
            # 经 Docker bridge 网关（172.28.0.1）访问宿主机上 SRS 的 9090 端口。
            set $srs_upstream http://172.28.0.1:9090;
            proxy_pass         $srs_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;
            proxy_set_header   Connection        "";

            # SDP offer/answer 为小体 POST：不缓冲请求/响应，尽快回传 answer
            proxy_request_buffering off;
            proxy_buffering         off;
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            # SDP 文本应答：不改写 Content-Type（application/sdp 原样透传）
        }

        # ---------- Vue Router history 模式 fallback ----------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 隐藏文件与备份文件（保留 ACME 校验路径）
        location ~ /\.(?!well-known) {
            deny all;
        }
    }

    # =====================================================================
    # 车端 REST mTLS 入口（V1.21.13，契约 api-gateway x-hunter-device-ingress；pending #6 决议）
    # - 车端客户端证书 = Kafka 接入包同一张（CN=vehicle_id，同一 CA：certs/kafka/ca-cert.pem）
    # - 反代验证证书后以 X-Client-Cert 转发 URL 编码 PEM；api-gateway 用同一 CA 本地重验证书链
    #   （:8080 对外，网关不可直接信头；未配 DEVICE_CA_CERTFILE 时设备通道 fail-closed）
    # - 服务端证书复用 broker-cert.pem（同 CA 签发，SAN 需含车端访问地址 SERVER_IP；
    #   IP 变更按 gen-kafka-certs.sh 更新 SAN 流程重签，车端 CA 未变无需换客户端证书）
    # - 仅放行文件上传两端点（device_paths），其余一律 404，不泄露资源存在性
    # =====================================================================
    server {
        listen       8443 ssl;
        server_name  _;

        ssl_certificate      /etc/nginx/certs/broker-cert.pem;
        ssl_certificate_key  /etc/nginx/certs/broker-key.pem;
        ssl_client_certificate /etc/nginx/certs/ca-cert.pem;
        ssl_verify_client      on;                    # 车端必须出示平台 CA 签发的客户端证书
        ssl_protocols          TLSv1.2 TLSv1.3;

        # 入口粗限沿用附录 D 单 IP 200 QPS（单车单 IP 语义成立；细限网关/服务层）
        location = /api/v1/data/files/presign {
            limit_req  zone=hunter_api burst=400 nodelay;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Request-ID      $request_id;
            proxy_set_header   Connection        "";
            # 设备身份：URL 编码的客户端证书 PEM（网关重验后才信任，见上方注释）
            proxy_set_header   X-Client-Cert     $ssl_client_escaped_cert;

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        location = /api/v1/data/files/complete {
            limit_req  zone=hunter_api burst=400 nodelay;

            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Request-ID      $request_id;
            proxy_set_header   Connection        "";
            proxy_set_header   X-Client-Cert     $ssl_client_escaped_cert;

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # 设备面能力边界：除 device_paths 外不提供任何端点（遥测走 Kafka，OTA 走专属通道）
        location / {
            return 404;
        }
    }
}
