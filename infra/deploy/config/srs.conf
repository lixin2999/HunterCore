# =====================================================================
# HunterCore 单机部署包 — SRS 5.0 配置（infra/deploy/config/srs.conf → 容器 /usr/local/srs/conf/srs.conf:ro）
# 用途：远程操控实时视频（车端 RTMP 推流 → 浏览器 WebRTC 低延迟播放）
#
# 端口对齐（与 docker-compose.yml srs 服务、infra/deploy/.env.example §remote-control 一致）：
#   - RTMP  1935/tcp  ：车端推流
#   - WebRTC 8000/udp ：媒体面（SRTP），STUN 亦复用该端口
#   - HTTP  9090/tcp  ：HTTP-API（/api/v1/versions 健康检查 + WHIP·WHEP /rtc/v1/* + [flv] 兜底）
#
# 地址约定（app 名 = remote_control，stream 前缀 = hunter，见 RC_SRS_APP / RC_SRS_STREAM_PREFIX）：
#   - 车端 RTMP 推流：rtmp://<SERVER_IP>:1935/remote_control/hunter_{vehicle_id}
#   - 浏览器 WHEP 播放（V1.21.1 同源反代）：http://<SERVER_IP>/rtc/v1/whep/?app=remote_control&stream=hunter_{vehicle_id}
#     （web-portal nginx :80 /rtc/ → 容器内 srs:9090；直连 :9090 仅留作服务器诊断，规避浏览器跨源 CSP/CORS 拦截）
#
# ⚠ 部署前必须替换：将 rtc_server.candidate 设为**浏览器可达**的 IP（默认 = .env 的 SERVER_IP，
#   双网卡/NAT 环境由 .env 的 SRS_CANDIDATE_IP 覆盖）。install.sh Step 4 的 ensure_srs_conf 会
#   幂等改写该行（占位符与旧 IP 一律重写），改完必须 `up -d --force-recreate srs` 才生效——
#   本文件是**单文件 bind mount**，sed -i 产生新 inode，`docker restart` 不重挂（与 nginx.conf 同一个坑）。
#
# ⚠ 全局只允许一个 SRS 实例（V1.21.6 实机教训）：禁止在宿主机另跑一份 `./objs/srs -c conf/srs.conf`。
#   两份实例并存时，车端 RTMP 与浏览器 WHEP 会落到不同实例上——推流方 TCP ESTAB、编码在跑、
#   `docker compose ps srs` 一路 healthy，而拉流方永远 502（目标流根本不在它身上）。install.sh 预检
#   与 health-check ⑰ 均已加硬闸（hc_foreign_srs_pids 按 /proc/<pid>/cgroup 排除容器内那个）。
#
# ⚠ 仅保留 SRS 5.0 稳定指令。切勿添加 5.x 已移除/不识别的指令（如 accept_threads、work_threads、
#   goleada_enabled、pithy_close、kernel_madvise、stream_circuit_breaker、nomatch_drop 等），
#   否则 check_normal_config 报 illegal directive（code=1023）导致容器启动即崩溃、restart 循环。
# =====================================================================

# ---------- 全局 ----------
listen                  1935;                 # RTMP 监听
max_connections         1000;
pid                     ./objs/srs.pid;
send_timeout            10s;
recv_timeout            10s;
tcp_nodelay             on;

# 日志：输出到 stdout（console），由 Docker 日志驱动采集（collect-logs.sh 走 docker compose logs）
srs_log_tank            console;
srs_log_level           warn;

# ---------- HTTP API（健康检查 /rtc/v1/* 信令 / [flv] 兜底，容器内 9090） ----------
http_api {
    enabled         on;
    listen          9090;
}

# ---------- WebRTC（RTC 服务，媒体面 8000/udp） ----------
rtc_server {
    enabled         on;
    listen          8000;                     # UDP（RTP/RTCP/STUN）
    candidate       $SERVER_IP;               # ⚠ 占位符，由 ensure_srs_conf 改写为浏览器可达 IP
}

# ---------- vhost：远程操控实时流 ----------
# 仅保留官方 docker-srs.conf 保证合法的核心指令；rtc.enabled 打开 RTMP→WebRTC 转换（WHEP 拉流）。
# 不写 modify_codec / dwq_enabled / http_remux / hls 等，SRS 5.0.225 的 check_normal_config 对部分子指令报 illegal。
vhost __defaultVhost__ {
    rtc {
        enabled         on;
    }
}
