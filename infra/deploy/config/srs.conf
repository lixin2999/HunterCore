# =====================================================================
# HunterCore 单机部署包 — SRS 5.0 配置（infra/deploy/config/srs.conf → 容器 /usr/local/srs/conf/srs.conf:ro）
# 用途：远程操控实时视频（车端 RTMP 推流 → 浏览器 WebRTC 低延迟播放）
#
# 端口对齐（与 docker-compose.yml srs 服务、infra/deploy/.env.example §remote-control 一致）：
#   - RTMP  1935/tcp  ：车端推流
#   - WebRTC 8000/udp ：媒体面（SRTP），STUN 亦复用该端口
#   - HTTP  9090/tcp  ：HTTP-FLV / API(/api/v1/versions 健康检查) / WHIP·WHEP(/rtc/v1/*)
#
# 地址约定（app 名 = remote_control，stream 前缀 = hunter，见 RC_SRS_APP / RC_SRS_STREAM_PREFIX）：
#   - 车端 RTMP 推流：rtmp://<SERVER_IP>:1935/remote_control/hunter_{vehicle_id}
#   - 浏览器 WHEP 播放：http://<SERVER_IP>:9090/rtc/v1/whep/?app=remote_control&stream=hunter_{vehicle_id}
#   - 车端 WHIP 推流（可选）：http://<SERVER_IP>:9090/rtc/v1/whip/?app=remote_control&stream=hunter_{vehicle_id}
#
# ⚠ 部署前必须替换：将下方 rtc_server.candidate 设为服务器公网/局域网真实 IP（= .env 的 SERVER_IP），
#   否则浏览器拿到的 WebRTC candidate 为容器内网地址，跨主机无法连通（同机 NAT 可用 auto 但生产建议显式 IP）。
#   如需 HTTPS/WSS 播放，另行配置 http_server https 与证书（运维手册第 7 节）。
# =====================================================================

# ---------- 全局 ----------
listen                  1935;                 # RTMP 监听
max_connections         1000;
accept_threads          1;
work_threads            4;                    # 与 srs 容器 CPU limit（2C）匹配可下调
goleada_enabled         off;
pithy_close             on;
kernel_madvise          32MB;
send_timeout            10s;
recv_timeout            10s;
tcp_nodelay             on;
stream_circuit_breaker  off;

# 日志：写到 bind mount 的 objs 目录（宿主机 ${DATA_DIR}/srs），便于 collect-logs.sh 收集
srs_log_tank            file;
srs_log_file            ./objs/srs.log;
srs_log_level           warn;

# ---------- HTTP 服务（API / HTTP-FLV / WHIP·WHEP 信令，容器内 9090） ----------
http_server {
    enabled         on;
    listen          9090;
    dir             ./objs/nginx/html;
    https_port      0;                        # 启用 TLS 时改为 9089 并挂载证书
    keepalive       on;
    tcp_nodelay     on;
    send_timeout    30s;
}

# ---------- HTTP API（healthcheck /api/v1/versions 复用 http_server 端口） ----------
http_api {
    enabled         on;
    listen          9090;                     # 与 http_server 同端口（SRS5 合并）
    https_enabled   off;
}

# ---------- WebRTC（RTC 服务，媒体面 8000/udp） ----------
rtc_server {
    enabled         on;
    listen          8000;                     # UDP（RTP/RTCP/STUN）
    candidate       $SERVER_IP;                # ⚠ 部署前替换为真实公网/内网 IP；或 auto + 公网映射
    # NACK + TWCC 反馈，低延迟远程操控优先实时性
    nomatch_drop    on;
}

# ---------- vhost：远程操控实时流 ----------
vhost __defaultVhost__ {
    # 低延迟：关闭时移/录制缓冲，GOP 缓存适度
    time_interval   10000;

    play {
        dwq_enabled off;                      # 禁用队列缓冲，最小化端到端延迟
    }

    # 车端推流允许发布（远程操控为单会话，会话互斥由 remote-control 服务 + Redis 锁保证）
    publish {
        enabled         on;
        mrQ             16;                   # 发布队列（帧数），降低抖动同时控延迟
        queue_length    16;
    }

    # WebRTC 转换
    rtc {
        enabled             on;
        modify_codec        on;               # 适配浏览器编解码（H.264）
        keepalive_timeout   30;
        nltrps_allowed      off;
        bps_protect         off;
    }

    # HTTP-FLV 兜底播放（调试/无 WebRTC 场景）
    http_remux {
        enabled     on;
        mount       [flv];
    }

    # 远程操控不做 HLS 时移（省 CPU/磁盘）
    hls {
        enabled     off;
    }
}
