# =====================================================================
# Prometheus 采集配置（L1）
# - 无状态服务：通过 Pod 注解（prometheus.io/scrape）自动发现，抓取 /metrics
# - 有状态中间件：按 exporter 端口抓取（PG/Redis/Kafka/MinIO exporter，
#   部署方式见 infra/monitoring/README.md）
# - 集群内运行需要 RBAC（infra/monitoring/k8s/monitoring.yaml）
# 全局采集间隔 15s：满足 API P95 ≤ 200ms 与告警延迟 ≤ 2s 的观测需求
# =====================================================================
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: hunter-core-prod
    environment: prod

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager.hunter-core.svc.cluster.local:9093

scrape_configs:
  # ---------- 微服务（Pod 注解自动发现，无需逐个硬编码） ----------
  # 服务清单：api-gateway/scene-service/data-collector/data-analytics/ota-service/remote-control
  # 待抓取端点：GET /metrics（hunter_common.metrics 暴露，统一前缀 hunter_）
  - job_name: hunter-services
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - hunter-core
    relabel_configs:
      # 仅抓取显式声明 prometheus.io/scrape=true 的 Pod
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels:
          - __address__
          - __meta_kubernetes_pod_annotation_prometheus_io_port
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_scheme
        action: replace
        target_label: __scheme__
        regex: (https?)
      # 标签规范化（与 Grafana 看板变量、告警标签约定一致）
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: replace
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace

  # ---------- Kubernetes 自身（节点/Pod/容器资源） ----------
  - job_name: kubernetes-nodes
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

  # ---------- 节点指标（node-exporter DaemonSet，monitoring 命名空间） ----------
  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - monitoring
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
        action: keep
        regex: node-exporter
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        action: keep
        regex: metrics
      - source_labels: [__meta_kubernetes_pod_node_name]
        action: replace
        target_label: node

  # ---------- 集群对象状态（kube-state-metrics：Pod 重启/OOM/配额） ----------
  - job_name: kube-state-metrics
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - monitoring
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
        action: keep
        regex: kube-state-metrics
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        action: keep
        regex: metrics

  # ---------- PostgreSQL 15 + TimescaleDB（postgres_exporter:9187） ----------
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter.monitoring.svc.cluster.local:9187"]
        labels:
          service: postgres

  # ---------- Redis 7（redis_exporter:9121） ----------
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter.monitoring.svc.cluster.local:9121"]
        labels:
          service: redis

  # ---------- Kafka 3.6（kafka_exporter:9308，consumer group lag 关键指标） ----------
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter.monitoring.svc.cluster.local:9308"]
        labels:
          service: kafka
  # Broker JMX 指标（kafka pod 的 prometheus.io 注解端口 9404，需 JMX Exporter 侧车）
  - job_name: kafka-jmx
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - hunter-core
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: keep
        regex: kafka
      - source_labels: [__address__]
        action: replace
        regex: ([^:]+)(?::\d+)?
        replacement: $1:9404
        target_label: __address__

  # ---------- MinIO（集群指标 /minio/v2/metrics/cluster，见 statefulsets/minio.yaml 注解） ----------
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    scheme: https
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - hunter-core
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: keep
        regex: minio
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - action: replace
        target_label: service
        replacement: minio

  # ---------- Prometheus 自身 ----------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
