# =====================================================================
# Grafana 部署（看板与数据源均由 Git 供给，禁止 UI 修改后漂移）
# - 数据源配置：hunter-grafana-provisioning -> datasources/prometheus.yml
# - 看板供给：hunter-grafana-provisioning -> dashboards/dashboards.yml
# - 看板文件：hunter-grafana-dashboards -> /var/lib/grafana/dashboards/*.json
# - 管理员口令：Secret hunter-app-secrets/GRAFANA_ADMIN_PASSWORD（禁止明文）
# =====================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hunter-grafana-data
  namespace: hunter-core
  labels:
    app.kubernetes.io/name: grafana
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: hunter-core
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: hunter-core
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: hunter-core
        app.kubernetes.io/component: monitoring
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472                     # grafana 镜像内置用户
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hunter-app-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "https://hunter-core.example.com/grafana"
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: provisioning
          configMap:
            name: hunter-grafana-provisioning
        - name: dashboards
          configMap:
            name: hunter-grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: hunter-grafana-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: hunter-core
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: hunter-core
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
