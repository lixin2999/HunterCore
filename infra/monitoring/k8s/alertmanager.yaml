# =====================================================================
# Alertmanager 部署（配置由 kustomization 生成：hunter-alertmanager-config）
# 接收 Prometheus 告警并按 severity 路由（路由规则见 alertmanager/alertmanager.yml）
# =====================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hunter-alertmanager-data
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: hunter-edge
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: hunter-edge
        app.kubernetes.io/component: monitoring
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
          ports:
            - name: http
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: hunter-alertmanager-config
        - name: data
          persistentVolumeClaim:
            claimName: hunter-alertmanager-data
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: hunter-edge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
