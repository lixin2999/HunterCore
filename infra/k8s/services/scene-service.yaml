# =====================================================================
# scene-service（场景库管理、场景编辑、参数化、OpenSCENARIO 导出、实车场景提取）
# 无状态服务：2 副本
# 资源：⚠ 数值按服务负载特征推导，需与设计文档 15.2 节核对后调整
# =====================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: scene-service-config
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: scene-service
data:
  SERVICE_NAME: "scene-service"
  API_PORT: "8081"
  DB_POOL_SIZE: "3"          # 单副本可用 CPU(1 核) × 2 + 1
  DB_MAX_OVERFLOW: "5"
  # 场景资源 Bucket（hunter-scene-assets，生命周期永久）
  MINIO_BUCKET_SCENE_ASSETS: "hunter-scene-assets"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scene-service
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: scene-service
    app.kubernetes.io/part-of: hunter-edge
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: scene-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scene-service
        app.kubernetes.io/part-of: hunter-edge
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: scene-service
      containers:
        - name: scene-service
          image: hunter/scene-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: hunter-common-config
            - configMapRef:
                name: scene-service-config
            - secretRef:
                name: hunter-app-secrets
          volumeMounts:
            - name: kafka-tls
              mountPath: /etc/hunter/kafka-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: kafka-tls
          secret:
            secretName: hunter-kafka-tls
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: scene-service
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: scene-service
    app.kubernetes.io/part-of: hunter-edge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scene-service
  ports:
    - name: http
      port: 8081
      targetPort: http
