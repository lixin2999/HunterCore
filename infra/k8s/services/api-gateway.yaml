# =====================================================================
# api-gateway（统一接入、JWT 认证鉴权、五级限流熔断、路由转发、日志审计）
# 无状态服务：3 副本滚动更新，同节点分散（可用性 ≥ 99.9% 约束）
# 资源：⚠ 数值按服务负载特征推导，需与设计文档 15.2 节核对后调整
# =====================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: api-gateway
data:
  SERVICE_NAME: "api-gateway"
  API_PORT: "8080"
  DB_POOL_SIZE: "5"          # 单副本可用 CPU(2 核) × 2 + 1
  DB_MAX_OVERFLOW: "5"
  # 五级限流（附录 D：全局限流 10000 QPS、单用户 100 QPS、单 IP 200 QPS，不可更改）
  RATE_LIMIT_GLOBAL_QPS: "10000"
  RATE_LIMIT_USER_QPS: "100"
  RATE_LIMIT_IP_QPS: "200"
  # 网关路由表前缀（与设计文档一致，禁止自行更改）
  GATEWAY_ROUTE_PREFIXES: "/api/v1/scene,/api/v1/data,/api/v1/analytics,/api/v1/ota,/api/v1/remote,/api/v1/vehicle,/api/v1/user"
  # ---------- 转发目标（x-hunter-gateway-routes；集群内经 Service DNS） ----------
  SCENE_SERVICE_URL: "http://scene-service:8081"
  DATA_COLLECTOR_SERVICE_URL: "http://data-collector:8082"
  DATA_ANALYTICS_SERVICE_URL: "http://data-analytics:8083"
  OTA_SERVICE_URL: "http://ota-service:8084"
  REMOTE_CONTROL_SERVICE_URL: "http://remote-control:8085"
  # vehicle-service / user-service 归属待确认（契约 pending_confirmation）：
  # 不配置 URL → 对应前缀返回 503 + code=5001，禁止伪造转发
  # ---------- 转发超时与熔断（契约 circuit_breaker 默认策略；阈值待人工确认） ----------
  PROXY_CONNECT_TIMEOUT_SECONDS: "5"
  PROXY_TIMEOUT_SECONDS: "30"
  PROXY_MAX_CONNECTIONS: "100"
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"
  CIRCUIT_BREAKER_TIMEOUT_RATE: "0.5"
  CIRCUIT_BREAKER_OPEN_SECONDS: "30"
  # ---------- 登录防护（设计文档 14.5 节；阈值待人工确认） ----------
  LOGIN_RATE_LIMIT_PER_IP: "30"
  LOGIN_MAX_FAILURES: "5"
  LOGIN_LOCK_WINDOW_SECONDS: "900"
  JWT_ISSUER: "hunter-platform"
  TRUST_FORWARDED_FOR: "true"   # Ingress 覆盖 X-Forwarded-For；直连部署改 false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: hunter-edge
    app.kubernetes.io/component: gateway
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # 滚动更新期间不降低服务能力
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: hunter-edge
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false   # 服务不访问 K8s API，最小权限
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532                    # distroless :nonroot
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      containers:
        - name: api-gateway
          image: hunter/api-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hunter-common-config
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: hunter-app-secrets
          volumeMounts:
            - name: kafka-tls
              mountPath: /etc/hunter/kafka-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: kafka-tls
          secret:
            secretName: hunter-kafka-tls   # ca.crt（SASL_SSL 必需，创建方式见 infra/k8s/README.md）
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: hunter-edge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
