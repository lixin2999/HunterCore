# =====================================================================
# ota-service（版本仓库管理、升级任务调度、灰度发布、升级监控、A/B 分区回滚）
# 无状态服务：2 副本
# 资源：⚠ 数值按服务负载特征推导，需与设计文档 15.2 节核对后调整
# =====================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ota-service-config
  namespace: hunter-core
  labels:
    app.kubernetes.io/name: ota-service
data:
  SERVICE_NAME: "ota-service"
  API_PORT: "8084"
  DB_POOL_SIZE: "3"          # 单副本可用 CPU(1 核) × 2 + 1
  DB_MAX_OVERFLOW: "5"
  # OTA 包仓库（hunter-ota-packages，生命周期永久）
  MINIO_BUCKET_OTA_PACKAGES: "hunter-ota-packages"
  # 灰度发布批次与门禁（设计文档 OTA 灰度流程，不可更改）
  OTA_CANARY_STAGES: "5,20,50,100"
  OTA_CANARY_OBSERVE_HOURS: "24"
  OTA_CANARY_MIN_SUCCESS_RATE: "0.95"
  # 升级前置条件（升级门禁：电量 ≥50%、车辆静止(P档)、网络稳定、存储 ≥2GB）
  OTA_PRECONDITION_MIN_SOC: "50"
  OTA_PRECONDITION_MIN_STORAGE_MB: "2048"   # 单位 MB（与 Kafka ota_notify.preconditions.min_storage_mb 一致，禁止换算歧义）
  OTA_PRECONDITION_REQUIRE_PARKED: "true"
  # 包校验（OTA 安全：SHA-256 完整性校验 + RSA-2048 签名验签 + 版本号单调递增）
  OTA_PACKAGE_VERIFY_SHA256: "true"
  OTA_PACKAGE_VERIFY_SIGNATURE: "true"
  # 预签名时效（上传 1 小时 / 下载 15 分钟 + Range 分片）
  PRESIGNED_UPLOAD_EXPIRE_SECONDS: "3600"
  PRESIGNED_DOWNLOAD_EXPIRE_SECONDS: "900"
  # 灰度调度与网络判定（观察窗口到期扫描周期；遥测中断阈值同源 communication_loss）
  OTA_ROLLOUT_TICK_SECONDS: "60"
  ROLLOUT_SCHEDULER_ENABLED: "true"        # 灰度自动调度器总开关（到点启 scheduled、推进/暂停/完成）
  OTA_OFFLINE_THRESHOLD_SECONDS: "10"
  OTA_OFFLINE_FALLBACK_ENABLED: "false"     # 生产：门禁读模型缺失即拒绝（联调可置 true）
  OTA_TASK_MAX_TARGET_VEHICLES: "1000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ota-service
  namespace: hunter-core
  labels:
    app.kubernetes.io/name: ota-service
    app.kubernetes.io/part-of: hunter-core
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ota-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ota-service
        app.kubernetes.io/part-of: hunter-core
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60   # 升级调度任务平滑交接
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001                    # python:3.12-slim appuser（原 distroless :nonroot）
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ota-service
      containers:
        - name: ota-service
          image: "hunter/ota-service:{version}"    # 版本变量：部署前由 scripts/render_k8s.py 注入
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: hunter-common-config
            - configMapRef:
                name: ota-service-config
            - secretRef:
                name: hunter-app-secrets
          volumeMounts:
            - name: kafka-tls
              mountPath: /etc/hunter/kafka-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:                 # 存活：初始延迟 10s / 周期 5s
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:                # 就绪：初始延迟 10s / 周期 5s（/readyz 含 DB/Redis 探测）
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: kafka-tls
          secret:
            secretName: hunter-kafka-tls
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ota-service
  namespace: hunter-core
  labels:
    app.kubernetes.io/name: ota-service
    app.kubernetes.io/part-of: hunter-core
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ota-service
  ports:
    - name: http
      port: 8084
      targetPort: http
