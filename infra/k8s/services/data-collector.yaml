# =====================================================================
# data-collector（Kafka 消费接入、预处理、数据路由、文件上传管理）
# 无状态服务：3 副本（Kafka 消费者组按分区水平扩展）
# 资源：⚠ 数值按服务负载特征推导（消费密集 + 带宽密集），需与设计文档 15.2 节核对
# =====================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: data-collector-config
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: data-collector
data:
  SERVICE_NAME: "data-collector"
  API_PORT: "8082"
  DB_POOL_SIZE: "5"          # 单副本可用 CPU(2 核) × 2 + 1
  DB_MAX_OVERFLOW: "5"
  # 消费者组 / 订阅（对齐 contracts/kafka/consumer-groups.yaml：车端 Topic 正则订阅，
  # 四个数据域独立 offset，禁止擅自新增 Topic 或消费组）
  KAFKA_CONSUMER_GROUPS: "data-collector-telemetry,data-collector-events,data-collector-health,data-collector-command-result"
  KAFKA_SUBSCRIBE_PATTERNS: "hunter.*.telemetry,hunter.*.event,hunter.*.health,hunter.*.command_result"
  KAFKA_PRODUCE_TOPICS: "telemetry_raw,telemetry_clean,event_raw,sensor_file"
  KAFKA_AUTO_OFFSET_RESET: "earliest"
  # 时序批量写入（性能指标：≥ 10000 点/秒，批量插入）
  TELEMETRY_BATCH_SIZE: "2000"
  TELEMETRY_FLUSH_INTERVAL_MS: "500"
  # 遥测查询单次时间跨度上限（保护 API P95 ≤ 200ms；⚠ 上限值待确认）
  TELEMETRY_QUERY_MAX_RANGE_HOURS: "24"
  # 车辆维度限流（附录 D：遥测 ≤100 msg/s、文件上传 ≤10 Mbps = 1310720 B/s）
  VEHICLE_TELEMETRY_MAX_MSG_PER_SEC: "100"
  FILE_UPLOAD_MAX_BYTES_PER_SECOND: "1310720"
  # MinIO Bucket（车端上传类；生命周期由 minio-init Job 配置）
  MINIO_BUCKET_RAW_DATA: "hunter-raw-data"
  MINIO_BUCKET_ROSBAG: "hunter-rosbag"
  MINIO_BUCKET_VIDEO: "hunter-video"
  # 预签名 URL（上传 1h / 下载 15min，支持 Range 分片）
  PRESIGNED_UPLOAD_EXPIRE_SECONDS: "3600"
  PRESIGNED_DOWNLOAD_EXPIRE_SECONDS: "900"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-collector
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: data-collector
    app.kubernetes.io/part-of: hunter-edge
    app.kubernetes.io/component: backend
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: data-collector
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-collector
        app.kubernetes.io/part-of: hunter-edge
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60   # 消费者优雅退出（提交 offset 后再终止）
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: data-collector
      containers:
        - name: data-collector
          image: hunter/data-collector:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: hunter-common-config
            - configMapRef:
                name: data-collector-config
            - secretRef:
                name: hunter-app-secrets
          volumeMounts:
            - name: kafka-tls
              mountPath: /etc/hunter/kafka-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: kafka-tls
          secret:
            secretName: hunter-kafka-tls
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: data-collector
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: data-collector
    app.kubernetes.io/part-of: hunter-edge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: data-collector
  ports:
    - name: http
      port: 8082
      targetPort: http
