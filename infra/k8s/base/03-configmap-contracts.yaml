# =====================================================================
# HunterCore Kafka 契约 ConfigMap（由脚本生成，禁止手工编辑）
#
# 生成命令：python scripts/generate_contracts_configmap.py
# 一致性校验：python scripts/generate_contracts_configmap.py --check（CI lint 阶段）
#
# 用途：data-collector 采集消费者的运行时消息 Schema 校验（schema_name="auto"）；
# 键保留相对路径（schemas/*.schema.json），挂载到 KAFKA_CONTRACT_DIR 后
# 契约加载器即可按目录结构解析。
# =====================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: hunter-contracts
  namespace: hunter-core
  labels:
    app.kubernetes.io/name: hunter-contracts
    app.kubernetes.io/part-of: hunter-core
    app.kubernetes.io/component: contracts
  annotations:
    hunter-core.local/generated-by: scripts/generate_contracts_configmap.py
    hunter-core.local/source: contracts/kafka
data:

  "consumer-groups.yaml": |-
    # =====================================================================
    # HunterCore Kafka 消费者组契约
    # 来源：系统上下文基座（Kafka Topic 表）+ 服务职责（模块划分表）
    # 命名规范：<service-name>-<domain>[-<purpose>]，全小写中划线分隔
    #   - 每个 (服务, 数据域) 一个消费组，保证各域 offset 独立、互不阻塞
    #   - 车端按 vehicle_id 哈希分区，同一消费组内单车辆消息严格有序
    # ⚠ 需核对：消费组命名规范与「上层业务 / 告警处理」消费方的落位服务（设计文档 5.3 节未给出）
    # =====================================================================
    schema_version: "1.0.0"

    defaults:
      enable_auto_commit: false        # 手动提交：handler 成功返回后 commit（hunter_common.kafka.consumer.run）
      auto_offset_reset: earliest
      max_poll_records: 100
      dlq_enabled: true                # 失败消息转投 {topic}.dlq（保留原 topic/partition/offset 于消息头）
      idempotency: required            # 消费幂等：以 (vehicle_id, timestamp/seq) 或业务唯一键去重

    groups:
      - group_id: data-collector-telemetry
        service: data-collector
        subscribes: ["hunter.*.telemetry"]
        subscribe_mode: regex_pattern        # 动态车辆：新车上线无需改配置
        produces: [telemetry_raw, telemetry_clean]
        handler: "预处理（字段校验 → 清洗 → 时间对齐）→ 批量写 vehicle_telemetry + 投递 raw/clean"
        idempotency_key: "(vehicle_id, seq) 与 (vehicle_id, time)"
        target_latency: "入库延迟 ≤ 1s"
        notes: "批量入库 ≥ 10000 点/秒；单车限流 100 msg/s"

      - group_id: data-collector-events
        service: data-collector
        subscribes: ["hunter.*.event"]
        subscribe_mode: regex_pattern
        produces: [event_raw]
        idempotency_key: "(vehicle_id, event_type, event_time)"
        notes: "落库 events 表；critical 事件实时推送告警链路"

      - group_id: data-collector-health
        service: data-collector
        subscribes: ["hunter.*.health"]
        subscribe_mode: regex_pattern
        produces: []
        idempotency_key: "(vehicle_id, timestamp)"
        notes: "写 Redis vehicle:status:{vehicle_id} / vehicle:online:set；不在 DB 落明细"

      - group_id: data-collector-command-result
        service: data-collector
        subscribes: ["hunter.*.command_result"]
        subscribe_mode: regex_pattern
        produces: []
        idempotency_key: command_id
        notes: "指令执行结果留痕（供审计与 remote-control 结果回执）"

      # ⚠ 契约修正（data-analytics Step 1，待人工确认，见 contracts/openapi/data-analytics.yaml
      #   x-hunter-pending-confirmation）：原 data-analytics-telemetry 订阅 telemetry_raw 且声明「生产 telemetry_clean」，
      #   与 topics.yaml（telemetry_clean 生产者 = data-collector）冲突；且原 data-analytics-telemetry-clean 与之重复消费。
      #   现按设计文档 6.2 节作业输入归并为 4 组：清洗后遥测承担 4 个作业，原始遥测仅数据质量监控（对比丢包率）。
      - group_id: data-analytics-telemetry
        service: data-analytics
        subscribes: [telemetry_clean]
        produces: [alert_event, analytics_result]
        writes: [data_analytics.algorithm_metrics]
        engine: Flink 1.18 (DataStream)
        jobs:
          - vehicle_state_monitor            # 6.2.1 心跳/状态变更 → communication_loss
          - driving_anomaly_detection        # 6.2.2 急加速/急减速/急转弯/超速/低电量
          - collision_risk_assessment        # 6.2.3 TTC 计算 → collision_warning
          - algorithm_performance_monitor    # 6.2.4 感知帧率/规划延迟/控制误差 → algorithm_metrics
        idempotency_key: "(vehicle_id, time)"
        target_latency: "实时告警触发 ≤ 2s"
        notes: "实时流处理：阈值取 contracts/database/enums.md 第 3 节，不可放宽（禁止自行新增/改等级）"

      - group_id: data-analytics-telemetry-raw
        service: data-analytics
        subscribes: [telemetry_raw]
        produces: [analytics_result]
        engine: Flink 1.18 (DataStream)
        jobs: [data_quality_monitor]
        idempotency_key: "(vehicle_id, time)"
        notes: "6.2.5 数据质量监控：消费原始遥测统计丢包率/延迟/异常值 → analytics_result(result_type=metric)；需与 telemetry_clean 独立 offset 才可对比"

      - group_id: data-analytics-events
        service: data-analytics
        subscribes: [event_raw]
        produces: [analytics_result]
        engine: "Flink 1.18（实时统计）/ Spark 3.5（离线 Corner Case 挖掘）"
        jobs: [corner_case_mining]
        idempotency_key: "(vehicle_id, event_type, event_time)"
        notes: "事件统计与 Corner Case 挖掘（6.4 节：Isolation Forest + DBSCAN，消费组同一幂等键）"

      - group_id: data-analytics-sensor-file
        service: data-analytics
        subscribes: [sensor_file]
        produces: [analytics_result]
        idempotency_key: object_key
        notes: "对上传到 MinIO 的传感器文件做离线分析（感知精度评估 6.3.2 输入）；消息结构 contracts/kafka/schemas/sensor_file.schema.json"

      - group_id: scene-service-analytics-result
        service: scene-service
        subscribes: [analytics_result]
        produces: []                 # 提取结果直接落库 scene_svc.scenes（无 Kafka 生产）
        dlq_enabled: true
        idempotency_key: "(vehicle_id, window_start)"
        notes: |
          实车场景自动提取（设计文档 4.5 节）：仅处理 result_type=corner_case 且 trigger_event_type ∈
          {harsh_braking, collision_warning, manual_takeover} 的消息，按 clip.pre_seconds/post_seconds（各 10s）
          截取前后数据，输出 scene_type=real_vehicle_replay、status=draft 的场景。
          消息结构：contracts/kafka/schemas/analytics_result.schema.json。
          ⚠ 触发来源待核对：topics.yaml 将 scene-service 列为 event_raw 消费方，但本清单未登记
          event_raw 消费组；若确认改由 event_raw 触发，需先在此登记新消费组再改实现。

      - group_id: ota-service-ota-status
        service: ota-service
        subscribes: ["hunter.*.ota_status"]
        subscribe_mode: regex_pattern
        produces: []
        idempotency_key: "(task_id, vehicle_id, status)"
        notes: "推进 ota_records.status/phase/progress；同步 Redis ota:progress:{task_id}；批次成功率 <95% 暂停任务并告警"

      - group_id: remote-control-command-result
        service: remote-control
        subscribes: ["hunter.*.command_result"]
        subscribe_mode: regex_pattern
        produces: []
        idempotency_key: command_id
        notes: "操控指令回执；>500ms 无回执视为链路异常，会话降级/终止"

      - group_id: platform-alert-event
        service: "告警处理（⚠ 落位服务待定：data-analytics 告警子模块 / api-gateway 推送）"
        subscribes: [alert_event]
        produces: []
        idempotency_key: "(vehicle_id, alert_id)"
        notes: "告警聚合、WebSocket 推送前端、对接 Alertmanager"
  "schemas/alert_event.schema.json": |-
    {
      "$schema": "http://json-schema.org/draft-07/schema#",
      "$id": "https://hunter-core.local/contracts/kafka/schemas/alert_event.schema.json",
      "title": "alert_event",
      "description": "平台内部 Topic alert_event 消息（生产者 data-analytics 的 Flink 1.18 实时作业，设计文档 6.2 节）。消费方：告警处理（⚠ 落位服务待定，见 contracts/kafka/consumer-groups.yaml 的 platform-alert-event）。语义：平台侧基于 telemetry_clean / telemetry_raw 重算触发的告警（与车端上报的 hunter.{vehicle_id}.event 相互独立，禁止混用）；实时告警触发延迟 ≤ 2s（性能指标）。level 必须等于受控词表 EVENT_LEVEL_BY_TYPE[alert_type]（contracts/database/enums.md 第 3 节，不可放宽）。",
      "type": "object",
      "additionalProperties": false,
      "required": [
        "vehicle_id",
        "alert_id",
        "alert_type",
        "level",
        "source_job",
        "event_time",
        "timestamp",
        "rule"
      ],
      "properties": {
        "vehicle_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "description": "车辆 ID；同时是 Kafka 消息 key（保证单车辆有序）"
        },
        "alert_id": {
          "type": "string",
          "minLength": 1,
          "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
          "description": "告警唯一 ID（UUID，由产生告警的 Flink 作业生成；消费方幂等键）"
        },
        "alert_type": {
          "enum": [
            "harsh_acceleration",
            "harsh_braking",
            "harsh_turning",
            "over_speed",
            "collision_warning",
            "manual_takeover",
            "emergency_stop",
            "battery_low",
            "battery_critical",
            "communication_loss",
            "sensor_fault",
            "perception_fault",
            "planning_fault",
            "control_fault",
            "ota_start",
            "ota_success",
            "ota_failed",
            "ota_rollback"
          ],
          "description": "告警类型（受控词表：设计文档「事件类型定义」18 种，见 contracts/database/enums.md 第 3 节；禁止新增取值）"
        },
        "level": {
          "enum": ["info", "warning", "critical"],
          "description": "告警等级；必须等于 EVENT_LEVEL_BY_TYPE[alert_type]（受控映射，代码不得放宽：harsh_acceleration/harsh_braking/harsh_turning/battery_low/ota_rollback=warning，over_speed/collision_warning/emergency_stop/battery_critical/communication_loss/*_fault/ota_failed=critical，manual_takeover/ota_start/ota_success=info）"
        },
        "source_job": {
          "enum": [
            "vehicle_state_monitor",
            "driving_anomaly_detection",
            "algorithm_performance_monitor",
            "collision_risk_assessment",
            "data_quality_monitor"
          ],
          "description": "产生该告警的 Flink 实时作业（设计文档 6.2 节 5 个作业，与 contracts/openapi/data-analytics.yaml 的 x-hunter-realtime-jobs 一致）"
        },
        "event_time": {
          "type": "number",
          "description": "触发告警的异常发生时间（Unix epoch 秒，含毫秒小数；取车端遥测时间戳，禁止用处理时间替代）"
        },
        "timestamp": {
          "type": "number",
          "description": "告警生成时间（Unix epoch 秒）；timestamp - event_time ≤ ALERT_TRIGGER_MAX_LATENCY_SECONDS(2s)"
        },
        "seq": {
          "type": "integer",
          "minimum": 0,
          "description": "触发样本的遥测 seq（幂等去重辅助键，与 telemetry.seq 同源）"
        },
        "window_start": {
          "type": "number",
          "description": "检测窗口起点（Unix epoch 秒；持续型规则如 harsh_acceleration 持续 > 0.5s 时的窗口）"
        },
        "window_end": {
          "type": "number",
          "description": "检测窗口终点（Unix epoch 秒）"
        },
        "rule": {
          "type": "object",
          "description": "命中规则与阈值（阈值来源：设计文档 6.2.2 / 6.2.3 节，不可更改；阈值本体由环境变量注入，见 contracts/openapi/data-analytics.yaml 的 x-hunter-realtime-jobs.thresholds）",
          "additionalProperties": false,
          "required": ["name", "metric", "comparator", "threshold"],
          "properties": {
            "name": {
              "type": "string",
              "minLength": 1,
              "maxLength": 64,
              "description": "规则名（如 harsh_acceleration_gt_3ms2 / ttc_lt_1_5s / communication_loss_gt_10s）"
            },
            "metric": {
              "type": "string",
              "minLength": 1,
              "maxLength": 64,
              "description": "被判定指标（遥测字段路径，如 chassis.velocity / localization.angular_velocity / chassis.battery_soc）"
            },
            "comparator": {
              "enum": ["gt", "gte", "lt", "lte"],
              "description": "比较符（gt 大于 / gte 大于等于 / lt 小于 / lte 小于等于）"
            },
            "threshold": {
              "type": "number",
              "description": "阈值（受控值：3.0 m/s²、0.5 s、0.8 rad/s、超速 1.1 倍、SOC 20%/10%、TTC 1.5 s、中断 10 s 等）"
            },
            "duration_seconds": {
              "type": "number",
              "minimum": 0,
              "description": "持续时长门槛（如急加速/急减速需持续 > 0.5s；瞬时型规则省略）"
            }
          }
        },
        "metrics": {
          "type": "object",
          "additionalProperties": { "type": "number" },
          "description": "实测值集合（如 {acceleration: 3.42, ttc: 1.18, silence_seconds: 12.5}）；键为指标名，值为数值"
        },
        "location": {
          "type": "object",
          "description": "触发位置（定位段快照，用于告警地图定位）",
          "additionalProperties": false,
          "required": ["x", "y"],
          "properties": {
            "x": { "type": "number" },
            "y": { "type": "number" },
            "z": { "type": "number" },
            "heading": { "type": "number", "description": "航向角（rad）" }
          }
        },
        "description": {
          "type": "string",
          "maxLength": 512,
          "description": "告警摘要（面向运维，可含实测值与阈值，禁止包含敏感信息）"
        }
      },
      "examples": [
        {
          "vehicle_id": "HUNTER-001",
          "alert_id": "5e2b9c74-1a3f-4d68-9c07-8b6f4a2d1e30",
          "alert_type": "over_speed",
          "level": "critical",
          "source_job": "driving_anomaly_detection",
          "event_time": 1724035200.123,
          "timestamp": 1724035201.456,
          "seq": 12580,
          "window_start": 1724035195.0,
          "window_end": 1724035200.123,
          "rule": {
            "name": "over_speed_gt_limit_1_1x",
            "metric": "chassis.velocity",
            "comparator": "gt",
            "threshold": 5.5
          },
          "metrics": { "velocity": 6.12, "speed_limit": 5.0 },
          "location": { "x": 125.34, "y": 67.89, "z": 0.32, "heading": 1.234 },
          "description": "超速 22.4%（实测 6.12 m/s、限速 5.0 m/s，阈值 1.1 倍）"
        },
        {
          "vehicle_id": "HUNTER-002",
          "alert_id": "9c1d7f38-4b62-4e5a-8f31-2d5a6c9b0e47",
          "alert_type": "communication_loss",
          "level": "critical",
          "source_job": "vehicle_state_monitor",
          "event_time": 1724035360.0,
          "timestamp": 1724035361.2,
          "rule": {
            "name": "communication_loss_gt_10s",
            "metric": "telemetry.heartbeat_interval",
            "comparator": "gt",
            "threshold": 10.0
          },
          "metrics": { "silence_seconds": 12.5, "last_velocity": 1.52 },
          "description": "遥测中断 12.5s（> 10s），判定车辆失联"
        },
        {
          "vehicle_id": "HUNTER-003",
          "alert_id": "1b8e4a60-7c25-4f93-a1d8-6e2f0b7c3a55",
          "alert_type": "harsh_braking",
          "level": "warning",
          "source_job": "driving_anomaly_detection",
          "event_time": 1724035420.5,
          "timestamp": 1724035421.1,
          "seq": 13104,
          "window_start": 1724035419.9,
          "window_end": 1724035420.5,
          "rule": {
            "name": "harsh_braking_lt_-3ms2",
            "metric": "chassis.acceleration",
            "comparator": "lt",
            "threshold": -3.0,
            "duration_seconds": 0.5
          },
          "metrics": { "min_acceleration": -3.42, "velocity": 0.31 },
          "location": { "x": 126.12, "y": 68.41, "z": 0.32, "heading": 1.236 },
          "description": "急减速 -3.42 m/s² 持续 0.6s（阈值 -3.0 m/s² 且持续 > 0.5s）"
        }
      ]
    }
  "schemas/analytics_result.schema.json": |-
    {
      "$schema": "http://json-schema.org/draft-07/schema#",
      "$id": "https://hunter-core.local/contracts/kafka/schemas/analytics_result.schema.json",
      "title": "analytics_result",
      "description": "平台内部 Topic analytics_result 消息（data-analytics Flink/Spark 产出）。消费方：scene-service（实车场景自动提取，设计文档 4.5 节）、上层业务。⚠ 设计文档 5.3 节未给出该消息结构，本契约按 4.5 节所需字段（触发事件、前后各 10 秒数据引用、自车轨迹、周边目标轨迹、环境条件）定义，需人工确认。",
      "type": "object",
      "additionalProperties": false,
      "required": ["vehicle_id", "result_id", "result_type", "window_start", "window_end", "timestamp"],
      "properties": {
        "vehicle_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "description": "车辆 ID；同时是 Kafka 消息 key（保证单车辆有序）"
        },
        "result_id": {
          "type": "string",
          "minLength": 1,
          "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
          "description": "分析结果唯一 ID（幂等/去重键之一）"
        },
        "result_type": {
          "enum": ["metric", "corner_case", "report"],
          "description": "结果类型：指标计算 / Corner Case 挖掘 / 报告生成"
        },
        "trigger_event_type": {
          "enum": [
            "harsh_acceleration",
            "harsh_braking",
            "harsh_turning",
            "over_speed",
            "collision_warning",
            "manual_takeover",
            "emergency_stop",
            "battery_low",
            "battery_critical",
            "communication_loss",
            "sensor_fault",
            "perception_fault",
            "planning_fault",
            "control_fault",
            "ota_start",
            "ota_success",
            "ota_failed",
            "ota_rollback"
          ],
          "description": "触发本次分析的事件类型（受控词表，见 contracts/database/enums.md 第 3 节）；corner_case 类型必填"
        },
        "event_level": {
          "enum": ["info", "warning", "critical"],
          "description": "触发事件等级（受控词表，见 enums.md 第 2 节）"
        },
        "window_start": {
          "type": "number",
          "description": "分析窗口起点（Unix epoch 秒，含毫秒小数）"
        },
        "window_end": {
          "type": "number",
          "description": "分析窗口终点（Unix epoch 秒，含毫秒小数）"
        },
        "timestamp": {
          "type": "number",
          "description": "结果生成时间（Unix epoch 秒）"
        },
        "clip": {
          "type": "object",
          "description": "事件前后数据截取窗口（设计文档 4.5 节：截取事件前后各 10 秒数据，不可更改）",
          "additionalProperties": false,
          "required": ["pre_seconds", "post_seconds"],
          "properties": {
            "pre_seconds": { "enum": [10], "description": "事件前截取时长（s），契约固定 10" },
            "post_seconds": { "enum": [10], "description": "事件后截取时长（s），契约固定 10" },
            "data_file_url": {
              "type": "string",
              "description": "截取数据对象地址（MinIO hunter-rosbag / hunter-raw-data），无则省略"
            }
          }
        },
        "data_file_url": {
          "type": "string",
          "description": "分析所依据的数据文件对象地址（MinIO，如 hunter-rosbag 中的 bag 文件）"
        },
        "metrics": {
          "type": "object",
          "additionalProperties": { "type": "number" },
          "description": "指标键值对（metric 类型）：如 avg_speed / collision_count / perception_latency_ms"
        },
        "ego_trajectory": {
          "type": "array",
          "description": "自车轨迹（4.5 节提取项之一）",
          "items": { "$ref": "#/definitions/trajectory_point" }
        },
        "objects": {
          "type": "array",
          "description": "周边目标轨迹（4.5 节提取项之一）",
