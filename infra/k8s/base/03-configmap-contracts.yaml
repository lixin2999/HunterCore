  "schemas/command.schema.json": |-
    {
      "$schema": "http://json-schema.org/draft-07/schema#",
      "$id": "https://hunter-core.local/contracts/kafka/schemas/command.schema.json",
      "title": "HunterCore 控制指令 hunter.{vehicle_id}.command / hunter.broadcast.command",
      "description": "平台→车控制指令（按需下发，acks=all）。生产者：api-gateway / ota-service / remote-control；消费者：车端。单车辆消息必须携带 vehicle_id（= 消息 key）；广播消息改用 target_filter（二选一，oneOf 强制）。command_type 取值域待设计文档 5.3 节核对（⚠ 当前不设 enum，禁止前端硬编码分支）。",
      "type": "object",
      "additionalProperties": false,
      "required": ["command_id", "timestamp", "command_type"],
      "oneOf": [
        {"required": ["vehicle_id"], "not": {"required": ["target_filter"]}},
        {"required": ["target_filter"], "not": {"required": ["vehicle_id"]}}
      ],
      "properties": {
        "command_id": {
          "type": "string",
          "format": "uuid",
          "description": "指令唯一标识（幂等键）；车端执行结果经 command_result.command_id 关联"
        },
        "vehicle_id": {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$",
          "description": "目标车辆（单车辆指令必填）"
        },
        "target_filter": {
          "type": "object",
          "additionalProperties": false,
          "description": "广播指令的车辆筛选条件（仅 hunter.broadcast.command 使用）",
          "properties": {
            "models": {"type": "array", "items": {"type": "string"}, "description": "适用车型（如 [\"HUNTER_SE\"]）"},
            "status": {
              "type": "array",
              "items": {"type": "string", "enum": ["offline", "online_idle", "auto_driving", "remote_controlled", "upgrading", "charging", "fault", "emergency"]},
              "description": "按车辆状态筛选"
            },
            "vehicle_ids": {"type": "array", "items": {"type": "string"}, "description": "显式车辆列表（与 models/status 取交集）"}
          }
        },
        "timestamp": {
          "type": "number",
          "description": "指令下发时间（Unix epoch 秒）"
        },
        "command_type": {
          "type": "string",
          "description": "指令类型（⚠ 取值域待设计文档 5.3 节核对后补充 enum）"
        },
        "params": {
          "type": "object",
          "description": "指令参数（随 command_type 变化）"
        },
        "operator_id": {
          "type": ["string", "null"],
          "format": "uuid",
          "description": "操作者用户 ID（审计用；系统自动触发时为空）"
        },
        "timeout_ms": {
          "type": "integer",
          "exclusiveMinimum": 0,
          "description": "指令执行超时（ms）；超时车端须保持安全状态并回报失败"
        }
      },
      "examples": [
        {
          "command_id": "6f1a1f1c-0b1e-4b7a-8f1a-1f2c3d4e5f60",
          "vehicle_id": "HUNTER-001",
          "timestamp": 1724035200.0,
          "command_type": "enable_auto_driving",
          "params": {"max_velocity": 1.5},
          "operator_id": "0b6c1b7e-8f2a-4d3e-9a11-2b3c4d5e6f70",
          "timeout_ms": 5000
        },
        {
          "command_id": "7a2b3c4d-1e2f-4a5b-9c6d-7e8f9a0b1c2d",
          "timestamp": 1724035205.0,
          "command_type": "enter_charging_mode",
          "target_filter": {"models": ["HUNTER_SE"], "status": ["online_idle"]},
          "params": {}
        }
      ]
    }
  "schemas/command_result.schema.json": |-
    {
      "$schema": "http://json-schema.org/draft-07/schema#",
      "$id": "https://hunter-core.local/contracts/kafka/schemas/command_result.schema.json",
      "title": "HunterCore 指令执行结果 hunter.{vehicle_id}.command_result",
      "description": "车端→平台指令执行结果（按需，acks=all）。消费者：data-collector（留痕/审计）、remote-control（操控指令回执；>500ms 无回执视为链路异常）。command_id 必须与请求一致，保证端到端可追溯与幂等。",
      "type": "object",
      "additionalProperties": false,
      "required": ["command_id", "vehicle_id", "timestamp", "success"],
      "properties": {
        "command_id": {
          "type": "string",
          "format": "uuid",
          "description": "对应指令的 command_id（幂等键）"
        },
        "vehicle_id": {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$",
          "description": "执行车辆（Kafka 消息 key）"
        },
        "timestamp": {
          "type": "number",
          "description": "执行完成时间（Unix epoch 秒）"
        },
        "success": {
          "type": "boolean",
          "description": "是否执行成功"
        },
        "result_code": {
          "type": ["string", "null"],
          "description": "结果码：0/SUCCESS 或错误码（平台错误码表 / 车端自定义码；禁止在日志中输出敏感上下文）"
        },
        "message": {
          "type": "string",
          "maxLength": 512,
          "description": "结果描述（含失败原因）"
        },
        "data": {
          "type": "object",
          "description": "执行附加数据（如生效参数、当前状态快照）"
        }
      },
      "examples": [
        {
          "command_id": "6f1a1f1c-0b1e-4b7a-8f1a-1f2c3d4e5f60",
          "vehicle_id": "HUNTER-001",
          "timestamp": 1724035200.45,
          "success": true,
          "result_code": "0",
          "message": "auto driving enabled",
          "data": {"control_mode": "AUTO", "max_velocity": 1.5}
        },
        {
          "command_id": "7a2b3c4d-1e2f-4a5b-9c6d-7e8f9a0b1c2d",
          "vehicle_id": "HUNTER-002",
          "timestamp": 1724035210.1,
          "success": false,
          "result_code": "4002",
          "message": "vehicle busy: upgrading",
          "data": {}
        }
      ]
    }
  "schemas/event.schema.json": |-
    {
      "$schema": "http://json-schema.org/draft-07/schema#",
      "$id": "https://hunter-core.local/contracts/kafka/schemas/event.schema.json",
      "title": "HunterCore 事件消息 hunter.{vehicle_id}.event / event_raw",
      "description": "车辆事件（事件触发上报）。生产者：车端；消费者：data-collector（落库 data_collector.events）。event_type/event_level 取值与阈值见 contracts/database/enums.md 第 2、3 节，不可更改；类型↔等级映射由 data-collector 消费侧按 EVENT_LEVEL_BY_TYPE 校验（JSON Schema 不做跨字段映射校验）。",
      "type": "object",
      "additionalProperties": false,
      "required": ["vehicle_id", "timestamp", "event_type", "event_level"],
      "properties": {
        "vehicle_id": {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$",
          "description": "车辆唯一标识（Kafka 消息 key）"
        },
        "timestamp": {
          "type": "number",
          "description": "事件发生时间（Unix epoch 秒）→ 落库 events.event_time（禁止用入库时间替代）"
        },
        "event_type": {
          "type": "string",
          "enum": [
            "harsh_acceleration", "harsh_braking", "harsh_turning", "over_speed",
            "collision_warning", "manual_takeover", "emergency_stop", "battery_low",
            "battery_critical", "communication_loss", "sensor_fault", "perception_fault",
            "planning_fault", "control_fault", "ota_start", "ota_success",
            "ota_failed", "ota_rollback"
          ],
          "description": "事件类型（18 种，触发阈值不可更改）"
        },
        "event_level": {
          "type": "string",
          "enum": ["info", "warning", "critical"],
          "description": "事件等级；必须等于该 event_type 的契约等级"
        },
        "description": {
          "type": "string",
          "maxLength": 512,
          "description": "可读描述（落库 events.description）"
        },
        "data": {
          "type": "object",
          "description": "事件上下文（阈值、实测值、轨迹片段摘要等；结构随事件类型变化）→ 落库 events.data_json"
        },
        "data_file_url": {
          "type": ["string", "null"],
          "description": "关联文件对象地址（MinIO bucket/key，如 hunter-rosbag/events/...）→ 落库 events.data_file_url；对外下发必须另签 15 分钟预签名 URL"
        }
      },
      "examples": [
        {
          "vehicle_id": "HUNTER-001",
          "timestamp": 1724035260.5,
          "event_type": "harsh_braking",
          "event_level": "warning",
          "description": "急刹：减速度 3.4 m/s² 超过 3 m/s² 阈值",
          "data": {"deceleration": 3.4, "threshold": 3.0, "velocity": 1.8},
          "data_file_url": "hunter-rosbag/events/HUNTER-001/20240819/1724035260.bag"
        },
        {
          "vehicle_id": "HUNTER-002",
          "timestamp": 1724035900.0,
          "event_type": "battery_critical",
          "event_level": "critical",
          "description": "电量严重不足：SOC 8% 低于 10% 阈值",
          "data": {"battery_soc": 8, "threshold": 10}
        }
      ]
    }
