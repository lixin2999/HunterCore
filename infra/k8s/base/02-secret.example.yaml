# =====================================================================
# Secret 模板（示例文件，禁止填写/提交真实密钥）
#
# 使用方式：
#   1) 生产环境禁止直接 apply 本文件：使用 External Secrets Operator / SealedSecrets
#      / HashiCorp Vault 注入，或由 CI 在执行期 kubectl create secret 生成。
#   2) 若必须手工创建：复制为 02-secret.yaml（已被 .gitignore 忽略），替换全部占位值后 apply。
#   3) 二进制证书类 Secret（Kafka keystore/truststore、Ingress TLS）无法用 YAML 明文表达，
#      使用命令行创建（示例见 infra/k8s/README.md）。
#
# 日志脱敏约束：密钥只通过 Secret 注入环境变量，禁止在日志/异常中输出。
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: hunter-app-secrets
  namespace: hunter-core
  labels:
    app.kubernetes.io/name: hunter-core
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # ---------- PostgreSQL 15 + TimescaleDB 2.13 ----------
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_DB_PASSWORD"

  # ---------- Redis 7 ----------
  REDIS_PASSWORD: "REPLACE_WITH_STRONG_REDIS_PASSWORD"

  # ---------- MinIO ----------
  MINIO_ACCESS_KEY: "REPLACE_WITH_MINIO_ACCESS_KEY"
  MINIO_SECRET_KEY: "REPLACE_WITH_MINIO_SECRET_KEY"
  # SSE-S3 服务端加密主密钥（数据安全：MinIO 服务端加密）
  MINIO_KMS_SECRET_KEY: "hunter-sse-key:REPLACE_WITH_32BYTE_BASE64_KEY"

  # ---------- Kafka SASL（SCRAM-SHA-512；生产与车端接入强制）----------
  KAFKA_SASL_USERNAME: "REPLACE_WITH_KAFKA_SASL_USER"
  KAFKA_SASL_PASSWORD: "REPLACE_WITH_KAFKA_SASL_PASSWORD"

  # ---------- JWT（生产必须替换默认值）----------
  JWT_SECRET_KEY: "REPLACE_WITH_RANDOM_64_CHARS_SECRET"

  # ---------- OTA 升级包签名验签公钥（ota-service）----------
  # 公钥非敏感（私钥仅存发布方 CI/KMS）；统一由 Secret 注入，环境变量名 OTA_SIGNATURE_PUBLIC_KEY
  OTA_SIGNATURE_PUBLIC_KEY: "REPLACE_WITH_RSA2048_PUBLIC_KEY_PEM"

  # ---------- 分析只读账号（data-analytics 跨 schema 只读例外：er.md 第 3 节）----------
  # 仅授予 SELECT data_collector.vehicle_telemetry / data_analytics.algorithm_metrics
  ANALYTICS_RO_DB_PASSWORD: "REPLACE_WITH_STRONG_ANALYTICS_RO_PASSWORD"

  # ---------- Grafana 管理员口令（infra/monitoring 部署使用）----------
  GRAFANA_ADMIN_PASSWORD: "REPLACE_WITH_STRONG_GRAFANA_PASSWORD"
---
# =====================================================================
# MinIO 根凭据（仅 StatefulSet 使用；应用侧通过 hunter-app-secrets 的 MINIO_ACCESS_KEY/SECRET_KEY）
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: hunter-minio-root
  namespace: hunter-core
type: Opaque
stringData:
  MINIO_ROOT_USER: "REPLACE_WITH_MINIO_ROOT_USER"
  MINIO_ROOT_PASSWORD: "REPLACE_WITH_MINIO_ROOT_PASSWORD"
