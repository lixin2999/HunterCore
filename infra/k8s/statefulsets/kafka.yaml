# =====================================================================
# Apache Kafka 3.6（KRaft 三节点集群，SASL_SSL + SCRAM-SHA-512）
# - 显式 server.properties 模板 + 启动脚本（不依赖镜像默认魔法，配置可审查）
# - 初始 SCRAM 超级用户通过 kafka-storage.sh format --add-scram 建立（KRaft 引导必需）
# - auto.create.topics.enable=false：Topic 必须按 contracts/kafka 契约创建
# - ssl.client.auth=requested：SASL_SSL + SCRAM 凭据认证；
#   若需严格 mTLS(required)，应用侧需补 KAFKA_SSL_CERTFILE/KEYFILE 配置后再切换
# ⚠ 资源/容量数值需与设计文档 15.2 节核对
# =====================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: hunter-core
  labels:
    app.kubernetes.io/name: kafka
data:
  # 固定集群 ID（三节点必须一致；由 kafka-storage.sh format -t 使用）
  KRAFT_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
  server.properties.tmpl: |
    process.roles=broker,controller
    node.id=__NODE_ID__
    controller.quorum.voters=0@kafka-0.kafka-headless.hunter-core.svc.cluster.local:9094,1@kafka-1.kafka-headless.hunter-core.svc.cluster.local:9094,2@kafka-2.kafka-headless.hunter-core.svc.cluster.local:9094

    listeners=INTERNAL://:9093,CONTROLLER://:9094
    advertised.listeners=__ADVERTISED__
    listener.security.protocol.map=CONTROLLER:SSL,INTERNAL:SASL_SSL
    controller.listener.names=CONTROLLER
    inter.broker.listener.name=INTERNAL

    sasl.enabled.mechanisms=SCRAM-SHA-512
    listener.name.internal.sasl.enabled.mechanisms=SCRAM-SHA-512
    listener.name.internal.scram-sha-512.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="__SASL_USERNAME__" password="__SASL_PASSWORD__";
    super.users=User:__SASL_USERNAME__

    ssl.keystore.type=PEM
    ssl.keystore.location=/etc/hunter/kafka-tls/tls.crt
    ssl.keystore.certificate.chain=/etc/hunter/kafka-tls/tls.crt
    ssl.keystore.key=/etc/hunter/kafka-tls/tls.key
    ssl.truststore.type=PEM
    ssl.truststore.location=/etc/hunter/kafka-tls/ca.crt
    ssl.client.auth=requested
    ssl.endpoint.identification.algorithm=HTTPS

    log.dirs=/bitnami/kafka/data
    num.partitions=3
    default.replication.factor=3
    min.insync.replicas=2
    auto.create.topics.enable=false
    offsets.topic.replication.factor=3
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2
    group.initial.rebalance.delay.ms=0
    unclean.leader.election.enable=false

    log.retention.hours=168
    log.segment.bytes=1073741824
    log.retention.check.interval.ms=300000
    message.max.bytes=10485760
    replica.fetch.max.bytes=10485760
    num.network.threads=4
    num.io.threads=8
    socket.send.buffer.bytes=1048576
    socket.receive.buffer.bytes=1048576
  kafka-start.sh: |
    #!/usr/bin/env bash
    # Kafka 节点启动脚本：生成配置 -> 首次格式化（含初始 SCRAM 用户）-> 启动 broker
    # 注意：本脚本与产品契约一致，Topic 创建由 kafka-init Job 按 contracts/kafka 执行
    set -euo pipefail

    KAFKA_HOME=/opt/bitnami/kafka
    NODE_ID="${POD_NAME#kafka-}"
    POD_FQDN="${POD_NAME}.kafka-headless.hunter-core.svc.cluster.local"
    CONF_DIR=/tmp/hunter
    CONF="${CONF_DIR}/server.properties"

    mkdir -p "$CONF_DIR"
    sed -e "s|__NODE_ID__|${NODE_ID}|g" \
        -e "s|__ADVERTISED__|INTERNAL://${POD_FQDN}:9093|g" \
        -e "s|__SASL_USERNAME__|${KAFKA_SASL_USERNAME}|g" \
        -e "s|__SASL_PASSWORD__|${KAFKA_SASL_PASSWORD}|g" \
        /etc/hunter-kafka/server.properties.tmpl > "$CONF"

    # 客户端连接配置（本机探针与 kafka-init Job 复用；密码经环境变量注入，不落盘敏感值）
    cat > "${CONF_DIR}/client.properties" <<EOF
    security.protocol=SASL_SSL
    sasl.mechanism=SCRAM-SHA-512
    sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";
    ssl.truststore.type=PEM
    ssl.truststore.location=/etc/hunter/kafka-tls/ca.crt
    EOF
    chmod 600 "${CONF_DIR}/client.properties"

    # 首次启动：格式化存储目录并建立初始 SCRAM 超级用户（SCRAM-SHA-512）
    if [ ! -f /bitnami/kafka/data/meta.properties ]; then
      echo "[kafka] formatting storage for node ${NODE_ID} (cluster=${KRAFT_CLUSTER_ID})"
      "$KAFKA_HOME/bin/kafka-storage.sh" format \
        -t "$KRAFT_CLUSTER_ID" \
        -c "$CONF" \
        --add-scram "SCRAM-SHA-512=[name=${KAFKA_SASL_USERNAME},password=${KAFKA_SASL_PASSWORD}]"
    fi

    exec "$KAFKA_HOME/bin/kafka-server-start.sh" "$CONF"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: hunter-core
  labels:
    app.kubernetes.io/name: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: internal
      port: 9093
      targetPort: internal
    - name: controller
      port: 9094
      targetPort: controller
---
# 应用访问入口（KAFKA_BOOTSTRAP_SERVERS 使用各 pod 的 headless DNS，见 01-configmap-common.yaml）
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: hunter-core
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: hunter-core
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: internal
      port: 9093
      targetPort: internal
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: hunter-core
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: hunter-core
    app.kubernetes.io/component: mq
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel           # KRaft 三节点需并行启动完成 quorum
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: hunter-core
        app.kubernetes.io/component: mq
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9404"        # JMX Exporter（kafka-exporter 侧车端口）
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001                   # bitnami 镜像内置用户
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: bitnami/kafka:3.6.2
          imagePullPolicy: IfNotPresent
          command: ["bash", "/etc/hunter-kafka/kafka-start.sh"]
          ports:
            - name: internal
              containerPort: 9093
            - name: controller
              containerPort: 9094
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KRAFT_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KRAFT_CLUSTER_ID
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hunter-app-secrets
                  key: KAFKA_SASL_USERNAME
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hunter-app-secrets
                  key: KAFKA_SASL_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /etc/hunter-kafka
              readOnly: true
            - name: kafka-tls
              mountPath: /etc/hunter/kafka-tls
              readOnly: true
            - name: data
              mountPath: /bitnami/kafka/data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 12Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: internal
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - /opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9093 --command-config /tmp/hunter/client.properties >/dev/null 2>&1
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - /opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9093 --command-config /tmp/hunter/client.properties >/dev/null 2>&1
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: kafka-config
            defaultMode: 0755             # 启动脚本需可执行
            items:
              - key: server.properties.tmpl
                path: server.properties.tmpl
              - key: kafka-start.sh
                path: kafka-start.sh
        - name: kafka-tls
          secret:
            secretName: hunter-kafka-tls  # ca.crt / tls.crt / tls.key（PEM，双向校验）
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 500Gi                # ⚠ 容量需与设计文档 15.2 节核对（7 天遥测保留）
