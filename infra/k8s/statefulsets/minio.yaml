# =====================================================================
# MinIO（S3 兼容对象存储，纠删码模式）
# - StatefulSet 4 节点（EC:2，可容忍 2 节点故障）+ 每节点独立 PVC
# - SSE-S3 服务端加密：MINIO_KMS_SECRET_KEY（数据安全约束）
# - HTTPS：证书由 Secret hunter-minio-tls 映射为 /certs/public.crt + /certs/private.key
# ⚠ 容量/资源数值需与设计文档 15.2 节核对
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: minio
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: hunter-edge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: hunter-edge
    app.kubernetes.io/component: objectstore
spec:
  serviceName: minio-headless
  replicas: 4
  podManagementPolicy: Parallel          # 纠删码集群并行启动（单节点等待会阻塞）
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: hunter-edge
        app.kubernetes.io/component: objectstore
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/minio/v2/metrics/cluster"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000                   # minio 官方镜像内置用户
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-06-13T22-53-53Z
          imagePullPolicy: IfNotPresent
          args:
            - server
            - "http://minio-{0...3}.minio-headless.hunter-edge.svc.cluster.local/data"
            - "--console-address"
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: hunter-minio-root
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hunter-minio-root
                  key: MINIO_ROOT_PASSWORD
            # SSE-S3 服务端加密主密钥（数据安全约束）
            - name: MINIO_KMS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hunter-app-secrets
                  key: MINIO_KMS_SECRET_KEY
            - name: MINIO_UPDATE
              value: "off"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: api
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
              scheme: HTTPS
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /minio/health/cluster
              port: api
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: certs
          secret:
            secretName: hunter-minio-tls
            items:
              - key: tls.crt
                path: public.crt        # MinIO 约定的证书文件名
              - key: tls.key
                path: private.key
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 500Gi             # ⚠ 容量需与设计文档 15.2 节核对
