# =====================================================================
# HorizontalPodAutoscaler（基于 CPU 使用率自动扩缩容）
#
# 约束（不可更改）：
#   - minReplicas = 2 / maxReplicas = 5 / Resource(cpu) averageUtilization = 70%
#   - 仅作用于无状态微服务；有状态中间件（PostgreSQL/Kafka/Redis/MinIO）禁止 HPA
#   - 前置依赖：metrics-server（未部署时 `kubectl get hpa` 的 TARGETS 显示 <unknown>，
#     副本数回落为 minReplicas，不影响服务可用）
#
# ⚠ 与 Deployment 静态副本的关系（人工确认点）：
#   - scene-service / data-analytics / ota-service：基线 2 副本 → HPA 区间 [2, 5] 一致
#   - api-gateway / data-collector / remote-control：基线 3 副本（可用性 ≥99.9% 约束）；
#     HPA 接管后按 minReplicas=2 计算，低负载时可能缩容到 2 副本。
#     若要求“永不低于 3 副本”，把这 3 个 HPA 的 minReplicas 改为 3（唯一改动点，
#     仍满足 maxReplicas=5 与 70% 目标）
#   - 应用本清单后，Deployment.spec.replicas 由 HPA 持续接管（滚动更新策略不变）
#
# 行为策略：扩容快速（30s 窗口，Percent 100% 或 +2 取大者）；缩容保守
#   （稳定窗口 300s + 每分钟至多 -1 副本），避免指标抖动导致反复扩缩。
#
# 用法：
#   kubectl apply -f infra/k8s/autoscaling/hpa.yaml
#   kubectl -n hunter-edge get hpa
# =====================================================================

# ---------- API 网关（8080，CPU 敏感：JWT 验签 + 限流计数） ----------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: hunter-edge
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
        - { type: Pods, value: 2, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
---
