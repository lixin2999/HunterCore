# ---------- 数据采集（8082，Kafka 消费 + 批量入库；副本数受分区数上限约束） ----------
# 注意：消费者组有效并行度 ≤ telemetry 主题分区数（12），maxReplicas=5 仍在分区数内。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: data-collector
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: data-collector
    app.kubernetes.io/part-of: hunter-edge
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: data-collector
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
        - { type: Pods, value: 2, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
---
