# ---------- OTA 管理（8084，任务调度与灰度编排；扩容依赖分布式锁保证任务不重复领取） ----------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ota-service
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: ota-service
    app.kubernetes.io/part-of: hunter-edge
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ota-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
        - { type: Pods, value: 2, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
---
# ---------- 远程操控（8085，WebRTC 转发长连接；扩容需配合会话粘性） ----------
# ⚠ 长连接副本不迁移（契约 pending #14）：缩容会中断在线操控会话。
#   若要求“操控期间禁止缩容”，把本 HPA 的 scaleDown.stabilizationWindowSeconds 调大
#   或改为人工扩缩容（仅此一处，需人工确认）。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: remote-control
  namespace: hunter-edge
  labels:
    app.kubernetes.io/name: remote-control
    app.kubernetes.io/part-of: hunter-edge
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: remote-control
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
        - { type: Pods, value: 2, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }

