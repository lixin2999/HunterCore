[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hunter-common"
version = "0.1.0"
description = "HunterEdge 共享代码库：配置/日志/异常/统一响应/Kafka/数据库/Redis 封装"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "structlog>=24.1,<26",
    "SQLAlchemy>=2.0.25,<2.1",
    "asyncpg>=0.29,<0.31",
    "alembic>=1.13,<2",
    "redis>=5.0.1,<6",
    "confluent-kafka>=2.3,<3",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.4,<1",
    "mypy>=1.8,<2",
    "jsonschema>=4.20,<5",
    "PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
include = ["hunter_common*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
