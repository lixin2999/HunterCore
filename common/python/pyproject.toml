[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hunter-common"
version = "0.1.0"
description = "HunterCore 共享代码库：配置/日志/异常/统一响应/Kafka/数据库/Redis 封装"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "structlog>=24.1,<26",
    "SQLAlchemy>=2.0.25,<2.1",
    "asyncpg>=0.29,<0.31",
    "alembic>=1.13,<2",
    "redis>=5.0.1,<6",
    "confluent-kafka>=2.3,<3",
    "prometheus-client>=0.20,<1",
    # Kafka 契约运行时加载（hunter_common.kafka.contracts / messages）：topics.yaml 解析 + draft-07 校验
    "jsonschema>=4.20,<5",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    # 真实 Session 语义测试（tests/test_repository_transactions.py：SAVEPOINT/事务边界回归）
    # 用 sqlite+aiosqlite 驱动，无需容器即可在单元阶段守护写路径纪律；仅测试依赖，运行时不使用
    "aiosqlite>=0.19,<1",
    # 版本区间锁定：CI 与本地使用同一 lint 规则集，避免"文档通过、流水线失败"的版本漂移
    "ruff>=0.16,<0.17",
    "mypy>=1.8,<2",
]

[tool.setuptools.packages.find]
include = ["hunter_common*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
