# =====================================================================
# HunterEdge Alembic configuration (database contract entry point)
# NOTE: this file must stay ASCII-only (configparser reads it with the
# local locale encoding, e.g. GBK on Windows). Chinese usage docs live in
# common/python/hunter_common/database/migrations/README.md
#
# Usage (works from any working directory; paths resolved via %(here)s):
#   alembic -c common/python/alembic.ini upgrade head
#   alembic -c common/python/alembic.ini upgrade head --sql > /tmp/ddl.sql
#   alembic -c common/python/alembic.ini current
#   alembic -c common/python/alembic.ini downgrade -1
#   alembic -c common/python/alembic.ini revision --autogenerate -m "msg"
#
# DSN priority: env DATABASE_URL > POSTGRES_* env (via hunter_common.config)
#               > sqlalchemy.url below (local dev fallback only)
# =====================================================================
[alembic]
script_location = %(here)s/hunter_common/database/migrations
prepend_sys_path = %(here)s
version_path_separator = os
sqlalchemy.url = postgresql+asyncpg://hunter:hunter_dev_123@localhost:5432/hunter_edge
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

