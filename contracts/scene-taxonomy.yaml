  - { value: backtrack,        label: 折返,       group: adversarial }
  - { value: occluded_dash,    label: 遮挡窜出,   group: adversarial }
  - { value: door_open,        label: 开门,       group: adversarial }
  - { value: boarding,         label: 上下客,     group: adversarial }
  - { value: pushing,          label: 推车,       group: adversarial }
  - { value: child_chase_ball, label: 儿童追球,   group: adversarial }
  # 失效类
