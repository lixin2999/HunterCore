  - { value: start_up,           label: 起步,       group: longitudinal }
  - { value: yield,              label: 让行,       group: longitudinal }
  - { value: reverse,            label: 倒车,       group: longitudinal }
  - { value: creep,              label: 蠕行,       group: longitudinal }
  - { value: forward,            label: 直行通过,   group: longitudinal }
  - { value: cross_road,         label: 横穿道路,   group: longitudinal }
  - { value: static,             label: 静止占道,   group: longitudinal }
  - { value: trajectory_replay,  label: 轨迹回放,   group: longitudinal }
  # 横向
