# =====================================================================
# HunterCore 场景受控字典（单一事实来源 / Single Source of Truth）
# ---------------------------------------------------------------------
# 用途：
#   - 取代原先「SceneType 18 值固定枚举」的硬编码约定，改为**数据驱动受控字典**：
#     新增场景类型 / 行为 / 动作 / 触发条件只需编辑本文件，无需改动 Python 逻辑即可入库。
#   - scene-service schemas、批量生成脚本（scripts/batch_add_scenes.py）、前端常量
#     （由 scripts/gen_scene_taxonomy_ts.py 生成）均以本文件为准。
#   - OpenAPI 契约 contracts/openapi/scene-service.yaml 的 x-hunter-scene-types 引用本文件。
# 校验：
#   - 入库时按本字典对 scene_type / behavior_type / action_type / trigger.condition_type
#     及 trigger/action.parameters 的键做受控校验；越界值在入库时即被拦下（422/3000）。
#   - scenes.scene_type 为 TEXT 无 CHECK（见 contracts/database/enums.md），取值域由应用层
#     本字典把关；新增分类/类型无需 DDL/迁移。
# 对齐：
#   - 叶子类型维度对齐 GB/T 47025—2026 智能网联汽车自动驾驶功能仿真试验 48 项覆盖面；
#   - behavior_type / action_type / trigger 对齐 OpenSCENARIO 分类习惯，避免场景资产被
#     单一仿真器锁死。
# 加载：hunter_common.scene_taxonomy（定位顺序：SCENE_TAXONOMY_FILE → 向上查找
#   contracts/scene-taxonomy.yaml；容器内由 ./contracts 只读挂载或镜像内置提供）。
# =====================================================================
version: "1.0"
source: "场景生成器与场景管理详细设计文档 §4.2.1 分类体系 + GB/T 47025—2026 覆盖面"
status: confirmed_extensible
note: "本文件为可扩展受控字典；categories[].types 的并集等于 scene_types 全集"

# ---------- 一级分类（沿用 4.2.1 六大分类，不新增分类、不加 DB 列） ----------
categories:
  - { value: basic,        label: 基础场景 }
  - { value: interactive,  label: 交互场景 }
  - { value: environment,  label: 环境场景 }
  - { value: corner_case,  label: 极端场景（Corner Case） }
  - { value: custom,       label: 自定义场景 }
  - { value: real_vehicle, label: 实车回放 }

# ---------- 场景类型（叶子，扁平扩充至 48；对齐 GB/T 47025 覆盖面） ----------
# 模板服务为除 real_vehicle_replay 外的全部类型预置模板（47 个）。
scene_types:
  # basic（道路结构 + 基础驾驶任务，12）
  - { value: straight_cruise,    label: 直线巡航,   category: basic }
  - { value: curve_driving,      label: 弯道行驶,   category: basic }
  - { value: car_following,      label: 跟车行驶,   category: basic }
  - { value: lane_change,        label: 变道行驶,   category: basic }
  - { value: overtaking,         label: 超车借道,   category: basic }
  - { value: ramp_merge,         label: 匝道汇入,   category: basic }
  - { value: ramp_exit,          label: 匝道汇出,   category: basic }
  - { value: tunnel_driving,     label: 隧道通行,   category: basic }
  - { value: roundabout,         label: 环岛通行,   category: basic }
  - { value: narrow_road_meeting, label: 窄路会车,  category: basic }
  - { value: uturn,              label: 掉头,       category: basic }
  - { value: parking,            label: 泊车,       category: basic }
  # interactive（交互与冲突，10）
  - { value: cut_in,               label: 前车切入,     category: interactive }
  - { value: cut_out,              label: 前车切出,     category: interactive }
  - { value: pedestrian_crossing,  label: 行人横穿,     category: interactive }
  - { value: occluded_pedestrian,  label: 鬼探头,       category: interactive }
  - { value: intersection_meeting, label: 路口会车,     category: interactive }
  - { value: unprotected_turn,     label: 无信号路口转弯冲突, category: interactive }
  - { value: construction_detour,  label: 施工绕行,     category: interactive }
  - { value: cyclist_interaction,  label: 非机动车交互, category: interactive }
  - { value: queue_creep,          label: 拥堵蠕行,     category: interactive }
  - { value: wrong_way_encounter,  label: 逆行借道冲突, category: interactive }
  # environment（环境/光照，8）
  - { value: rainy,      label: 雨天,     category: environment }
  - { value: night,      label: 夜间,     category: environment }
  - { value: foggy,      label: 雾天,     category: environment }
  - { value: backlight,  label: 强光逆光, category: environment }
  - { value: snowy,      label: 雪天,     category: environment }
  - { value: icy,        label: 结冰路面, category: environment }
  - { value: haze,       label: 霾低能见度, category: environment }
  - { value: dusk_dawn,  label: 黄昏黎明, category: environment }
  # corner_case（极端与失效，16）
  - { value: emergency_braking,    label: 紧急制动,     category: corner_case }
  - { value: obstacle_appearance,  label: 障碍物突现,   category: corner_case }
  - { value: sensor_failure,       label: 传感器失效,   category: corner_case }
  - { value: multi_vehicle_mixed,  label: 多车混行,     category: corner_case }
  - { value: stationary_obstacle,  label: 静止障碍物,   category: corner_case }
  - { value: debris_spillage,      label: 路面遗撒物,   category: corner_case }
  - { value: animal_crossing,      label: 动物穿行,     category: corner_case }
  - { value: door_opening,         label: 开门杀,       category: corner_case }
  - { value: child_chasing_ball,   label: 儿童追球,     category: corner_case }
  - { value: aggressive_cut_in,    label: 激进加塞博弈, category: corner_case }
  - { value: accident_scene,       label: 事故现场绕行, category: corner_case }
  - { value: degraded_localization, label: 定位丢失地图失配, category: corner_case }
  - { value: comms_failure,        label: 通信中断,     category: corner_case }
  - { value: actuator_failure,     label: 执行器故障,   category: corner_case }
  - { value: driver_incapacitation, label: 驾驶员失能,  category: corner_case }
  - { value: minimal_risk_manoeuvre, label: 最小风险策略, category: corner_case }
  # custom + real_vehicle（各 1）
  - { value: custom,             label: 自定义,   category: custom }
