# =====================================================================
# HunterCore Kafka Topic 契约（单一事实来源）
# 来源：设计文档 5.3 节 + 系统上下文基座「Kafka Topic 命名与配置」
# 命名规范：<domain>.<entity>.<type>，全小写点分隔；车端 Topic 为 hunter.{vehicle_id}.<type>
# 约束：禁止自行新增 Topic 或更改配置；变更需同步
#   - contracts/kafka/schemas/*.schema.json
#   - infra/docker/kafka/create-topics.sh
#   - infra/k8s/jobs/kafka-init-job.yaml
#   - common/python/hunter_common/kafka/{producer,consumer}.py
# ⚠ 需核对：车端 Topic 的保留时间与副本数（设计文档仅给出分区数/acks/频率）；
#   此处按平台内部同类 Topic 的值对齐（telemetry/health 7 天、event 30 天、指令类 7 天），副本数统一 3
# =====================================================================
schema_version: "1.0.0"
source: "设计文档 5.3 节（Kafka Topic 与消息格式）"
naming:
  convention: "<domain>.<entity>.<type>"
  case: lower_snake_case
  separator: "."
  vehicle_topic_pattern: "hunter.{vehicle_id}.<type>"
  broadcast_topic: "hunter.broadcast.command"
  # DLQ 由 hunter_common.kafka.consumer 派生：{original_topic}.dlq（保留 30 天，分区数继承源 Topic）
  dlq_pattern: "{original_topic}.dlq"
  dlq_retention_ms: 2592000000          # 30 天：人工排查与重放窗口（与 event_raw 对齐）
  dlq_partitions_inherit_source: true    # 分区数继承源 Topic（同一车辆消息在死信内仍可定位原分区）
  # ⚠ **DLQ Topic 不会自动存**：broker 关闭 auto.create.topics.enable（本契约安全基线），因此
  #   派生死信名必须被显式创建，否则转投必然 UNKNOWN_TOPIC 而非法消息被静默丢弃。创建责任三方一致：
  #     - 平台内部 Topic → infra/docker/kafka/create-topics.sh 与 scripts/init-kafka.sh
  #     - 车端 Topic（hunter.{vehicle_id}.*）→ 车辆 provisioning（vehicle-service kafka_admin）
  #   由 scripts/verify_data_layer.py 逐项比对三方清单与本文 naming 段。

# ---------- 全局默认（未显式覆盖时生效） ----------
defaults:
  replication_factor: 3
  min_insync_replicas: 2          # acks=all 时至少 2 副本落盘
  cleanup_policy: delete
  compression_type: lz4           # 车端生产者配置：compression.type=lz4
  key: vehicle_id                 # 消息 key = vehicle_id，保证单车辆消息有序
  message_format: json
  security_protocol: SASL_SSL     # 车端与平台间强制
  sasl_mechanism: SCRAM-SHA-512

producer_defaults:                # 对齐车端生产者基准配置
  linger_ms: 5
  batch_size: 16384
  retries: 3
  local_disk_buffer_bytes: 1073741824   # 网络中断时本地磁盘缓冲 1GB

consumer_defaults:
  enable_auto_commit: false        # 手动提交 offset：处理成功后提交（hunter_common.kafka.consumer）
  auto_offset_reset: earliest
  max_poll_records: 100            # 单批处理量（batch_size 与 handler 幂等性配合）
  isolation_level: read_committed

# =====================================================================
# 一、车端 ↔ 平台 Topic
# =====================================================================
vehicle_topics:
  - name: "hunter.{vehicle_id}.telemetry"
    direction: vehicle_to_platform
    partitions: 6                    # 按 vehicle_id 哈希分区
    partition_strategy: hash(vehicle_id)
    acks: "1"                        # 高频遥测：容忍极少数丢失换取吞吐（acks=1）
    frequency: "10-50Hz"
    key: vehicle_id
    retention_ms: 604800000
    retention_human: "7 天"
    producer: vehicle (HUNTER SE AGX Orin)
    consumers: [data-collector]
    schema: schemas/telemetry.schema.json
    description: "车辆遥测（底盘/定位/感知/规划/控制/系统六段），单车 ≤100 msg/s"

  - name: "hunter.{vehicle_id}.event"
    direction: vehicle_to_platform
    partitions: 3
    partition_strategy: hash(vehicle_id)
    acks: all
    frequency: "事件触发"
    key: vehicle_id
    retention_ms: 2592000000
    retention_human: "30 天"
    producer: vehicle
    consumers: [data-collector]
    schema: schemas/event.schema.json
    description: "车辆事件（18 种类型/3 级等级，阈值见 contracts/database/enums.md）"

  - name: "hunter.{vehicle_id}.health"
    direction: vehicle_to_platform
    partitions: 3
    partition_strategy: hash(vehicle_id)
    acks: "0"
    frequency: "1Hz"
    key: vehicle_id
    retention_ms: 604800000
    retention_human: "7 天"
    producer: vehicle
    consumers: [data-collector]
    schema: schemas/health.schema.json
    description: "系统健康数据（状态 + 车载计算平台资源/网络指标），最低可靠性要求"

  - name: "hunter.{vehicle_id}.command"
    direction: platform_to_vehicle
    partitions: 3
    partition_strategy: hash(vehicle_id)
    acks: all
    frequency: "按需"
    key: vehicle_id
    retention_ms: 604800000
    retention_human: "7 天"
    producer: [api-gateway, ota-service, remote-control]
    consumers: [vehicle]
    schema: schemas/command.schema.json
    description: "控制指令（按需下发）；执行结果经 command_result 回报"

  - name: "hunter.{vehicle_id}.command_result"
    direction: vehicle_to_platform
    partitions: 3
    partition_strategy: hash(vehicle_id)
    acks: all
    frequency: "按需"
    key: vehicle_id
    retention_ms: 604800000
    retention_human: "7 天"
    producer: vehicle
    consumers: [data-collector, remote-control]
    schema: schemas/command_result.schema.json
    description: "指令执行结果（command_id 关联请求，保证端到端可追溯）"

  - name: "hunter.{vehicle_id}.ota_notify"
    direction: platform_to_vehicle
    partitions: 3
    partition_strategy: hash(vehicle_id)
    acks: all
    frequency: "按需"
    key: vehicle_id
    retention_ms: 604800000
    retention_human: "7 天"
    producer: ota-service
    consumers: [vehicle]
    schema: schemas/ota_notify.schema.json
    description: "OTA 升级通知（含包地址/大小/MD5/SHA-256/RSA-2048 签名，车端下载后必须逐项校验）"

  - name: "hunter.{vehicle_id}.ota_status"
    direction: vehicle_to_platform
    partitions: 3
    partition_strategy: hash(vehicle_id)
    acks: all
    frequency: "状态变更"
    key: vehicle_id
    retention_ms: 2592000000
    retention_human: "30 天"
    producer: vehicle
    consumers: [ota-service]
    schema: schemas/ota_status.schema.json
    description: "OTA 状态上报（车端状态机 IDLE→…→SUCCESS/ROLLED_BACK/FAILED，写 ota_records）"

  - name: "hunter.{vehicle_id}.remote_control"
    direction: platform_to_vehicle
    partitions: 3
    partition_strategy: hash(vehicle_id)
    acks: all
    frequency: "20Hz"
    key: vehicle_id
    retention_ms: 604800000
    retention_human: "7 天"
    producer: remote-control
    consumers: [vehicle]
    schema: schemas/remote_control.schema.json
    description: "远程操控指令（20Hz/50ms 间隔，>500ms 未收到则车端自动减速停车）"

  # ⚠ producer 为「设计预期生产者登记」：api-gateway 契约声明不生产任何 Topic、
  #   ota-service 契约将广播场景列为待确认（x-hunter-pending-confirmation #12）→ 实现侧暂不生产该 Topic，
  #   先由逐车 hunter.{vehicle_id}.command / ota_notify 承接；启用广播须先同步两份 OpenAPI 契约
  - name: "hunter.broadcast.command"
    direction: platform_to_all_vehicles
    partitions: 3
    partition_strategy: none          # 广播：所有消费者组均需收到
    acks: all
    frequency: "按需"
    key: none                         # 广播消息不使用 vehicle_id 作为 key
    retention_ms: 604800000
    retention_human: "7 天"
    producer: [api-gateway, ota-service]
    consumers: [vehicle]
    schema: schemas/command.schema.json
    description: "广播指令（全车队）；消费者按 payload.target_filter 自行过滤"

# =====================================================================
# 二、平台内部 Topic（本地开发由 infra/docker/kafka/create-topics.sh 创建；
#     K8s 由 infra/k8s/jobs/kafka-init-job.yaml 创建；auto.create.topics.enable=false）
# ⚠ 副本数：本地 docker-compose 单 broker = 1（与 create-topics.sh 一致）；生产 K8s = 3（min.insync.replicas=2）
# =====================================================================
platform_topics:
  - name: telemetry_raw
    partitions: 12
    acks: all
    retention_ms: 604800000
    retention_human: "7 天"
    key: vehicle_id
    producer: data-collector
    consumers: [data-analytics (Flink)]
    schema: schemas/telemetry.schema.json      # 复用遥测消息结构（原样透传）
    description: "原始遥测（消费 hunter.{vehicle_id}.telemetry 后写入）"

  - name: telemetry_clean
    partitions: 12
    acks: all
    retention_ms: 604800000
    retention_human: "7 天"
    key: vehicle_id
    producer: data-collector
    consumers: [data-analytics (Flink)]
    schema: schemas/telemetry.schema.json      # 清洗后仍为同一结构，异常点已剔除/插补
    description: "清洗后遥测（校验/去重/时间对齐/野值处理后的结果）"

  - name: event_raw
    partitions: 6
    acks: all
    retention_ms: 2592000000
    retention_human: "30 天"
    key: vehicle_id
    producer: data-collector
    consumers: [data-analytics, scene-service]
    schema: schemas/event.schema.json          # 复用事件消息结构
    description: "事件数据（消费 hunter.{vehicle_id}.event 后写入 + 落库 events 表）"

  - name: sensor_file
    partitions: 3
    acks: all
    retention_ms: 604800000
    retention_human: "7 天"
    key: vehicle_id
    producer: data-collector
    consumers: [data-analytics]
    schema: schemas/sensor_file.schema.json    # 5.5 节上传完成通知（bucket/object_key/size/md5/sha256）
    description: "传感器文件通知（MinIO 对象已上传且完整性校验通过：bucket/object_key/data_type/size/checksum），不含文件本体；幂等键 = object_key"

  - name: analytics_result
    partitions: 6
    acks: all
    retention_ms: 2592000000
    retention_human: "30 天"
    key: vehicle_id
    producer: data-analytics
    consumers: [scene-service, 上层业务]
    schema: schemas/analytics_result.schema.json
    description: |
      分析结果（指标计算 / Corner Case 挖掘 / 报告生成结果）；
      scene-service 消费该 Topic 做实车场景自动提取（设计文档 4.5 节：触发事件 + 前后各 10 秒截取窗口）
    result_types: [metric, corner_case, report]
    consumed_by:
      - service: scene-service
        group_id: scene-service-analytics-result
        usage: "实车场景自动提取 → 生成 scene_type=real_vehicle_replay 的 draft 场景"

  - name: alert_event
    partitions: 3
    acks: all
    retention_ms: 2592000000
    retention_human: "30 天"
    key: vehicle_id
    producer: data-analytics
    consumers: [告警处理]
    schema: schemas/alert_event.schema.json    # Flink 实时作业告警（6.2 节规则 + 受控词表等级映射）
    description: "告警事件（平台侧重算触发；实时告警触发 ≤2s，推送 WebSocket + Alertmanager）"
    # ⚠ 消费方「告警处理」落位服务待定（见 consumer-groups.yaml 的 platform-alert-event）
    consumed_by:
      - service: "告警处理（落位待定：data-analytics 告警子模块 / api-gateway 推送）"
        group_id: platform-alert-event
        usage: "告警聚合 → WebSocket 推送前端 + 对接 Alertmanager"
    idempotency_key: "(vehicle_id, alert_id)"

  - name: algorithm_metrics
    partitions: 6
    acks: all
    retention_ms: 604800000
    retention_human: "7 天"
    key: vehicle_id
    producer: data-analytics
    consumers: [data-analytics]
    schema: schemas/algorithm_metrics.schema.json   # 字段严格对齐表列（Flink 6.2.4 算法性能监控产出）
    description: |
      算法指标时序（Flink algorithm_performance_monitor 按 ALGORITHM_METRICS_WINDOW_SECONDS(60s)
      滚动窗口聚合 telemetry_clean 后投递；data-analytics 常驻消费者再落 data_analytics.algorithm_metrics）；
      实时作业不直连库（G-13），落库经本 Topic 由服务侧消费者完成（写自身 schema，非跨 schema 越界）
    idempotency_key: "(vehicle_id, time, module, metric_name)"

# =====================================================================
# 二b、ingest-platform 数据消费/解析 Topic（服务端数据消费解析与处理详细设计文档 §5.1/§7.5/§9.4/§12.3）
#   独立限界上下文（V1.20.4 纳入编排）。与 platform_topics 不同：
#     - 死信仅对**被消费**的订阅 Topic 派生 {topic}.dlq（基础设施类失败经 hunter_common 转投），
#       数据/字段级失败走自建 DLT `ingest.dlt`；生产 Topic 不派生 .dlq。
#     - auto.create.topics.enable=false，本清单由 init-kafka.sh / create-topics.sh / kafka-init Job 三处显式创建。
#   消费组见 contracts/kafka/consumer-groups.yaml（g.ingest.*）。组 ID 采用点分命名（与车端/平台 Topic 点分一致）。
# =====================================================================
ingest_platform_topics:
  # ---- 订阅（车端/agent 产出、ingest 消费；均派生 {topic}.dlq）----
  - name: vehicle.bag.manifest
    direction: vehicle_to_platform
    partitions: 3
    retention_ms: 604800000
    retention_human: "7 天"
    consumed: true
    producer: vehicle-agent
    consumers: [ingest-platform (g.ingest.manifest)]
    description: "bag manifest 上传登记（§5.1 消费拓扑；触发投影与就绪判定）"
  - name: vehicle.bag.task.status
    direction: vehicle_to_platform
    partitions: 3
    retention_ms: 604800000
    retention_human: "7 天"
    consumed: true
    producer: vehicle-agent
    consumers: [ingest-platform (g.ingest.projection)]
    description: "车端任务状态回报（纯投影更新，不触发加工）"
  - name: vehicle.bag.parse.progress
    direction: vehicle_to_platform
    partitions: 3
    retention_ms: 604800000
    retention_human: "7 天"
    consumed: true
    producer: vehicle-agent
    consumers: [ingest-platform (g.ingest.progress)]
    description: "解析进度（最新态写入 bags.progress，历史入 events 仓）"
  - name: vehicle.bag.artifact.uploaded
    direction: vehicle_to_platform
    partitions: 6
    retention_ms: 604800000
    retention_human: "7 天"
    consumed: true
    producer: vehicle-agent
    consumers: [ingest-platform (g.ingest.artifact)]
    description: "产物上传完成通知（触发就绪判定；每分区令牌桶限速 §5.4）"
  - name: vehicle.agent.heartbeat
    direction: vehicle_to_platform
    partitions: 6
    retention_ms: 604800000
    retention_human: "7 天"
    consumed: true
    producer: vehicle-agent
    consumers: [ingest-platform (g.ingest.heartbeat)]
    description: "agent 心跳（AgentRepository.upsert_heartbeat）"
  - name: vehicle.agent.alert
    direction: vehicle_to_platform
    partitions: 3
    retention_ms: 2592000000
    retention_human: "30 天"
    consumed: true
    producer: vehicle-agent
    consumers: [ingest-platform (g.ingest.alert)]
    description: "agent 告警（critical/error 级经 Webhook/Alertmanager 外发 §10）"
  - name: vehicle.agent.cmd.ack
    direction: vehicle_to_platform
    partitions: 3
    retention_ms: 604800000
    retention_human: "7 天"
    consumed: true
    producer: vehicle-agent
    consumers: [ingest-platform (g.ingest.cmdack)]
    description: "下行命令回执（命令闭环 §9.4；30min 未 ack 自动重发一次）"
  # ---- 生产（平台侧；不派生 .dlq）----
  - name: vehicle.agent.cmd
    direction: platform_to_vehicle
    partitions: 3
    retention_ms: 604800000
    retention_human: "7 天"
    consumed: false
    producer: ingest-platform
    consumers: [vehicle-agent]
    description: "下行命令（§9.4；ack 经 vehicle.agent.cmd.ack 回报）"
  - name: platform.derived.ready.v1
    direction: platform_internal
    partitions: 3
    retention_ms: 2592000000
    retention_human: "30 天"
    consumed: false
    producer: ingest-platform
    consumers: [下游业务]
    description: "派生产物就绪（§7.5 对齐/切片/QC/富化完成）"
  - name: platform.bag.qc_failed.v1
    direction: platform_internal
    partitions: 3
    retention_ms: 2592000000
    retention_human: "30 天"
    consumed: false
    producer: ingest-platform
    consumers: [下游业务]
    description: "QC 加权分低于阈值告警（§7.4）"
  - name: platform.clip.created.v1
    direction: platform_internal
    partitions: 3
    retention_ms: 2592000000
    retention_human: "30 天"
    consumed: false
    producer: ingest-platform
    consumers: [下游业务]
    description: "切片生成（§7.3 事件驱动/固定窗口/挖掘/手工）"
  - name: platform.dataset.ready.v1
    direction: platform_internal
    partitions: 3
    retention_ms: 2592000000
    retention_human: "30 天"
    consumed: false
    producer: ingest-platform
    consumers: [下游业务]
    description: "训练数据集导出就绪（§8.2 webdataset 分片）"
  # ---- DLT（解析/字段级无效消息专用死信；replay 工具 g.ingest.dlt-replay 取回源，§12.3）----
  - name: ingest.dlt
    direction: platform_internal
    partitions: 3
    retention_ms: 2592000000
    retention_human: "30 天"
    consumed: false
    producer: ingest-platform
    consumers: [ingest-platform (g.ingest.dlt-replay, 人工重放)]
    description: "ingest 自建死信（数据/字段级无效消息；区别于 hunter_common 的 {topic}.dlq 基础设施死信）"

# =====================================================================
# 三、Topic 级限流（设计文档附录 D，不可放宽）
# =====================================================================
throttles:
  - scope: vehicle
    metric: telemetry_produce_rate
    limit: 100
    unit: msg/s
    enforcement: "data-collector 消费侧 + 车端生产者；超限丢弃最旧遥测并告警"
  - scope: vehicle
    metric: file_upload_bandwidth
    limit: 10
    unit: Mbps
    enforcement: "预签名 URL 上传通道（data-collector 文件上传管理）"


