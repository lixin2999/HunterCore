x-hunter-pending-confirmation:
  source: "本契约编写过程中发现的、设计文档未明确的决策点；确认后回填契约再实现代码"
  note: "每项均影响 Step 2 及之后的实现范围；未确认前实现必须按本契约当前取值（禁止另起一套）"
  items:
    - id: 1
      question: "data-collector 的 REST 端点清单（设计文档 12.2 节未随仓库提供，无法逐条比对）"
      contract_decision: "按附录 D 限流端点 + 5.5 上传流程 + events 表列能力推导 7 个业务端点（见 x-hunter-endpoints.derivation，逐条标注依据与风险）"
      impact: "Step 4 路由层实现范围；若 12.2 节存在差异（如文件清单端点不存在/路径不同）需回改契约与实现"
    - id: 2
      question: "5.5 节步骤 6「元信息入库」在 contracts/database 无对应表（data_collector schema 仅 events / vehicle_telemetry）"
      contract_decision: "不擅自新增表：文件元信息以 MinIO 对象列举（GET /files）+ Kafka sensor_file 通知体现；如需 DB 表须先更新 DDL 契约"
      impact: "文件清单分页/检索能力（无 total、无法按业务字段查询）；未来新增表需 DDL→ORM→migration 同步"
    - id: 3
      question: "Kafka sensor_file 消息字段清单（设计文档未给出，契约原为 schema: null）"
      contract_decision: "按 topics.yaml 描述（bucket/object_key/size/checksum）+ 5.5 命名规范定义 contracts/kafka/schemas/sensor_file.schema.json（draft-07，additionalProperties=false）"
      impact: "Step 5 生产实现与 data-analytics 消费解析；字段增减必须先改 Schema"
    - id: 4
      question: "文件 data_type 取值域与 data_type → Bucket 映射（设计文档未给出）"
      contract_decision: "data_type 暂定 {point_cloud, camera_image, rosbag, video, other}，映射见 x-hunter-file-upload-flow.bucket_mapping"
      impact: "上传配额、MinIO 生命周期归类、文件清单筛选枚举"
    - id: 5
      question: "文件完整性校验失败的错误码（附录 A 无通用文件校验码）"
      contract_decision: "复用 6001（原语义：OTA 包校验失败），HTTP 422，data 携带 field/expected/actual"
      impact: "车端上传重试逻辑与前端错误提示文案"
    - id: 6
      question: "车端 REST 接入方式：presign/complete 由车端调用（设备认证），入口是经网关还是独立 Ingress mTLS 端口"
      contract_decision: "契约按 dual security 声明（deviceCertificate + bearerAuth）；vehicle_id 一律以证书 CN 为准，禁止请求体指定他车"
      impact: "Ingress / mTLS 证书链配置；网关是否需要放行车端流量（附录 D 单 IP 200 QPS 是否适用车端）"
    - id: 7
      question: "遥测查询单次时间跨度上限与 total 计数成本（hypertable COUNT 开销）"
      contract_decision: "时间跨度上限环境变量 TELEMETRY_QUERY_MAX_RANGE_HOURS（默认 24h）；保留 total 字段但仍需确认是否改为 estimate/游标"
      impact: "P95 ≤ 200ms 保障；前端分页组件形态"
    - id: 8
      question: "车辆实时状态查询端点归属（Redis vehicle:status:{vehicle_id} / vehicle:online:set 的读取接口）"
      contract_decision: "本服务只写不暴露读端点（车辆监控页数据来源待确认：data-collector 还是 vehicle-service）"
      impact: "前端车队视图数据来源；若落本服务需新增端点并回改契约"
    - id: 9
      question: "Carla Topic（carla.{sim_id}.vil_state / carla.{sim_id}.sensor_data）在 5.3.1 清单出现但未登记于 contracts/kafka/topics.yaml"
      contract_decision: "本契约仅登记缺口（x-hunter-kafka.not_owned.carla_note），不新增 Topic（分区/acks/保留/Schema 未知）"
      impact: "Carla 仿真数据回传链路归属（scene-service 下发 / data-collector 采集）需明确后再补契约"
    - id: 10
      question: "遥测 seq 是否入表（er.md 已标 ⚠）：影响查询返回与幂等键实现"
      contract_decision: "DDL 中保留 vehicle_telemetry.seq（BIGINT），查询响应 seq 可空；若设计文档无该列需同步 DDL/ORM/migration"
      impact: "幂等去重实现（(vehicle_id, seq) 优先，缺失时退化为 (vehicle_id, time)）"
    - id: 11
      question: "告警链路归属：alert_event → WebSocket/Alertmanager 由谁消费（本契约声明本服务不消费 alert_event）"
      contract_decision: "本服务只落库 events 并投递 event_raw；实时告警推送由 data-analytics + 告警处理（落位待定）承担"
      impact: "前端告警中心实现路径；若改由本服务推送需先更新 consumer-groups.yaml 再实现"
    - id: 12
      question: "车端文件上传带宽限流（单车 10 Mbps）落实方式：预签名直传链路无服务端流量计量"
      contract_decision: "契约声明环境变量 FILE_UPLOAD_MAX_BYTES_PER_SECOND（=10 Mbps）与在途上传配额校验；实际带宽整形待确认（MinIO 侧/网络侧）"
      impact: "限流实现位置与可观测性（是否需要 MinIO 侧速率限制或车端自律上报）"

