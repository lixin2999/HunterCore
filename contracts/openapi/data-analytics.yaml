x-hunter-pending-confirmation:
  source: "本契约编写过程中发现的、设计文档未明确的决策点；确认后回填契约再实现代码"
  note: "每项均影响 Step 2 及之后的实现范围；未确认前实现必须按本契约当前取值（禁止另起一套）"
  items:
    - id: 1
      question: "报告 / Corner Case / 评估结果元信息的存储位置（contracts/database 无 reports 等表）"
      contract_decision: "不擅自新增表：元信息与结果文档落 MinIO hunter-reports（永久保留）+ sidecar JSON；查询以对象前缀列举实现（x-hunter-report-storage）"
      impact: "列表检索能力受限（无 DB 索引/无 total 精确计数）；如需按业务字段检索或数据权限隔离，需先新增 data_analytics.reports 表并同步 DDL/ORM/migration"

    - id: 2
      question: "报告生成语义与状态枚举（设计文档 6.5 节仅描述产物，未定义同步/异步与状态）"
      contract_decision: "异步：POST 返回 202 + report_id + status=pending，客户端轮询报告详情；状态枚举 pending/generating/ready/failed；并发保护 REPORT_GENERATE_MAX_CONCURRENT(2)，超限 3003"
      impact: "前端需实现轮询与失败重试；报告状态需可持久化（MinIO sidecar）；若设计文档要求同步返回需改契约与端点语义"

    - id: 3
      question: "6.2.3 节「TTC < 3.0s 碰撞预警(warning)」与受控词表 collision_warning(critical) 等级冲突"
      contract_decision: "不放宽受控词表、不新增事件类型：alert_event.level 必须 = EVENT_LEVEL_BY_TYPE[alert_type]；3.0s 预警改写入 analytics_result(result_type=metric, metrics.min_ttc) 与 algorithm_metrics，不投 alert_event"
      impact: "告警条数与前端告警中心口径；若设计文档确认 3.0s 必须告警，需先在 enums.md/DDL CHECK/ORM 扩展事件类型（或新增告警等级域）再实现"

    - id: 4
      question: "alert_event 消费方「告警处理」落位服务（consumer-groups.yaml 的 platform-alert-event 标注待定）"
      contract_decision: "本契约只定义 schema（contracts/kafka/schemas/alert_event.schema.json）与生产者行为；消费与 WebSocket 推送不在本服务（网关契约亦声明不消费 Kafka）"
      impact: "实时告警端到端链路（≤2s）落地位置；若最终由 data-analytics 承接推送，需先更新 consumer-groups.yaml 再实现"

    - id: 5
      question: "6.2.5 节数据质量监控的判定阈值与结果落位（设计文档未给出）"
      contract_decision: "丢包率/延迟/异常值占比以 analytics_result(result_type=metric) 输出；12.4 节无对应查询端点 → 经报告与看板体现"
      impact: "数据质量告警能力（无受控事件类型可用）；若需单独数据质量报告/端点需先确认并改契约"

    - id: 6
      question: "算法指标统计窗口（6.2 节）与感知精度评估真值来源（6.3.2 节）"
      contract_decision: "指标窗口取 ALGORITHM_METRICS_WINDOW_SECONDS(60s，待确认)；感知评估真值暂按 MinIO hunter-rosbag 标注文件 + algorithm_metrics 实现"
      impact: "指标口径与看板数值；评估真值方案决定 spark-jobs 感知评估作业输入"

    - id: 7
      question: "Corner Case 挖掘的特征窗口与 Isolation Forest / DBSCAN 参数（6.4 节未给出）"
      contract_decision: "特征窗口默认 10 min（环境变量化）；Isolation Forest 随机种子固定、DBSCAN eps/min_samples 走作业参数；异常分数归一化到 [0,1]"
      impact: "挖掘召回率与误报率；参数不当会产生大量噪声 Corner Case 并触发 scene-service 场景提取"

    - id: 8
      question: "看板车队状态数据读取：Redis vehicle:status:{vehicle_id} / vehicle:online:set 的读取端点归属（data-collector 契约 pending #8）"
      contract_decision: "本服务看板只读既有 Redis 键（不新增键模式、不写）用于聚合；若最终归属 vehicle-service，则需改为 REST 调用"
      impact: "看板 fleet 块实现方式；跨服务读 Redis 的合规性需与 data-collector 契约一并确认"

    - id: 9
      question: "12.4 节端点清单未包含「规划质量评估」与「数据质量」查询端点（6.3 节含规划质量评估）"
      contract_decision: "不新增端点：规划质量指标并入算法评估报告与 analytics_result；若需独立端点须先核对 12.4 节并改契约"
      impact: "前端算法评估页面展示粒度；缺失端点会导致用户无法直接查看规划质量时序"

    - id: 10
      question: "看板 pipeline 块「遥测入库延迟 P95」数据来源（vehicle_telemetry 无入库时间列）"
      contract_decision: "暂定两种实现：Prometheus 查询（监控指标）或 Kafka 时间戳差估算；契约不新增列/表"
      impact: "看板数值准确性与依赖（Prometheus 查询需额外客户端与网络策略）"

    - id: 11
      question: "分析查询时间跨度上限与看板缓存键（设计文档未定义；Redis Key 设计不可更改）"
      contract_decision: "跨度上限 ANALYTICS_QUERY_MAX_RANGE_DAYS(7 天，超出 2001)；看板不做 Redis 缓存（避免新增键模式），如需缓存须先评审键设计"
      impact: "P95 ≤ 200ms 保障与查询灵活性；缓存决策影响看板高并发表现"

    - id: 12
      question: "consumer-groups.yaml 的 data-analytics 消费组契约修正（原 data-analytics-telemetry 订阅 telemetry_raw 且声明生产 telemetry_clean，与 topics.yaml「telemetry_clean 生产者 = data-collector」冲突；原 data-analytics-telemetry-clean 与之重复消费同一 Topic）"
      contract_decision: "按 6.2 节作业输入归并为 4 组：telemetry_clean → data-analytics-telemetry（4 作业）、telemetry_raw → data-analytics-telemetry-raw（数据质量监控）、event_raw → data-analytics-events、sensor_file → data-analytics-sensor-file；不再声明本服务生产 telemetry_clean"
      impact: "实时分析作业的 Topic 订阅与消费位点（独立 offset 才可对比原始/清洗数据）；若设计文档另有归属（如 data-analytics 负责清洗）需回改 topics.yaml 与两侧契约"
