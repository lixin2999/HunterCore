x-hunter-pending-confirmation:
  source: "本契约编写过程中发现的、设计文档未明确的决策点；确认后回填契约再实现代码"
  note: |
    以下条目**必须在实现前人工确认**（或确认「按契约默认执行」）。凡涉及字段名/错误码/Topic 名/阈值/状态名
    的核对，均不得在实现中擅自发明（规则 7），未确认前实现必须按 `contract_decision` 当前取值执行。
    确认后回填本文档与相关契约（openapi / kafka / database）。
  items:
    - id: 1
      question: "设计文档 §12.5（OTA 模块）原文未随仓库提供，无法逐条比对端点/字段/批次规则"
      contract_decision: "按模块职责表、网关路由表、附录 D 限流、附录 A 错误码、第 8/9 章 Kafka 与 DDL、第 14/15 章状态机与安全约束，推导 15 个业务端点（+3 个运维端点 /healthz /readyz /metrics）与全部请求/响应字段（见 x-hunter-endpoints.items 及各 operation 的推导说明）"
      impact: "Step 3/4（schemas / routers）实现范围；若 §12.5 原文与推导存在差异（路径、字段名、批次取整、状态名）需回改契约 + schema + migration"
    - id: 2
      question: "release_type 取值域（DDL 注释仅写「正式/灰度/补丁」，未给英文枚举）"
      contract_decision: "契约**不设 enum**（x-hunter-enum-reconciliation 已标注「待核对」），服务端存库即透传、不做取值白名单校验；前端不得硬编码分支"
      impact: "前端筛选/选项无法固定；若需强校验须确认英文枚举（formal / grayscale / patch）后补 enum 并同步 DDL 注释、Pydantic 模型与前端选项"
    - id: 3
      question: "任务 paused → resume 时是否允许人工指定批次推进（跳批）"
      contract_decision: "禁止跳批：resume 时 batch_no 仅允许「当前批次 +1」（或省略=自动推进），其余值 → 3003；推进仍需满足「观察窗口已结束 + 成功率 ≥ 门禁」"
      impact: "灰度流程被强制串行化（4 批全走完）；若业务需紧急跳批，须明确审批人 + 告警策略后修改契约（涉及 resume 语义与前端表单）"
    - id: 4
      question: "分片上传语义（S3 UploadId 复用、分片大小、断点续传是否由服务端代理）"
      contract_decision: "两步式预签名直传：part_count=1 用单次 PUT upload_url；part_count>1 由 create 返回 parts[]（每片一个预签名 URL），客户端自行分片并断点续传，服务端不代理 GB 级流量"
      impact: "Step 3 上传流程实现与前端上传组件；服务端无法感知上传进度（仅靠 publish 阶段校验），如需进度需 MinIO 事件回调（未登记）"
    - id: 5
      question: "回滚目标是否允许指定历史版本（非 A/B 非活动分区）"
      contract_decision: "仅支持 previous_slot（A/B 分区上一分区）；不提供「回滚到任意历史 version_code」，避免与 version_code 单调递增防回滚约束冲突"
      impact: "跨版本回退须发布一个 version_code 更高的「回退版本」承载旧镜像（见 GET /versions/{id} 的 rollback_target 字段语义）"
    - id: 6
      question: "任务暂停后 24h 观察窗口（observe_until）是否顺延"
      contract_decision: "不顺延：暂停不改变已记录的 observe_until；resume 后若窗口已过则立即按成功率判定推进/拒绝"
      impact: "批次推进时机与成功率统计窗口口径；若改为顺延会影响 progress JSONB 字段含义与前端展示"
    - id: 7
      question: "hunter.{vehicle_id}.ota_notify 的端到端下发时延目标（设计文档性能指标表未含 OTA 项）"
      contract_decision: "暂定 P95 ≤ 5s（契约登记为观察项，非验收硬指标）；其余性能指标沿用 P95 ≤ 200ms / 可用性 ≥ 99.9%"
      impact: "监控指标与验收口径；确认后需写入设计文档性能表并加 Prometheus 观测项"
    - id: 8
      question: "车端是否允许直连管理面 REST（本契约假设车端仅走 Kafka）"
      contract_decision: "车端仅通过 Kafka（ota_notify / ota_status / command）+ MinIO 预签名地址交互，不访问 /api/v1/ota/** REST；管理面仅面向控制台用户（JWT + RBAC）"
      impact: "网关路由与证书边界（车端 X.509 + Kafka SASL_SSL）；若车端需 REST 拉取版本清单，须新增端点为车端设备认证并回改契约"
    - id: 9
      question: "POST /versions/{id}/publish 为长耗时同步端点（GB 级流式 MD5/SHA-256 + RSA-2048 验签），网关转发超时是否 ≥300s"
      contract_decision: "保持同步语义（200 返回五项校验结论）并在 x-hunter-service.performance.exceptions 登记为性能例外（不受 P95 ≤ 200ms 约束）；网关侧超时须 ≥300s"
      impact: "网关超时/连接复用配置与前端加载体验；若要求 publish 也满足 P95 ≤ 200ms，须改为 202 + 异步任务 + 轮询端点（属端点新增，需先改契约）"
    - id: 10
      question: "publish 端点限流建议值（附录 D 未登记该端点）"
      contract_decision: "建议单用户 2 QPS（非附录 D 规定值，实现侧建议配置，见 x-hunter-service.rate_limits.recommended）"
      impact: "仅影响并发发布保护强度，不影响契约结构与业务语义"
    - id: 11
      question: "消费失败死信队列（DLQ）Topic 未在 contracts/kafka/topics.yaml 登记"
      contract_decision: "按 hunter_common.kafka.consumer 统一约定派生 `{original_topic}.dlq`（保留原 topic/partition/offset 头），**不新增 Topic 名**；topics.yaml 是否登记派生 DLQ 由契约维护方决定"
      impact: "DLQ 投递能力已可落地（实现不阻塞）；若要求 DLQ Topic 显式登记（分区/保留期），需更新 contracts/kafka/topics.yaml 后再实现投递策略细化"
    - id: 12
      question: "hunter.{vehicle_id}.command_result 是否登记为 ota-service 消费；hunter.broadcast.command 的 OTA 使用场景（如全车队暂停升级）设计文档未定义"
      contract_decision: "本服务**不消费** command_result（回滚结果以 ota_status + ota_records 终态为准）；broadcast.command **不生产**（未确认前禁用，避免对全车队下发未定义语义指令）"
      impact: "回滚指令的执行确认依赖车端 ota_status 上报（若车端只回 command_result 则回滚链路无闭环）；全车队操作只能逐车经 ota_notify 完成，如需广播须先更新 topics.yaml/consumer-groups.yaml"
    - id: 13
      question: "升级包大小上限（影响上传/校验耗时与存储规划）"
      contract_decision: "契约未设硬上限（package_size 仅要求 > 0 且与 MinIO 对象长度一致）；服务端按流式校验不落内存，理论无包体上限"
      impact: "前端上传提示与超时设置；若需硬上限（建议 500MB~4GB）须在 Pydantic 模型加校验并在前端同步提示，同时确认网关/客户端超时"
    - id: 14
      question: "小规模车队批次取整规则（5% 向上取整、至少 1 台、末批补足）"
      contract_decision: "按 ceil(percent × total) 取整、每批至少 1 台、末批（100%）补足全部剩余车辆（见 x-hunter-canary-rollout.rounding）"
      impact: "批次车辆分配与成功率分母（分母=本批已下发车辆数）；若确认其他规则（如向下取整）会改变小车队推进节奏"
    - id: 15
      question: "审计日志保留期（合规建议 ≥1 年）与 hunter-logs Bucket 30 天生命周期的冲突"
      contract_decision: "审计日志写入结构化 JSON 日志（落 hunter-logs，30 天自动删除）；⚠ 不满足 1 年可追溯建议，需人工确认是否独立保留策略或落库审计表"
      impact: "OTA 发布/回滚/回退的可追溯性合规；若需 ≥1 年，须新增审计表（DDL 契约变更）或独立 Bucket/前缀策略"
    - id: 16
      question: "是否允许停用灰度直接全量（OTA_CANARY_STAGES 置 100）作为紧急通道"
      contract_decision: "契约保留 4 批灰度（5/20/50/100）为唯一标准流程；OTA_CANARY_STAGES 可调但不提供「跳过前 3 批」的 API 语义，紧急全量由运维改环境变量实现（需留审计）"
      impact: "紧急修复发布时长（标准流程 ≥72h）；若业务需 API 级紧急全量，须新增审批 + 强制告警，属契约变更"
    - id: 17
      question: "OTA_PACKAGE_VERIFY_SHA256 / OTA_PACKAGE_VERIFY_SIGNATURE 安全开关是否允许关闭"
      contract_decision: "默认 true 且**生产禁止置 false**（仅 DEBUG 联调可关）；契约门禁（6001/6002）语义不因开关改变，开关仅用于联调替身"
      impact: "安全基线（完整性 + 签名不可绕过）；若关闭将直接违反设计文档 OTA 安全要求，需书面决策并留审计"
    - id: 18
      question: "目标车辆清单的存在性/在线性校验依赖：vehicle-service 未在模块表（6 个微服务）中定义，但网关路由表含 /api/v1/vehicle/**，且 infra/k8s/services/data-analytics.yaml 已预留 VEHICLE_SERVICE_BASE_URL(:8086)"
      contract_decision: "本服务**不调用** vehicle-service REST（该服务当前无 contracts 契约，依赖它会把未定义接口引入实现）：create 仅做 vehicle_id 格式与数量校验；start 的可用性判定读 Redis 读模型 vehicle:status:{vehicle_id} / vehicle:online:set"
      impact: "无法识别不存在的 vehicle_id（仅能判「不在线」→ 计入 blocked）；若后续 vehicle-service 契约落地，可新增可选内部校验（mTLS + VEHICLE_SERVICE_BASE_URL），并回改本契约与 K8s ConfigMap"
    - id: 19
      question: "OTA_OFFLINE_FALLBACK_ENABLED：Redis 中无某车辆 vehicle:status 读模型数据时，是否放行升级"
      contract_decision: "契约默认 **false = 缺门禁数据即拒绝**（计入 blocked[] 并给 reason，安全默认值，与 K8s 生产 ConfigMap 一致）；仅 DEBUG 联调可显式置 true，生产禁止"
      impact: "升级门禁严格性（false 更安全但可能因读模型缺失导致大量 blocked）；对齐 data-collector 写读模型的时效性后确认，若确认放行需补审计字段"
