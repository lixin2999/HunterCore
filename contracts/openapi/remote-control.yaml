    - RC_VIDEO_MIN_BITRATE_KBPS
    - RC_VIDEO_MAX_BITRATE_KBPS
    - RC_VIDEO_KEYFRAME_INTERVAL_S
    - MINIO_BUCKET_VIDEO
    # 共享（hunter-common-config）
    - ENVIRONMENT
    - LOG_LEVEL
    - DEBUG
    - CORS_ORIGINS
    - POSTGRES_HOST
    - POSTGRES_PORT
    - POSTGRES_USER
    - POSTGRES_DB
    - KAFKA_BOOTSTRAP_SERVERS
    - KAFKA_SECURITY_PROTOCOL
    - KAFKA_SASL_MECHANISM
    - KAFKA_SSL_CAFILE
    - KAFKA_PRODUCER_ACKS
    - KAFKA_COMPRESSION_TYPE
    - KAFKA_LINGER_MS
    - KAFKA_BATCH_SIZE
    - KAFKA_RETRIES
    - REDIS_HOST
    - REDIS_PORT
    - REDIS_DB
    - MINIO_ENDPOINT
    - MINIO_SECURE
    - JWT_ALGORITHM
    # 敏感（hunter-app-secrets；禁止写入代码/日志）
