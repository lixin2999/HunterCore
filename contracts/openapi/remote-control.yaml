  env_to_add: |
    ⚠ 以下配置键在本契约中新引入，尚未出现在 infra/k8s 配置中，Step 2/3 需同步补齐
    （见 x-hunter-pending-confirmation #12）：
    - RC_SESSION_HEARTBEAT_INTERVAL_S（默认 10，不可放宽）
    - RC_SESSION_HEARTBEAT_TIMEOUT_S / RC_SESSION_DEGRADED_MISSES
    - RC_HISTORY_QUERY_MAX_RANGE_DAYS（默认 31）
    - RC_ACK_TIMEOUT_MS（默认 100，性能指标守护值）
    - RC_COMMAND_RESULT_TOPIC_CONSUMER_GROUP（默认 remote-control-command-result）
    - SRS_API_URL / SRS_RTC_HTTP_URL / SRS_HOST / SRS_RTMP_PORT / SRS_RTC_UDP_PORT
    - RC_STUN_URLS / RC_TURN_URLS / RC_TURN_SHARED_SECRET / RC_ICE_CREDENTIAL_TTL_S
    - RC_PRESIGNED_DOWNLOAD_EXPIRE_SECONDS（默认 900）

x-hunter-endpoints:
  note: |
    契约定义顺序 = 实现顺序（契约先行）。每条端点均标注来源依据：`derived` 表示设计文档
    §12.6（远程操控模块 REST 清单）与 §8.3–8.5 原文未随仓库提供，由「附录 D 接口级限流端点
    `POST /api/v1/remote/session` + 网关契约 `x-hunter-websocket-routes`（`/ws/remote/**`）+
    远程操控安全约束（20Hz / >500ms 停车 / ≤2.0 m/s / 会话互斥）+ MinIO `hunter-video` 录像 +
    本仓库统一探针」推导；确认设计文档原文后回填本清单再进入 Step 4 路由实现。
  items:
    - { operationId: listControllableVehicles, method: GET,    path: "/api/v1/remote/vehicles",                rbac: "remote:read",    source: derived }
    - { operationId: listRemoteSessions,      method: GET,    path: "/api/v1/remote/sessions",                rbac: "remote:read",    source: derived }
    - { operationId: createRemoteSession,     method: POST,   path: "/api/v1/remote/session",                 rbac: "remote:create",  source: "附录 D 明列（POST /api/v1/remote/session）", rate_limit: "1 QPS/用户" }
    - { operationId: getRemoteSession,        method: GET,    path: "/api/v1/remote/session/{session_id}",    rbac: "remote:read",    source: derived }
    - { operationId: endRemoteSession,        method: DELETE, path: "/api/v1/remote/session/{session_id}",    rbac: "remote:execute", source: derived, note: "执行类动作而非资源删除（记录与录像保留）" }
    - { operationId: listControlHistory,      method: GET,    path: "/api/v1/remote/history",                 rbac: "remote:read",    source: derived }
    - { operationId: getControlHistoryDetail, method: GET,    path: "/api/v1/remote/history/{session_id}",    rbac: "remote:read",    source: derived }
    - { operationId: getControlVideo,         method: GET,    path: "/api/v1/remote/history/{session_id}/video", rbac: "remote:read", source: derived, note: "预签名 15 分钟 + Range 分片" }
    - { operationId: wsRemoteControl,         method: WS,     path: "/ws/remote/{session_id}/control",        rbac: "remote:execute", source: "网关 x-hunter-websocket-routes（/ws/remote/**）；子路径为契约推导", note: "20Hz 指令 + 回执 + 10s 心跳" }
    - { operationId: wsRemoteSignal,          method: WS,     path: "/ws/remote/{session_id}/signal",         rbac: "remote:create",  source: "网关 x-hunter-websocket-routes（/ws/remote/**）；子路径为契约推导", note: "WebRTC SDP/ICE 信令中继" }
    - { operationId: healthz,                 method: GET,    path: "/healthz",  rbac: none, source: "本仓库统一探针", security: [] }
    - { operationId: readyz,                  method: GET,    path: "/readyz",   rbac: none, source: "本仓库统一探针", security: [] }
    - { operationId: metrics,                 method: GET,    path: "/metrics",  rbac: none, source: "Prometheus 抓取", security: [] }
  forbidden:
    - "禁止新增端点而不先更新本契约（规则 7）"
    - |
      禁止提供 REST 形式的控制指令端点（如 `POST /remote/command`）：20Hz（50ms 间隔）指令必须走
      WS 控制通道 → Kafka `hunter.{vehicle_id}.remote_control`，HTTP 单发开销与连接复用成本会破坏
      「指令延迟 ≤100ms」性能指标
    - |
      禁止为普通用户提供「抢占他人会话」端点：会话互斥（同一车辆同一时间仅一名操作员，错误码 7001）
      不可更改；管理员强制结束统一走 `DELETE /api/v1/remote/session/{id}?reason=admin_terminate`
    - |
      禁止提供「修改车辆权威状态」端点（如直接把 vehicle:status 置为 remote_controlled）：
      车辆状态权威值属 vehicle-service，本服务只读 Redis 读模型

x-hunter-session-lifecycle:
  source: "系统约束第 15 条（远程操控安全约束，不可更改）+ 错误码 7001/4001/4002 + Redis rc:session"
  states: [connecting, active, degraded, ended]
  transitions:
    - { from: "(none)",     to: connecting, trigger: "POST /session 成功（锁占用 + Redis 写入 + 车端 session_start 下发）" }
    - { from: connecting,   to: active,     trigger: "视频（SRS 拉流就绪）与控制通道（WS 建连 + 首个 20Hz 指令回执）双就绪" }
    - { from: connecting,   to: ended,      trigger: "连接超时 / 视频建立失败（7002）→ 释放锁 + 下发 session_end + 归档" }
    - { from: active,       to: degraded,   trigger: "连续指令超时（>500ms 无回执）/ 视频 E2E > 200ms / 丢包超阈 / 心跳连续缺失 3 次" }
    - { from: degraded,     to: active,     trigger: "链路指标恢复（连续 3 个采样周期达标）" }
    - { from: active,       to: ended,      trigger: "DELETE /session（operator_end / admin_terminate）/ 心跳超时 / 车辆掉线 / 车端故障 / 服务停机" }
    - { from: degraded,     to: ended,      trigger: "上述结束条件任一命中" }
  end_convergence:
    - "先下发 `session_end`（车端减速停车）→ 再停止转发与录像 → 再封存 sidecar → 最后释放锁 + 删除 Redis 会话键"
    - "**任何路径都不依赖车端回执**：车端超时保护（>500ms 无指令自动减速停车）作为兜底，平台侧不下发『保持行驶』语义的指令"
    - "服务优雅停机（server_shutdown）：K8s terminationGracePeriodSeconds=60，先广播 session_end 再退出（见 infra/k8s/services/remote-control.yaml）"
  concurrency:
    - "创建会话：Redis 分布式锁（rc:lock:{vehicle_id}，超时自动释放）+ EXISTS rc:session 双检，冲突返回 7001"
    - "结束会话：仅持锁者可释放（锁值校验），避免他人误删他人会话"
    - "多副本：WS 长连接需会话粘性（Ingress/网关按 session_id 哈希），跨副本状态经 Redis 会话 Hash 共享"
  idempotency:
    - "创建：同用户对同车辆重复提交 → 第二次命中 7001（已存在会话），不产生双会话"
    - "结束：会话已结束 → 3001（视为不存在），不重复下发车端信令"
    - "指令：Kafka 消息含 session_id + seq，车端按 (session_id, seq) 判重"

x-hunter-websocket-contract:
  source: |
    网关契约 `contracts/openapi/api-gateway.yaml` → `x-hunter-websocket-routes`
    （`/ws/remote/**` → remote-control:8085；JWT 握手 + WSS + 1 QPS 限流 + 冲突码 7001）。
    子路径（`/control`、`/signal`）为契约推导（见 x-hunter-pending-confirmation #15）。
  paths:
    - operationId: wsRemoteControl
      path: "/ws/remote/{session_id}/control"
      purpose: "控制指令上行（20Hz）+ 回执/状态下行 + 10s 会话心跳"
      rbac: "remote:execute"
    - operationId: wsRemoteSignal
      path: "/ws/remote/{session_id}/signal"
      purpose: "WebRTC 信令中继（浏览器 ↔ 车端/SRS：SDP offer/answer、ICE candidate）"
      rbac: "remote:create"
  sticky_routing: |
    WS 为长连接：网关/Ingress 按 `session_id` 哈希做会话粘性路由（同一会话固定同一副本）；
    会话状态经 Redis `rc:session:{vehicle_id}` 共享，副本滚动重启（maxUnavailable=0）时客户端自动重连
    并复用同一会话（重连不重新占用锁）。⚠ 副本故障转移后的会话续期策略见 pending #14。
  handshake:
    auth: |
      JWT 经握手请求头携带：`Authorization: Bearer <token>`（或 `Sec-WebSocket-Protocol` 子协议传递，
      由前端统一封装）。**禁止**查询串明文 Token（违反日志脱敏与 URL 泄漏防护）。
    checks:
      - "JWT 签名/有效期校验：缺失或无效 → 1001；过期 → 1003"
      - "资源域校验：资源 `remote` + 动作（control 通道 execute / signal 通道 create）→ 不足 1002"
      - "会话归属校验：session_id 必须存在（Redis）且归属当前 user_id（管理员除外）→ 否则 1002 / 3001"
      - "会话状态校验：`ended` 或不存在 → 3001"
      - "Origin 白名单校验（CORS_ORIGINS）防跨站 WebSocket 劫持"
    failure: "握手阶段直接以 HTTP 4xx 拒绝（不进入帧循环）：1001 / 1003 / 1002 / 3001 / 7001"
  frames:
    control_uplink:
      - { type: control,   direction: "browser→platform", frequency: "20Hz（50ms）", fields: "session_id, seq, timestamp, control{target_velocity, target_steer, gear}" }
      - { type: heartbeat, direction: "browser→platform", interval_s: 10, fields: "session_id, timestamp" }
      - { type: estop,     direction: "browser→platform", fields: "session_id, reason", note: "紧急停车：立即下发 target_velocity=0 并按 x-hunter-control-channel.emergency 收敛会话" }
    control_downlink:
      - { type: ack,    direction: "platform→browser", fields: "session_id, seq, ack_latency_ms, vehicle_state", note: "来源 Kafka hunter.{vehicle_id}.command_result；受契约限制按 (session_id, seq) 时序近似关联（remote_control 无 command_id，见 x-hunter-control-channel.ack.correlation）" }
      - { type: status, direction: "platform→browser", fields: "status, degraded_reasons[], control_stats, video_stats", frequency: "1Hz 或状态变更时" }
      - { type: error,  direction: "platform→browser", fields: "code, message, request_id", note: "code 取预定义错误码（禁止自定义）" }
    signal:
      - { type: sdp,  direction: "both", fields: "sdp_type(offer/answer), sdp" }
      - { type: ice,  direction: "both", fields: "candidate, sdpMid, sdpMLineIndex" }
    close_codes:
      - { code: 1008, reason: "认证/权限失效（Token 过期或角色被回收）" }
      - { code: 4001, reason: "会话已结束或不存在（3001 语义）" }
      - { code: 4003, reason: "心跳超时（end_after_s 到达）" }
      - { code: 4010, reason: "被管理员强制结束（admin_terminate）" }
      - { code: 4008, reason: "同一会话建立了新连接（旧连接被替代）" }
  flow_control:
    - "上行超频（>25Hz）：服务端丢弃多余控制帧并计入 hunter_remote_control_frame_dropped_total{reason=\"over_frequency\"}；WS 不适用 HTTP 429"
    - "下行积压：发送队列滞后 > 200ms 时**优先丢弃旧 control/status 帧**（保时效），`ack` / `error` 不丢弃"
    - "单会话上行窗口：服务端仅保留最近 1 帧待处理控制指令（后到覆盖先到，20Hz 控制语义即最新值优先）"
  disconnect:
    - "浏览器断开 → 会话进入 `degraded`，等待心跳超时（60s）自动结束；期间车辆因 >500ms 无指令已减速停车"
    - "车端指令链路断开（Kafka 无回执）→ 会话 `degraded` + 前端 status 帧推送 degraded_reasons=[command_timeout]"

x-hunter-session-heartbeat:
  source: "系统约束第 15 条（心跳 10s）"
  interval_s: 10
  transport: "WS 控制通道 heartbeats 帧（前端每 10s 发送）；服务端刷新 Redis rc:session:{vehicle_id}.last_heartbeat_at"
  degraded_after_misses: 3
  end_after_s: 60
  on_end:
    - "下发 session_end（车端减速停车）→ 归档 → 释放锁 → 删除 Redis 会话键"
    - "归档 sidecar.end_reason=heartbeat_timeout，end_reason_source=timeout"
  metrics: "hunter_remote_control_heartbeat_timeout_total{vehicle_id}"
  pending: "⚠ 30s/60s 派生阈值见 x-hunter-pending-confirmation #4"

x-hunter-control-channel:
  source: "系统约束第 4/15 条 + contracts/kafka/schemas/remote_control.schema.json + contracts/kafka/topics.yaml（producer: remote-control）"
  transport: "浏览器 --WS(20Hz)--> remote-control --Kafka(20Hz)--> 车端（AGX Orin）"
  topic:
    name: "hunter.{vehicle_id}.remote_control"
    direction: platform_to_vehicle
    partitions: 3
    partition_strategy: hash(vehicle_id)
    key: vehicle_id
    acks: all
    frequency: "20Hz（50ms 间隔）"
    retention: "7 天"
    schema: "contracts/kafka/schemas/remote_control.schema.json"
  message_mapping:
    note: "WS 上行帧 → Kafka 消息字段一一映射；**不得新增字段**（schema additionalProperties=false）"
    fields:
      vehicle_id: "取自会话（rc:session:{vehicle_id}）"
      timestamp: "服务端生成时间（Unix epoch 秒，含毫秒）"
      seq: "会话内单调递增（rc:session.{vehicle_id}.seq_last 由服务端 INCR；不复用前端 seq 以防伪造）"
      session_id: "当前会话 UUID"
      operator_id: "JWT sub（操作员用户 ID）"
      control.target_velocity: "限幅到 [-RC_MAX_SPEED_MPS, +RC_MAX_SPEED_MPS]（默认 ±2.0 m/s）；服务端截断，不依赖车端裁剪"
      control.target_steer: "底盘转角量程标定值待确认 → 按 RC_MAX_STEER_RAD 限幅（pending #18）"
      heartbeat: "控制量无变化时仍以 20Hz 发送，heartbeat=true 维持链路与超时保护计时"
    ws_only: "WS 上行帧仅使用上述字段（不新增 gear 等未契约化字段）；前端附加字段由平台侧丢弃"
  ack:
    topic: "hunter.{vehicle_id}.command_result"
    consumer_group: "remote-control-command-result（contracts/kafka/consumer-groups.yaml 已登记，零改动）"
    subscribe_mode: regex_pattern
    idempotency_key: command_id
    latency_slo_ms: 100
    degrade_on_timeout_ms: 500
    correlation: |
      ✅ 时延判定：以「最近一次下发指令的 timestamp ↔ 回执到达时间」做链路时延统计；
      ⚠ 精确逐条关联受限：`remote_control` 契约**无 command_id 字段**，而 command_result 以
      command_id 为幂等键 → 当前仅能按 (vehicle_id, session_id, 时序窗口) 近似关联，
      见 `x-hunter-pending-confirmation` #16（如需精确关联，须先为操控指令契约补充 command_id
      或改用 command topic 承载）
  timing_guard:
    - "发送侧节流：单会话令牌桶 20Hz（50ms）；无新控制值时按 heartbeat=true 填充，保证车端超时计时不被触发"
    - "指令间隔 jitter ≤ ±5ms（100ms 端到端指标的 5%）"
    - "指令延迟 >100ms 连续 3 次 → 会话 degraded + 告警指标 hunter_remote_control_command_latency_seconds（见 x-hunter-observability.metrics）"
  session_signalling:
    topic: "hunter.{vehicle_id}.command"
    command_types_proposed: [rc_session_start, rc_session_end]
    note: |
      会话开始/结束的平台→车信令经 `hunter.{vehicle_id}.command` 下发（topics.yaml 已登记
      remote-control 为该 Topic 生产者），携带 command_id（可被 command_result 精确关联），
      params 内嵌 session_id / max_speed_mps / timeout_ms。
      ⚠ `command.schema.json` 的 `command_type` 取值域尚未定稿（"待设计文档 5.3 节核对"），
      上述两个取值需人工确认后回填契约，见 `x-hunter-pending-confirmation` #17

x-hunter-control-safety:
  source: "系统约束第 15 条（远程操控安全约束，不可更改）"
  command_hz: 20
  command_interval_ms: 50
  timeout_protection:
    vehicle_side_timeout_ms: 500
    behavior: "车端 >500ms 未收到控制指令 → 自动减速停车（车端兜底，不可依赖平台在线）"
    platform_side: ">500ms 无回执 → 会话 degraded；连续 3 次 → 结束会话并下发 session_end"
  speed_limit:
    max_speed_mps: 2.0
    configurable: RC_MAX_SPEED_MPS
    enforcement: "服务端对 target_velocity 限幅（Kafka schema 亦限制 ±2.0）；前端 UI 同步限幅仅作提示，不作安全依据"
  exclusivity:
    rule: "同一车辆同一时间仅允许一名操作员操控"
    mechanism: "Redis 分布式锁 rc:lock:{vehicle_id} + rc:session:{vehicle_id} 存在性双检"
    conflict_code: 7001
    http_status: 409
  authorization:
    rbac_resources: "remote（读 remote:read / 建 remote:create / 执行 remote:execute）"
    data_scope: "按车辆/项目隔离（user-service 授予）；操作员须显式被授予可操控车辆集合"
    audit: "创建/结束会话、紧急停车、管理员强制结束均写结构化审计日志（trace_id + operator_id + vehicle_id + session_id + 结果）"
  degraded_actions:
    - { condition: "指令回执超时 / 视频质量跌落 / 心跳缺失", action: "会话 degraded + 前端 status 帧推送 + 保持链路自愈（车端已因超时停车）" }
    - { condition: "车辆状态变为 fault / emergency / offline", action: "立即结束会话（4001/3003 语义归档 end_reason），不下发任何继续行驶指令" }
    - { condition: "OTA/充电中（车辆忙）", action: "禁止创建会话（4002），已在会话中则结束并归档" }
  forbidden:
    - "禁止绕过互斥（如共享 session 或复用他人 rc:session 键）"
    - "禁止在 degraded/ended 会话上继续下发控制指令（必须重新建会话）"
    - "禁止下发『保持速度』类指令对抗车端超时保护"

x-hunter-video-contract:
  source: "系统约束第 15 条（视频编码：H.264 硬编码 NVENC / 720p@30fps / 2–4Mbps / 关键帧 1s）+ 性能指标（端到端 ≤200ms）"
  encoding:
    codec: H.264
    encoder: "车端 AGX Orin NVENC 硬件编码（云端只转发/录制，不做转码）"
    profile: "待确认（`High` 或 `Baseline`，影响丢包恢复与浏览器兼容）→ pending #19"
    resolution: { width: 1280, height: 720 }
    fps: 30
    keyframe_interval_s: 1
    gop_frames: 30
    bitrate_kbps:
      min: 2048
      max: 4096
      config_keys: [RC_VIDEO_MIN_BITRATE_KBPS, RC_VIDEO_MAX_BITRATE_KBPS]
      adaptation: "起始取 RC_VIDEO_MAX_BITRATE_KBPS，网络劣化时自适应下探至 RC_VIDEO_MIN_BITRATE_KBPS（2–4 Mbps 区间不可越界）"
  transport:
    media: "WebRTC / SRTP（DTLS-SRTP 加密，媒体面不经 api-gateway）"
    signalling: "WSS `/ws/remote/{session_id}/signal` 中继 SDP/ICE（见 x-hunter-websocket-contract）"
    server: "SRS 5.0（WebRTC 转发 + 录像回写；应用名/流名与 WHIP/WHEP 端点待确认 → pending #10）"
    ice:
      stun: RC_STUN_URLS
      turn: RC_TURN_URLS
      credential: "TURN 短期凭据（HMAC-SHA1，TTL = RC_ICE_CREDENTIAL_TTL_S）"
      pending: "#12（SRS/TURN 接入参数需同步 K8s ConfigMap）"
    udp_exposure: "媒体 UDP 端口需在 K8s 以 NodePort/LoadBalancer 暴露（端口取值待契约确认后补齐，禁止预设未定义端口，见 infra/k8s/services/remote-control.yaml 注释）"
  latency_budget_ms:
    capture_encode: 50
    network: 100
    decode_render: 30
    total: 200
    measurement: "以 WebRTC getStats()（jitterBufferDelay + framesDecoded 时间轴）与服务端 RTP 时间戳换算；P95 写入归档 sidecar.video.e2e_latency_ms_p95"
  quality_guard:
    - "关键帧间隔 1s → 丢包后 1s 内可恢复画面（GOP=30）"
    - "码率/分辨率不支持浏览器侧上调（前端仅能请求降档，最终由车端 NVENC 与网络预算决定）"
    - "视频 E2E P95 > 200ms 持续 3 个采样周期 → 会话 degraded 并在 status 帧中携带 video_stats"
  ui: "前端原生 WebRTC（RTCPeerConnection + recvonly transceiver）；禁止使用第三方云视频服务"
  cross_reference: "schemas.VideoConfig / VideoStats / SrsMediaInfo / IceServer / RecordArchiveInfo"

x-hunter-history-archive:
  decision: |
    **方案 A（用户已确认）**：不新增数据库表 / ORM / Alembic migration。会话态唯一来源为 Redis
    `rc:session:{vehicle_id}`，操控记录持久化为「MinIO 录像对象 + 同目录 sidecar JSON」。
    如后续出现强一致统计/复杂过滤/数据权限强制隔离需求，须走
    「DDL → ORM → migration → 契约同步」完整链路（pending #1）。
  store: "MinIO hunter-video（SSE-S3 加密）"
  object_key_pattern:
    video: "remote-control/{vehicle_id}/{yyyy}/{mm}/{dd}/{session_id}.mp4"
    sidecar: "remote-control/{vehicle_id}/{yyyy}/{mm}/{dd}/{session_id}.json"
    note: "键规范与 schemas.RecordArchiveInfo / history 端点描述一致，**修改需先更新契约**"
  retention:
    days: 90
    managed_by: "MinIO 生命周期规则（系统约束第 7 条，不可更改）"
    on_expired: "对象自动消失 → `GET /history` 列表收缩、`GET /history/{id}/video` 返回 3001"
  upload: "SRS 录制产物由服务端直传 MinIO（不经浏览器）；预签名上传仅用于异常人工补录（1 小时有效）"
  download: "预签名 URL 15 分钟（900s）+ HTTP Range 分片（前端 seek）；URL 禁止落日志/缓存"
  sidecar_schema:
    schema_version: "1"
    note: "键名固定；实现侧 Pydantic 模型与之 1:1（写入前 JSON Schema 自校验）"
    keys:
      schema_version: string
      session_id: string(uuid)
      vehicle_id: string
      operator_id: string(uuid)
      operator_name: string|null
      started_at: number
      ended_at: number
      duration_s: integer
      end_reason: "SessionEndReason（operator_end / admin_terminate / vehicle_offline / vehicle_fault / command_timeout / heartbeat_timeout / video_lost / server_shutdown）"
      end_reason_source: "platform | vehicle | timeout"
      degraded_events: "array<{at, reason, detail}>（降级/恢复时间线）"
      video:
        object_key: string
        size_bytes: int64
        sha256: string
        container: "mp4"
        codec: "h264"
        width: integer
        height: integer
        fps: integer
        bitrate_kbps_avg: integer
        keyframe_interval_s: number
        e2e_latency_ms_p95: number
      control:
        commands_sent: integer
        commands_acked: integer
        ack_latency_ms_avg: number
        ack_latency_ms_p95: number
        timeout_events: integer
        max_speed_mps: number
      note: string|null
      environment: "{service_version: string, config_digest: string}"
  discoverability:
    by_vehicle_and_date: "前缀 `remote-control/{vehicle_id}/{yyyy}/{mm}/{dd}/` → ListObjectsV2 单次列举"
    by_session_id: |
      仅知 session_id 时需按桶内前缀检索（`ListObjectsV2` + 分页），对象量增大后开销上升
      （pending #8）；**约定 sidecar 与录像严格同前缀**，故可用
      `remote-control/` + 日期粗筛上限 RC_HISTORY_QUERY_MAX_RANGE_DAYS（默认 31）
  consistency:
    - "封存顺序：录像对象 PutObject 成功 → sidecar JSON PutObject 成功 → 才释放锁/删 Redis 键；sidecar 缺失视为归档失败并告警 hunter_remote_control_archive_failed_total"
    - "会话进行中录像对象可能存在但**未封存**：`GET /history` 仅列举 sidecar（未结束会话不出现），避免半成品可见"
    - "Redis 键删除与 MinIO 归档之间的最终一致残留窗口见 pending #5"

x-hunter-websocket-routes:
  authority: "权威定义在 `contracts/openapi/api-gateway.yaml` → `x-hunter-websocket-routes`；此处为镜像 + 本服务侧职责细化，**修改网关侧须同步本段**"
  routes:
    - path: /ws/remote/**
      target_service: remote-control
      target_port: 8085
      protocol: websocket
      security_protocol: "WSS（TLS 1.3）"
      auth: "JWT（握手阶段校验）"
      auth_detail: |
        本服务实现按 `Authorization: Bearer <token>` 头读取；网关侧「传送方式（Authorization 头 /
        Sec-WebSocket-Protocol / 首帧认证）」待人工确认（api-gateway 契约同标注），见
        `x-hunter-pending-confirmation` #20。**禁止查询串明文携带 Token**。
      constraints:
        - "控制指令 20Hz（50ms 间隔）；>500ms 未收到指令，车辆自动减速停车"
        - "远程操控最高速度 2.0 m/s（可配置）；视频 720p@30fps、H.264 硬编码、码率 2048–4096 kbps、关键帧间隔 1s"
        - "端到端视频延迟 ≤ 200ms、指令延迟 ≤ 100ms"
        - "响应/发送超时 3600s、关闭代理缓冲"
      rate_limit: "握手 1 QPS/用户（与 POST /api/v1/remote/session 同档，见 x-hunter-rate-limits）"
      error_codes: [1001, 1002, 4001, 4002, 5001, 7001, 7002]
  media_plane: "WebRTC 媒体（SRTP/UDP）**不经** api-gateway / Ingress，须在 K8s 单独暴露 UDP（见 x-hunter-video-contract.transport.udp_exposure）"

x-hunter-kafka:
  source: "contracts/kafka/topics.yaml + consumer-groups.yaml + schemas/*.schema.json（本服务相关条目均已登记，**本契约零改动**）"
  produces:
    - topic: "hunter.{vehicle_id}.remote_control"
      direction: platform_to_vehicle
      schema: "schemas/remote_control.schema.json"
      key: vehicle_id
      partitions: 3
      acks: all
      frequency: "20Hz（50ms）"
      compression: "lz4（KAFKA_COMPRESSION_TYPE，对齐车端）"
      linger_ms: 5
      batch_size: 16384
      retries: 3
      purpose: "控制指令（target_velocity / target_steer / heartbeat）"
    - topic: "hunter.{vehicle_id}.command"
      direction: platform_to_vehicle
      schema: "schemas/command.schema.json"
      key: vehicle_id
      partitions: 3
      acks: all
      frequency: "按需"
      purpose: "会话开始/结束信令（command_type 建议 rc_session_start / rc_session_end，取值域待确认 pending #17）"
  consumes:
    - topic_pattern: "hunter.*.command_result"
      group_id: remote-control-command-result
      subscribe_mode: regex_pattern
      schema: "schemas/command_result.schema.json"
      idempotency_key: command_id
      offset_commit: "手动提交（处理成功后提交；禁止自动提交）"
      purpose: "操控指令回执（success / result_code / data）"
      degrade_rule: ">500ms 无回执视为链路异常 → 会话 degraded / 终止"
      failure_handling: "解析或处理失败 → 重试（有限次）→ 死信队列(DLQ) + 告警，不阻塞分区消费（禁止吞异常）"
  security: "SASL_SSL + SCRAM-SHA-512（KAFKA_SECURITY_PROTOCOL / KAFKA_SASL_MECHANISM）；禁止 PLAINTEXT"
  producer_lifecycle: |
    Producer **单例**（common/python/hunter_common/kafka 封装，lifespan 初始化）；禁止按会话创建 Producer
    （20Hz × N 会话会耗尽连接与线程）。消费侧 rdkafka 使用异步回调，禁止在回调中阻塞等待。
  contract_change_needed: "无（除非采纳 pending #16/#17 的改动建议，届时须先更新 Kafka 契约）"

x-hunter-rate-limits:
  source: "系统约束第 11 条（附录 D）"
  global: { qps: 10000, scope: "整个平台" }
  per_user: { qps: 100, scope: "单用户全部接口" }
  per_ip: { qps: 200, scope: "单 IP 全部接口" }
  endpoint_specific:
    - { endpoint: "POST /api/v1/remote/session", limit: "1 QPS/用户", source: "附录 D 明列", reason: "接管创建属重动作（占用车辆 + 建媒体流）" }
    - { endpoint: "WS 握手 /ws/remote/**", limit: "1 QPS/用户", source: "网关契约", note: "仅限握手，已建立连接的 20Hz 指令不受 QPS 限流约束（否则无法满足 20Hz）" }
    - { endpoint: "其他 /api/v1/remote/**", limit: "未单列 → 适用全局 10000 / 单用户 100 / 单 IP 200" }
  kafka_side_limits:
    - "操控指令下行 20Hz/会话（由令牌桶保证，非 Redis 限流）"
    - "车端上行遥测单车 ≤100 msg/s（非本服务职责，仅引用系统约束）"
  implementation: |
    Redis 计数器 `rate_limit:{ip}:{api}`（INCR + EXPIRE，窗口 60s，见 `hunter_common.redis.incr_with_expire`）；
    超限 → **HTTP 429** + `code=5001`（错误码表无专用限流码，**禁止自造**）+ `Retry-After`，
    并计入 `hunter_remote_control_rate_limited_total`。
  no_bypass: "限流在服务侧与网关侧双重生效；禁止仅为压测关闭限流（生产配置 ENVIRONMENT=prod 时强制开启）"

x-hunter-error-status-map:
  note: "统一响应体 `{code,message,data,request_id,timestamp}`（规则 2）；**code 仅取预定义错误码表，禁止自造**；HTTP 状态码与 code 的映射如下（全服务一致）"
  mapping:
    - { code: 0,    http: 200, meaning: "成功（含会话创建/结束的归档摘要返回）" }
    - { code: 1001, http: 401, meaning: "未认证（Token 缺失/无效；REST 与 WS 握手一致）" }
    - { code: 1003, http: 401, meaning: "Token 过期（响应头可带 X-Request-ID 便于追踪）" }
    - { code: 1002, http: 403, meaning: "无权限（缺 remote:read/create/execute 或数据域不含该车辆）" }
    - { code: 2001, http: 422, meaning: "参数错误（视频参数越界、page_size>200、时间范围超限）" }
    - { code: 2002, http: 422, meaning: "参数缺失（vehicle_id 等必填缺失）" }
    - { code: 3001, http: 404, meaning: "资源不存在（会话已结束/不存在、录像或 sidecar 缺失、车辆不存在）" }
    - { code: 3002, http: 409, meaning: "资源已存在（保留：本服务无唯一键写入场景，仅当采纳 pending #1 建表后启用）" }
    - { code: 3003, http: 409, meaning: "资源状态冲突（如会话处于 connecting 尚不可结束、录像未封存完成）" }
    - { code: 4001, http: 409, meaning: "车辆不在线（vehicle:online:set 不含该车）" }
    - { code: 4002, http: 409, meaning: "车辆忙（OTA 中 / 充电中 / fault / emergency）" }
    - { code: 5000, http: 500, meaning: "服务器内部错误（未预期异常；响应不含堆栈，细节入日志）" }
    - { code: 5001, http: 503, meaning: "服务不可用（Redis/Kafka/MinIO/SRS 依赖不可用）" }
    - { code: 5001, http: 429, meaning: "限流触发（复用 5001，无专用限流码；响应带 Retry-After，见 x-hunter-rate-limits）" }
    - { code: 6001, http: 502, meaning: "（OTA 域，本服务不使用）" }
    - { code: 6002, http: 502, meaning: "（OTA 域，本服务不使用）" }
    - { code: 6003, http: 409, meaning: "（OTA 域，本服务不使用）" }
    - { code: 7001, http: 409, meaning: "远程操控会话冲突（车辆已被其他操作员操控；data 携带占用者信息）" }
    - { code: 7002, http: 502, meaning: "远程操控视频建立失败（SRS/WebRTC 协商失败，会话不成立）" }
  conventions:
    - "`request_id` 与 `X-Request-ID` 响应头一致；日志与响应同源（trace_id 贯穿）"
    - "错误响应 `data` 可为结构化上下文（如 7001 的占用者、3001 的 bucket/object_key），但**禁止含 Token/密码/私钥/预签名 URL 全量**"
    - "WS 帧错误不改变 HTTP 映射：以 `{type: error, code, message, request_id}` 下发同一 code"

x-hunter-observability:
  source: "规则 6（可观测性）+ 共享库 common/python/hunter_common（logging / metrics / middleware）"
  logging:
    library: "structlog（JSON 输出）"
    required_fields: [timestamp, level, service, trace_id, request_id]
    conditional_fields: "vehicle_id / session_id / operator_id（涉及时必带）；**禁止输出 password / token / 私钥 / 预签名 URL**"
    audit_events: ["会话创建/结束（session_id, vehicle_id, operator_id, end_reason）", "紧急停车（estop）", "管理员强制结束", "限流触发", "会话冲突（7001）"]
  metrics:
    shared:
      - "hunter_http_requests_total{method,path,status}"
      - "hunter_http_request_duration_seconds{method,path}（P95 ≤ 200ms 由 Grafana 计算）"
      - "hunter_http_requests_in_progress"
      - "hunter_service_info"
    service_specific:
      - "hunter_remote_control_sessions_active{vehicle_id}（Gauge，当前活跃会话数；互斥下单车 ≤1）"
      - "hunter_remote_control_session_conflicts_total{vehicle_id}（Counter，7001 次数）"
      - "hunter_remote_control_commands_total{result=\"sent|acked|timeout\"}（Counter，20Hz 指令与回执）"
      - "hunter_remote_control_command_latency_seconds（Histogram，桶 0.01/0.05/0.1/0.2/0.5；目标 P95 ≤ 0.1）"
      - "hunter_remote_control_video_e2e_latency_seconds（Histogram，桶 0.05/0.1/0.2/0.5/1；目标 P95 ≤ 0.2）"
      - "hunter_remote_control_frame_dropped_total{reason}（Counter，over_frequency|backpressure）"
      - "hunter_remote_control_heartbeat_timeout_total{vehicle_id}（Counter）"
      - "hunter_remote_control_archive_failed_total{stage=\"video|sidecar\"}（Counter）"
      - "hunter_remote_control_rate_limited_total{endpoint}（Counter）"
    endpoint: "GET /metrics（Prometheus 抓取；K8s 注解 prometheus.io/scrape=true / port=8085 / path=/metrics）"
  tracing: "trace_id 由网关注入（X-Request-ID / traceparent），本服务透传至 Kafka 消息头与日志；WS 连接级 trace_id"
  probes:
    healthz: "GET /healthz → 200 {status: healthy}（存活；不依赖外部组件）"
    readyz: "GET /readyz → 200/503 {status, checks{database, redis}}（就绪；database 仅作共享连接池自检，本服务无业务表 → pending #9）"
  alerts_proposed:
    - { condition: "session_conflicts_total 5 分钟内增幅 > 10", severity: warning, note: "疑似脚本抢占或多操作员争抢" }
    - { condition: "archive_failed_total 增幅 > 0", severity: critical, note: "录像/元信息归档失败，取证数据缺失" }
    - { condition: "video_e2e_latency P95 > 0.2s 持续 5 分钟", severity: critical, note: "违反 ≤200ms 性能指标" }
    - { condition: "command_latency P95 > 0.1s 持续 5 分钟", severity: critical, note: "违反 ≤100ms 性能指标" }

x-hunter-pending-confirmation:
  note: |
    以下条目**必须在 Step 4（路由/业务实现）之前人工确认**。标记 `blocking` 的条目若未确认，
    实现将依赖本契约的推导结论（可能偏离设计文档 §8.3–8.5 / §12.6 原文）。设计文档原文未随仓库提供，
    故本契约端点与扩展字段均为推导结果。
  items:
    - id: 1
      title: "操控记录的持久化载体（方案 A 已定，确认其能力边界可接受）"
      status: decided
      decision: "不新增数据库表：会话态 = Redis rc:session:{vehicle_id}；操控记录 = MinIO hunter-video 录像 + 同目录 sidecar JSON"
      consequence: "历史查询无 SQL 过滤/聚合能力（仅 MinIO 列举 + 逐条解析 sidecar），total 非 DB COUNT；数据权限靠应用层判断；不支持跨会话统计报表"
      blocking: false
      files: [contracts/openapi/remote-control.yaml, contracts/database/ddl/00_schemas.sql]
      escalate_if: "产品要求『按延迟/结束原因/指令数排序与聚合』或『强制按车辆/项目隔离到存储层』→ 需新增 remote_control.sessions 表（DDL→ORM→migration→契约同步）"
    - id: 2
      title: "Redis vehicle:status:{vehicle_id} 的 Hash 字段清单（本服务只读依赖）"
      status: open
      current: "本契约按 status / battery_soc / velocity / last_online_time / (fault_code / control_mode 可能) 消费；字段名与实际写入方（vehicle-service）必须一致"
      blocking: true
      files: [contracts/openapi/remote-control.yaml, services/vehicle-service, contracts/database]
      decision_needed: "由 vehicle-service 契约（或共同约定的 Redis 读模型契约）定稿字段名与语义；本服务不写该键"
    - id: 3
      title: "block_reason 值域"
      status: open
      current: "[offline, upgrading, charging, fault, emergency, already_controlled]（契约推导）"
