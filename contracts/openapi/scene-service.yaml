        调用 CARLA 管理 API stop 子路径；释放 `vil:session:{vehicle_id}` / `vil:active`，
        并延迟删除动态 Topic（`SIM_TOPIC_DELETE_DELAY_SECONDS`）。终态实例返回 3003。
      operationId: cancelSimulation
