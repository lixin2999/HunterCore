# =====================================================================
# HunterCore 场景生成服务契约（OpenAPI 3.0.3）—— 单一事实来源
# 来源：设计文档 4 章（4.2.1 场景分类体系 / 4.2.2 场景配置结构 / 4.3 场景导出 /
#       4.4 场景下发到 Carla / 4.5 实车场景自动提取）、12.2 节（scene-service REST API）、
#       附录 A（错误码）、附录 D（限流）、MinIO Bucket 规划、Redis Key 设计
# 实现：services/scene-service（FastAPI 0.100+，端口 8081）；变更必须先改本文件再改代码
#
# 范围说明：
#   - 网关前缀 /api/v1/scene（不可更改，见 contracts/openapi/api-gateway.yaml 的
#     x-hunter-gateway-routes）；网关不剥离前缀，本服务按全路径注册路由
#   - 实车场景自动提取（4.5 节）无 REST 端点：由 Kafka 消费 analytics_result 触发
#     （契约 contracts/kafka/schemas/analytics_result.schema.json）
#
# ⚠ 待核对（设计文档未明确，需人工确认后回填；禁止擅自新增端点 / 字段 / 错误码 / 阈值）：
#   1) scenes.scene_type 取值域：已定稿为**可扩展受控字典**（单一事实来源
#      contracts/scene-taxonomy.yaml；48 叶子类型，对齐 GB/T 47025 覆盖面，可按分类持续扩充）；
#      编码值与「分类 → 类型」映射见 x-hunter-scene-types；入库时由应用层按字典校验（越界拦截）
#   2) 4.4 节第 6/7 步（实时监控仿真进度、保存仿真结果）：已按决策 G-20① 补
#      GET /api/v1/scene/simulations/{sim_instance_id}（进度）与 …/result（结果）查询端点，
#      服务端无状态代理 Carla 管理 API；设计文档 12.2 节清单同步登记见 x-hunter-endpoints
#   3) spawn_point / actor.behavior / event.trigger / event.action 内部结构未定义
#      （spawn_point 已定稿：坐标语义见 x-hunter-scene-config-contract.spawn_point_semantics，
#       有效性校验与占位原点替换属仿真端职责，见 x-hunter-simulation-flow.spawn_point_dispatch）
#   4) scenes.status 含 archived，但 12.2 节无归档端点（本契约不新增）
#   5) 场景导出返回形式（直接返回 XML 文本 / MinIO 预签名 URL）未定义；本契约按
#      MinIO hunter-scene-assets + 预签名下载（15 分钟）
#   6) Carla 管理 API 地址、仿真并发上限、场景时长上限未定义（禁止硬编码，需环境变量）
# =====================================================================
openapi: 3.0.3

info:
  title: HunterCore - scene-service
  version: 0.1.0
  description: |
    场景生成服务统一契约（端口 8081，网关前缀 `/api/v1/scene`）。

    **统一响应**：`{code, message, data, request_id, timestamp}`；`code=0` 成功，非 0 为预定义错误码（附录 A）。

    **场景分类**（4.2.1 节）：基础 / 交互 / 环境 / 极端（Corner Case）/ 自定义 / 实车回放六大分类下的
    **叶子类型为可扩展受控字典**（`contracts/scene-taxonomy.yaml`，当前 48 类，对齐 GB/T 47025 覆盖面，
    可按分类持续扩充）；编码值与「分类 → 类型」映射见 `x-hunter-scene-types`。

    **场景配置结构**（4.2.2 节，不可更改）：场景元信息（scene_id / scene_name / scene_type /
    description / version / creator / tags）+ map / ego_vehicle / weather / actors[] / events[] /
    success_criteria / duration；字段与落库位置映射见 `x-hunter-scene-config-contract`。

    **状态机**：`draft → published → archived`（`scenes.status`，受控词表）；仅 `draft` 可编辑。

    **鉴权**：请求经网关校验 JWT 后转发，服务侧按 RBAC 资源域 `scene` 校验
    （permissions.resource=scene，action ∈ create/read/update/delete/execute）。

    **限流**：本服务无专属限流（附录 D 仅 3 条接口级限流，不含 scene），继承网关五级限流
    （全局 10000 QPS / 单用户 100 QPS / 单 IP 200 QPS）。

    **性能**：API 响应 P95 ≤ 200ms（13.2 节）；场景列表默认分页 20 条、上限 200 条。
  license:
    name: Proprietary - HunterCore

servers:
  - url: https://hunter-core.example.com
    description: 生产环境（经网关 /api/v1/scene 转发）
  - url: http://localhost:8081
    description: 本地开发（直连服务）

tags:
  - name: scenes
    description: 场景库管理（CRUD + 分类 + 标签 + 搜索 + 复制 + 发布）
  - name: templates
    description: 场景模板（4.2.1 分类体系预置模板，用于快速创建）
  - name: export
    description: 场景导出（Carla ScenarioRunner XML / OpenSCENARIO 1.2）
  - name: simulation
    description: 场景下发到 Carla 仿真（4.4 节下发流程）
  - name: sim-node
    description: 仿真节点控制面（V1.24.0：注册/心跳 + 地址自学习，按节点动态直推 CARLA 管理 API）
  - name: ops
    description: 运维探针与指标（K8s probe / Prometheus 抓取）


security:
  - bearerAuth: []

paths:
  /api/v1/scene:
    get:
      tags: [scenes]
      summary: 查询场景列表（分页 + 分类/状态/标签/关键字筛选）
      description: |
        场景库列表。默认按 `create_time DESC` 排序（命中索引
        `idx_scenes_status_type_create_time`）；`tags` 为包含查询（PostgreSQL `@>`，命中 GIN 索引）；
        `keyword` 对 `scene_name`/`description` 做不区分大小写的模糊匹配。
        软删除场景（`deleted_at` 非 NULL）一律不出现在结果中。
      operationId: listScenes
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: scene_type
          in: query
          required: false
          description: 场景类型（取值见 `x-hunter-scene-types`）
          schema: { $ref: "#/components/schemas/SceneType" }
        - name: status
          in: query
          required: false
          description: 场景状态（受控词表 draft/published/archived）
          schema: { $ref: "#/components/schemas/SceneStatus" }
        - name: tags
          in: query
          required: false
          description: 标签（可重复传参，多标签为 AND 关系）
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 32 }
        - name: keyword
          in: query
          required: false
          description: 名称/描述模糊搜索关键字
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: creator
          in: query
          required: false
          description: 创建者 user_id（数据权限隔离时由服务端强制注入）
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          required: false
          description: 排序字段（白名单，禁止任意字段排序以防注入）
          schema:
            type: string
            enum: [create_time, update_time, scene_name, version]
            default: create_time
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: 场景列表
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneListResponse" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      tags: [scenes]
      summary: 创建场景（场景编辑器保存）
      description: |
        创建场景，`status` 固定为 `draft`（不可由请求指定），`creator` 取自网关注入的
        `X-User-Id`，`version` 默认 `1.0.0`。
        `config` 结构必须与 4.2.2 节完全一致（见 `x-hunter-scene-config-contract`）。
        `scene_name` 在同一存活场景内唯一（`uq_scenes_scene_name`），冲突返回 3002。
      operationId: createScene
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneCreateRequest" }
      responses:
        "201":
          description: 创建成功（返回完整场景对象，status=draft）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneResponse" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "409":
          description: 场景名称已存在（code=3002）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scene/templates:
    get:
      tags: [templates]
      summary: 查询场景模板列表
      description: |
        返回 4.2.1 分类体系下的预置场景模板（基础 / 交互 / 环境 / 极端场景），用于场景编辑器一键创建；
        模板 `config` 为 4.2.2 结构，可直接作为 `POST /api/v1/scene` 的 `config` 提交。
        `real_vehicle`（实车回放）为 4.5 节自动提取产物，无预置模板，故不在 `category` 枚举中。
        ⚠ 模板数据来源（内置静态清单 / 数据库 / MinIO 资源）设计文档未定义，
        见 `x-hunter-pending-confirmation`。
      operationId: listSceneTemplates
      parameters:
        - name: category
          in: query
          required: false
          description: 模板分类（4.2.1 节分类）
          schema:
            type: string
            enum: [basic, interactive, environment, corner_case, custom]
        - name: scene_type
          in: query
          required: false
          schema: { $ref: "#/components/schemas/SceneType" }
      responses:
        "200":
          description: 模板列表（不分页：模板数量受 4.2.1 分类体系约束）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneTemplateListResponse" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scene/{scene_id}:
    get:
      tags: [scenes]
      summary: 查询场景详情
      description: |
        返回场景完整对象（含 4.2.2 结构 `config`）。
        结果按 Redis 契约缓存：`cache:scene:{scene_id}`（String(JSON)，TTL 1 小时），
        任何写操作（PUT / DELETE / publish / duplicate 的源场景无关）后失效。
      operationId: getScene
      parameters:
        - $ref: "#/components/parameters/SceneIdPath"
      responses:
        "200":
          description: 场景详情
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneResponse" }
        "404": { $ref: "#/components/responses/SceneNotFound" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

    put:
      tags: [scenes]
      summary: 更新场景（仅 draft 可编辑）
      description: |
        全量更新场景可编辑字段。规则（4.2 节 + `scenes.status` 受控词表）：
        - 仅 `draft` 状态可编辑；`published` / `archived` 返回 3003
        - `scene_id` / `creator` / `create_time` / `status` / `version` 不可被请求修改
        - `scene_name` 与其它存活场景冲突返回 3002
        - 更新成功后 `update_time` 由触发器/ORM 自动维护
      operationId: updateScene
      parameters:
        - $ref: "#/components/parameters/SceneIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneUpdateRequest" }
      responses:
        "200":
          description: 更新后的场景对象
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneResponse" }
        "404": { $ref: "#/components/responses/SceneNotFound" }
        "409": { $ref: "#/components/responses/SceneStateConflict" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      tags: [scenes]
      summary: 删除场景（软删除）
      description: |
        软删除：置 `deleted_at`，不物理删除（保留审计与历史引用）。
        仅 `draft` / `archived` 可删除；`published` 场景必须先归档，直接删除返回 3003
        （⚠ 该规则由契约补充，设计文档只规定「仅 draft 可编辑」，见 `x-hunter-pending-confirmation`）。
      operationId: deleteScene
      parameters:
        - $ref: "#/components/parameters/SceneIdPath"
      responses:
        "200":
          description: 删除结果
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneDeleteResponse" }
        "404": { $ref: "#/components/responses/SceneNotFound" }
        "409": { $ref: "#/components/responses/SceneStateConflict" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scene/{scene_id}/duplicate:
    post:
      tags: [scenes]
      summary: 复制场景（生成新草稿）
      description: |
        以源场景 `config` 为模板创建新场景：新 `scene_id`，`status=draft`，
        `creator` = 当前用户，`version` 重置为 `1.0.0`；
        未指定 `new_scene_name` 时按 `<源名称>-copy`（冲突则追加序号）生成，仍冲突返回 3002。
      operationId: duplicateScene
      parameters:
        - $ref: "#/components/parameters/SceneIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneDuplicateRequest" }
      responses:
        "201":
          description: 复制成功（返回新场景，status=draft）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneResponse" }
        "404": { $ref: "#/components/responses/SceneNotFound" }
        "409":
          description: 新场景名称已存在（code=3002）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }


  /api/v1/scene/{scene_id}/publish:
    post:
      tags: [scenes]
      summary: 发布场景（draft → published）
      description: |
        发布后场景不可再编辑（仅 `draft` 可编辑），可被 `POST /api/v1/scene/{scene_id}/run`
        下发到 Carla 仿真与导出。
        规则：仅 `draft` 可发布，其它状态返回 3003；发布前服务端再做一次 4.2.2 结构完整性校验。
        ⚠ 版本号递增策略（是否在发布时提升 `version`）设计文档未定义：本契约规定
        `version` 在发布时保持不变，由请求显式指定时才更新（见 `x-hunter-pending-confirmation`）。
      operationId: publishScene
      parameters:
        - $ref: "#/components/parameters/SceneIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScenePublishRequest" }
      responses:
        "200":
          description: 发布后的场景对象（status=published）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneResponse" }
        "404": { $ref: "#/components/responses/SceneNotFound" }
        "409": { $ref: "#/components/responses/SceneStateConflict" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scene/export:
    post:
      tags: [export]
      summary: 导出场景（Carla ScenarioRunner XML / OpenSCENARIO 1.2）
      description: |
        按 4.3 节将场景配置导出为仿真可执行文件：

        | format | 产物 | 说明 |
        |--------|------|------|
        | `carla_scenariorunner_xml` | `.xml` | Carla ScenarioRunner 场景文件 |
        | `openscenario_1_2` | `.xosc` | OpenSCENARIO 1.2 标准描述文件（写入 `x-scenario-version`） |

        产物上传 MinIO `hunter-scene-assets`（生命周期：永久），返回预签名下载地址
        （MinIO 契约：下载有效期 15 分钟，支持 Range 分片下载）。
        ⚠ 导出返回形式（文本直返 / MinIO 地址）设计文档未定义，本契约按 MinIO 方案，
        见 `x-hunter-pending-confirmation`。
      operationId: exportScenes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneExportRequest" }
      responses:
        "200":
          description: 导出结果（含预签名下载地址）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneExportResponse" }
        "404": { $ref: "#/components/responses/SceneNotFound" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scene/{scene_id}/run:
    post:
      tags: [simulation]
      summary: 下发场景到 Carla 仿真（4.4 节流程）
      description: |
        按 4.4 节流程下发：① 校验场景配置完整性 → ② 调用 Carla 管理 API 创建仿真实例 →
        ③ 下发场景配置 JSON → ④ Carla 加载地图、生成参与者、设置环境 →
        ⑤ 返回 `sim_instance_id`，场景运行状态置 `running` → ⑥ 实时监控仿真进度 →
        ⑦ 仿真结束回收资源并保存结果（步骤 6/7 的实现方式见 `x-hunter-simulation-flow`）。

        规则：
        - 仅 `published` 场景可下发，其它状态返回 3003
        - Carla 管理 API 不可达/超时返回 5001（依赖服务不可用）
        - 同一场景已有 `running` 实例时按 `sim_config.allow_parallel` 决定复用或 3003
        - 参数覆盖（`param_overrides`）仅覆盖 4.2.2 白名单路径，禁止新增结构字段
        - 自车出生点按场景存量值**原样下发**（V1.25.0）：平台不再拦截落在地图原点的出生点
          （旧口径：此类下发返 2001）。有效出生坐标只能由实机 CARLA 查询得到，因此坐标
          有效性校验与占位原点替换属仿真端（HunterSim）职责；载荷只声明
          `spawn_semantics: relative_to_ego`（口径见 `x-hunter-simulation-flow.spawn_point_dispatch`）

        下发链路（`SIM_DISPATCH_MODE`，见 `x-hunter-simulation-flow.node_dispatch`）：
        - `direct`（默认）：固定地址 `CARLA_MANAGEMENT_ENDPOINT`；
        - `node`：先选在线节点，再按该节点**当前学习到的** `ip:manager_port` 构造基址，
          子路径与请求体与 direct 完全共用；无在线节点 → 5001「无可用仿真节点」。
      operationId: runScene
      parameters:
        - $ref: "#/components/parameters/SceneIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneRunRequest" }
      responses:
        "200":
          description: 下发成功（返回仿真实例信息）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneRunResponse" }
        "404": { $ref: "#/components/responses/SceneNotFound" }
        "409": { $ref: "#/components/responses/SceneStateConflict" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scene/simulations/{sim_instance_id}:
    get:
      tags: [simulation]
      summary: 查询仿真实例进度（4.4 节第 6 步，决策 G-20①）
      description: |
        服务端**无状态代理**：转发到 Carla 管理 API 实例查询接口并透传进度字段，
        平台不落库仿真实例状态（无实例表，Carla 为唯一事实来源）。

        规则：
        - 实例不存在（Carla 返回 404）→ 3001
        - Carla 管理 API 未配置 / 不可达 / 非 404 的 4xx/5xx / 响应结构非法 → 5001
        - `progress_percent` 等进度字段 Carla 未提供时置 null（前端按 status 降级展示）
        - 实例子路径经 `CARLA_INSTANCE_GET_PATH` 环境变量注入（⚠ Carla API 形状待确认 #9）
      operationId: getSimulationProgress
      parameters:
        - $ref: "#/components/parameters/SimInstanceIdPath"
      responses:
        "200":
          description: 查询成功（仿真实例进度快照）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationProgressResponse" }
        "404": { $ref: "#/components/responses/SimInstanceNotFound" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scene/simulations/{sim_instance_id}/result:
    get:
      tags: [simulation]
      summary: 查询仿真实例结果（4.4 节第 7 步，决策 G-20①）
      description: |
        仅终态实例（`succeeded` / `failed` / `canceled`）可查询结果；
        非终态（`pending` / `running`）返回 3003（结果未就绪）。

        规则：
        - 产物 `artifacts[].object_key` 落在 hunter-scene-assets 时，服务端换发
          预签名下载地址（有效期 15 分钟，与 4.3 节导出策略一致）
        - 实例不存在（Carla 返回 404）→ 3001；Carla 不可达等 → 5001（同进度端点）
        - 结果子路径经 `CARLA_INSTANCE_RESULT_PATH` 环境变量注入（⚠ 待确认 #9）
      operationId: getSimulationResult
