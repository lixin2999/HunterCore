              schema: { $ref: "#/components/schemas/SimulationControlResponse" }
        "404": { $ref: "#/components/responses/SimInstanceNotFound" }
        "409": { $ref: "#/components/responses/SceneStateConflict" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
