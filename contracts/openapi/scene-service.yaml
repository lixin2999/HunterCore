  # =====================================================================
  # 仿真节点控制面（V1.24.0，tag: sim-node）
  # 实机拓扑：平台有线接交换机、HunterSim 走 WiFi 出向连平台，但二者同网段
  # （实录 192.168.31.35 可访问 192.168.31.20:8090）⇒ 平台可回访节点上的 CARLA 管理端口。
  # 节点每次注册/心跳时，服务从**入站请求头学习来源地址**并覆盖登记；下发时按 node_id
  # 取出当前地址构造 `http://{ip}:{port}` 基址（语义见 x-hunter-simulation-flow.node_dispatch）。
  # 路由注册顺序约束：本组路径必须先于 /api/v1/scene/{scene_id} 实现（否则 node_id 会被 scene_id 抢先匹配）。
  # =====================================================================
  /api/v1/scene/sim-nodes:
    get:
      tags: [sim-node]
      summary: 查询仿真节点清单（含在线状态与当前下发的目标地址）
      description: |
        运维视图（RBAC `scene:read`，普通用户令牌即可）：`online` = 心跳未落后超租约
        （`SIM_NODE_LEASE_SECONDS`）；`endpoint_ip` / `manager_port` / `protocol` /
        `endpoint_source` / `learned_at` 即平台**当前**用于下发的目标——排障「节点掉线」还是
        「平台不可达节点」以及「IP 是否已漂移」均读这几个字段。默认仅返回在线节点，
        `online_only=false` 含离线节点（元数据键已过 TTL 的成员不会出现）。
      operationId: listSimNodes
      parameters:
        - $ref: "#/components/parameters/SimNodeOnlineOnlyQuery"
      responses:
        "200":
          description: 节点清单（code=0）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimNodeListResponse" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [sim-node]
      summary: 一键开通仿真端节点（DB 建登记行 → Kafka SCRAM 口令 → 节点级回传 Topic → 双证书）
      description: |
        **V1.24.2 一键开通**（RBAC `scene:execute`，对齐车辆 `POST /vehicles`）：平台先建节点，
        一次编排四项资源（见 `x-hunter-sim-provisioning`）：
          1. **db**     INSERT `scene_svc.sim_node_registry`（初始 provision_status 骨架，各步 pending）
          2. **scram**  AdminClient UPSERT SCRAM-SHA-512 用户（username=`sim-{node_id}`，服务端生成一次性口令）
          3. **topics** 创建节点级回传 Topic `simulation.{node_id}.result` + 死信 `.dlq`（见 topics.yaml#simulation_node_topics）
          4. **cert**   openssl 签发双证书：Kafka 客户端（CN=`sim-{node_id}`）+ 平台访问（CN=`sim-platform-{node_id}`）

        任一步失败 → 逆序回滚已创建资源 → 落失败态（可用 retry-provision 续跑）。
        `scram_password` **仅此一次**在响应体返回，不落库/不入接入包/不写日志（丢失只能 rotate-scram）。

        ⚙ 一键开通**不依赖节点先自注册**：node_id 由管理员指定（格式同 SimNodeId），节点后续以
        下发的接入包（证书 + kafka.properties）+ 本响应的一次性口令完成注册/心跳。
      operationId: provisionSimNode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimNodeProvisionRequest" }
      responses:
        "201":
          description: 开通成功（code=0，data.scram_password 仅此一次可见；含四步终态快照）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimNodeProvisionResponse" }
        "409": { $ref: "#/components/responses/SceneStateConflict" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scene/sim-nodes/{node_id}:
    get:
      tags: [sim-node]
      summary: 查询仿真节点详情（Redis 实时态 + 登记表合并；懒建登记行）
      description: |
        管理详情视图（RBAC `scene:read`）：合并 Redis 实时态（在线/地址/运行实例）与
        PostgreSQL `scene_svc.sim_node_registry`（展示名/令牌/证书）。**懒建语义**：首次访问自动
        创建登记行，即使节点尚未注册也可预览详情。
      operationId: getSimNode
      parameters:
        - $ref: "#/components/parameters/SimNodeIdPath"
      responses:
        "200":
          description: 节点详情（code=0）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimNodeDetailResponse" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [sim-node]
      summary: 更新仿真节点管理字段（展示名 / 描述 / 标签）
      description: 管理员 PATCH（RBAC `scene:update`）：仅更新登记表基础字段，不涉及令牌/证书；返回更新后的完整详情。
      operationId: patchSimNode
      parameters:
        - $ref: "#/components/parameters/SimNodeIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimNodeRegistryPatch" }
      responses:
        "200":
          description: 更新成功（code=0，返回最新详情）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimNodeRegistryPatchResponse" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [sim-node]
      summary: 下线仿真节点并回收全部资源（证书目录 → SCRAM 用户 → 节点级 Topic → 登记行 → Redis）
      description: |
        **V1.24.2 deprovision 回收**（RBAC `scene:delete`，对齐车辆下线）：逆序幂等回收开通时
        创建的外部资源与登记数据——证书目录 → SCRAM 用户（`sim-{node_id}`）→ 节点级回传 Topic
        （`simulation.{node_id}.result` + `.dlq`）→ 登记行 → Redis（`sim:node:{node_id}` + ZREM seen）。
        外部资源不存在视为幂等成功；响应 `data` 回显清理摘要（供审计）。
      operationId: deleteSimNode
      parameters:
        - $ref: "#/components/parameters/SimNodeIdPath"
      responses:
        "200":
          description: 已回收（code=0，data 为清理摘要）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimNodeDeprovisionResponse" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [sim-node]
      summary: 注册/更新仿真节点（幂等 upsert：能力声明 + 地址自学习 + 续租）
      description: |
        节点能力声明与登记，**调用一次即完成注册 + 地址学习 + 租约续期**（幂等 upsert）。

        地址自学习（`node_dispatch.endpoint_learning`）：服务按 `X-Real-IP` → `X-Forwarded-For`
        首跳 → TCP 对端的顺序取来源地址（`SIM_NODE_TRUST_FORWARDED_FOR=false` 时只认对端），
        逐个做字面量 IP 校验与 `SIM_NODE_ALLOWED_NETWORKS` CIDR 过滤，不合法则降级到下一来源；
        全部不可得 → 2001「无法判定节点地址来源」。端口/协议取请求体 `manager_port` / `protocol`
        （缺省取 `SIM_NODE_MANAGER_DEFAULT_PORT` / `SIM_NODE_MANAGER_SCHEME`）。

        ⚙ 地址**不在请求体里**：`node_id` 由节点自行命名且与 IP 无关（IP 漂移不改变身份）；
        学习结果每次**覆盖式**写入 `sim:node:{node_id}`，因此无需人工处理漂移。
        首次注册把调用方写入 `owner`，后续 owner 不一致的写调用 → 1002。

        鉴权：节点使用服务令牌（api-gateway `POST /api/v1/user/service-token`），角色限
        `SIM_NODE_ROLES`（默认 `data-uploader,admin`）；身份取网关注入的 `X-User-Id`。
      operationId: registerSimNode
      parameters:
        - $ref: "#/components/parameters/SimNodeIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimNodeRegisterRequest" }
      responses:
        "200":
          description: 注册成功（回显租约与当前学到的地址）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimNodeResponse" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scene/sim-nodes/{node_id}/heartbeat:
    post:
      tags: [sim-node]
      summary: 节点心跳（续租 + 覆盖式刷新来源地址：IP 漂移的唯一自愈点）
      description: |
        轻量续租（请求体可空）：每次 `SET sim:node:{node_id} EX {lease}` + `ZADD sim:node:seen`，
        并**重新执行一次地址自学习**后覆盖地址字段——节点重连 / DHCP 换址后，一次心跳即恢复正常。
        未注册（或租约已过）→ 3001，必须先调 `PUT /sim-nodes/{node_id}`；owner 不一致 → 1002。
        推荐心跳间隔 ≤ lease/3（默认 90s 租约 ⇒ 30s）。
      operationId: heartbeatSimNode
      parameters:
        - $ref: "#/components/parameters/SimNodeIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimNodeHeartbeatRequest" }
      responses:
        "200":
          description: 续租成功（code=0，data 回显在线状态与学到的地址）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimNodeResponse" }
        "404": { $ref: "#/components/responses/SceneNotFound" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------- V1.24.1 仿真端管理：令牌 / 证书 / 接入包（均 RBAC scene:execute） ----------
  /api/v1/scene/sim-nodes/{node_id}/issue-token:
    post:
      tags: [sim-node]
      summary: 为仿真节点签发服务令牌（代理 api-gateway；access_token 一次性返回、不落日志）
      description: |
        scene-service 代理调用 api-gateway `POST /api/v1/user/service-token`（请求体 `{client_id: node_id}`），
        并更新登记表 `token_id`/`token_issued_at`。因网关会剥离 Authorization，需经 `X-Admin-Access-Token`
        头携带原始管理员 JWT（同一 client_id 重复签发即轮换）。
      operationId: issueSimNodeToken
      parameters:
        - $ref: "#/components/parameters/SimNodeIdPath"
        - $ref: "#/components/parameters/SimNodeAdminAccessToken"
      responses:
        "200":
          description: 签发成功（code=0，data.access_token 仅此一次可见）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueTokenResponse" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scene/sim-nodes/{node_id}/token:
    delete:
      tags: [sim-node]
      summary: 撤销仿真节点服务令牌（代理 api-gateway + 清空登记表 token）
      description: |
        代理调用 api-gateway `DELETE /api/v1/user/service-token/{client_id}`（client_id = node_id），并清空
        登记表 `token_id`/`token_issued_at`。同样需经 `X-Admin-Access-Token` 头携带原始管理员 JWT。
      operationId: revokeSimNodeToken
      parameters:
        - $ref: "#/components/parameters/SimNodeIdPath"
        - $ref: "#/components/parameters/SimNodeAdminAccessToken"
      responses:
        "200":
          description: 已撤销（code=0）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimNodeEmptyResponse" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scene/sim-nodes/{node_id}/issue-kafka-cert:
    post:
      tags: [sim-node]
      summary: 签发 / 重签 Kafka mTLS 客户端证书（CN=sim-{node_id}）
      description: |
        通过 openssl 子进程以只读挂载的 Kafka CA 签发客户端证书（EKU=clientAuth，SAN=DNS:sim-{node_id}），
        产物写入 `{SIM_NODE_CERTS_DIR}/{node_id}/kafka/`，并更新登记表 `kafka_cert_sn`/`kafka_cert_issued_at`。
      operationId: issueSimNodeKafkaCert
      parameters:
        - $ref: "#/components/parameters/SimNodeIdPath"
      responses:
        "200":
          description: 签发成功（code=0）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueCertResponse" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scene/sim-nodes/{node_id}/issue-platform-cert:
    post:
      tags: [sim-node]
      summary: 签发 / 重签平台访问 mTLS 客户端证书（CN=sim-platform-{node_id}）
      description: |
        与 Kafka 证书同一 CA；CN=sim-platform-{node_id}，用于节点以 mTLS 访问平台 HTTP API。
        产物写入 `{SIM_NODE_CERTS_DIR}/{node_id}/platform/`，并更新登记表 `plat_cert_sn`/`plat_cert_issued_at`。
      operationId: issueSimNodePlatformCert
      parameters:
        - $ref: "#/components/parameters/SimNodeIdPath"
      responses:
        "200":
          description: 签发成功（code=0）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueCertResponse" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scene/sim-nodes/{node_id}/bundle:
    get:
      tags: [sim-node]
      summary: 下载仿真节点接入包（ZIP：CA + Kafka/平台证书 + kafka.properties + README）
      description: |
        契约例外：直接返回 ZIP 二进制（不走统一信封），RBAC `scene:execute`。尚未签发任何证书 → 3001。
      operationId: downloadSimNodeBundle
      parameters:
        - $ref: "#/components/parameters/SimNodeIdPath"
      responses:
        "200":
          description: ZIP 二进制
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="<node_id>-bundle.zip"'
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/SceneNotFound" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scene/sim-nodes/{node_id}/rotate-scram:
    post:
      tags: [sim-node]
      summary: 轮换仿真节点 Kafka SCRAM 口令（AdminClient UPSERT 覆盖旧凭据；新口令一次性返回）
      description: |
        **V1.24.2**（RBAC `scene:execute`，对齐车辆 `rotate_scram`）：对 `sim-{node_id}` SCRAM 用户
        UPSERT 新口令（覆盖旧值），回写 `scram_credential_updated_at`；新口令仅响应体返回，
        不落库/不入接入包。节点需用新口令更新 kafka.properties 后重连。
      operationId: rotateSimNodeScram
      parameters:
        - $ref: "#/components/parameters/SimNodeIdPath"
      responses:
        "200":
          description: 轮换成功（code=0，data.scram_password 仅此一次可见）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotateScramResponse" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/scene/sim-nodes/{node_id}/retry-provision:
    post:
      tags: [sim-node]
      summary: 从失败步续跑一键开通（幂等：先回收残留再重跑，适用于 provision 中途失败）
      description: |
        **V1.24.2**（RBAC `scene:execute`）：当首次 `provisionSimNode` 因外部服务（Kafka/Admin/
        openssl）瞬时不可用而落失败态时，调本端点从失败步重试。语义等价“先回收本次残留→重跑四步”，
        因此幂等可多次调用；成功时同样一次性返回 `scram_password`。
      operationId: retrySimNodeProvision
      parameters:
        - $ref: "#/components/parameters/SimNodeIdPath"
      responses:
        "201":
          description: 开通成功（code=0，data.scram_password 仅此一次可见；含四步终态快照）
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimNodeProvisionResponse" }
        "422": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /healthz:
    get:
      tags: [ops]
      summary: 存活探针（K8s livenessProbe）
      operationId: healthz
      security: []
      responses:
        "200":
          description: 进程存活（code=0）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /readyz:
    get:
      tags: [ops]
      summary: 就绪探针（K8s readinessProbe，含 DB/Redis 连通性）
      description: 依赖不可用时返回 HTTP 503 + code=5001（`data` 为各项探测结果）。
      operationId: readyz
      security: []
      responses:
        "200":
          description: 就绪（code=0，data 为 {database, redis}）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyResponse" }
        "503":
          description: 未就绪（code=5001，data 为各项探测结果）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyResponse" }

  /metrics:
    get:
      tags: [ops]
      summary: Prometheus 指标端点
      description: 契约例外：返回 Prometheus 文本格式（非统一 JSON），由 infra/monitoring 抓取。
      operationId: metrics
      security: []
      responses:
        "200":
          description: Prometheus 文本指标
          content:
            text/plain:
              schema:
                type: string


# =====================================================================
# 组件：安全方案 / 参数 / 请求头 / 共用错误响应
# =====================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Access Token（30 分钟，网关签发，G-04① 收紧）。载荷：`sub`(user_id) / `username` / `roles` / `permissions` /
        `iat` / `exp` / `iss` / `jti`。网关校验后注入 `X-User-Id`、`X-Roles`、`X-Trace-Id`，
        服务侧据此执行 RBAC（`permissions.resource=scene`，action ∈ create/read/update/delete/execute）
        与数据权限（按 creator/项目隔离）。
    deviceCertificate:
      type: mutualTLS
      description: |
        车辆设备认证：X.509 双向 TLS，证书 CommonName = vehicle_id。
        本服务无车端 REST 端点，此处仅声明全系统安全约定（车-云数据通道为 Kafka SASL_SSL）。

  parameters:
    SceneIdPath:
      name: scene_id
      in: path
      required: true
      description: 场景 ID（UUID，对应 scene_svc.scenes.scene_id）
      schema: { type: string, format: uuid }
    SimInstanceIdPath:
      name: sim_instance_id
      in: path
      required: true
      description: Carla 仿真实例 ID（POST /api/v1/scene/{scene_id}/run 返回值，4.4 节第 5 步）
      schema: { type: string, maxLength: 128 }
    SimNodeIdPath:
      name: node_id
      in: path
      required: true
      description: |
        仿真节点标识（契约 SimNodeId）：节点自行命名且**与 IP 无关**，因此 IP 漂移不改变身份、
        不影响到已登记实例的归属（实例只绑 node_id）。
      schema: { $ref: "#/components/schemas/SimNodeId" }
    SimNodeOnlineOnlyQuery:
      name: online_only
      in: query
      required: false
      description: 仅返回在线节点（默认 true；false 时含租约已过但元数据尚存的节点）
      schema: { type: boolean, default: true }
    SimNodeAdminAccessToken:
      name: X-Admin-Access-Token
      in: header
      required: true
      description: |
        管理员原始 Access Token（JWT），供 scene-service 代理调用 api-gateway
        `POST/DELETE /api/v1/user/service-token`。网关转发时会**剥离 Authorization**
        （后端只信任 X-User-Id/X-Roles），故需经此自定义头（网关透传）携带。
        直连 / dev（无网关）可回退标准 `Authorization: Bearer <jwt>`。
      schema: { type: string }
    PageQuery:
      name: page
      in: query
      required: false
      description: 页码（≥1）
      schema: { type: integer, minimum: 1, default: 1 }
    PageSizeQuery:
      name: page_size
      in: query
      required: false
      description: 每页条数（1-200，与 hunter_common BaseRepository.paginate 上限一致）
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    TraceRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: |
        链路追踪 ID：由网关生成/透传；直连服务时缺省自动生成 UUID，
        并回带同名响应头（hunter_common.logging trace_id）。
      schema: { type: string, maxLength: 64 }

  headers:
    RequestId:
      description: 链路追踪 ID（与请求头 `X-Request-ID` 一致）
      schema: { type: string, maxLength: 64 }

  responses:
    Unauthenticated:
      description: 未认证（code=1001，Token 缺失或无效）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example:
            code: 1001
            message: 未认证
            data: null
            request_id: 8f9c2b7a-1d3e-4f5a-9b6c-0d1e2f3a4b5c
            timestamp: 1724035200
    TokenExpired:
      description: Token 过期（code=1003，客户端调用网关 /api/v1/user/refresh）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example:
            code: 1003
            message: Token 过期
            data: null
            request_id: 8f9c2b7a-1d3e-4f5a-9b6c-0d1e2f3a4b5c
            timestamp: 1724035200
    Forbidden:
      description: 无权限（code=1002，RBAC 资源域 scene 权限不足）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example:
            code: 1002
            message: 无权限
            data: null
            request_id: 8f9c2b7a-1d3e-4f5a-9b6c-0d1e2f3a4b5c
            timestamp: 1724035200
    InvalidParameter:
      description: 参数错误（code=2001，请求体/查询参数校验失败；HTTP 422，见 x-hunter-error-status-map）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example:
            code: 2001
            message: 参数错误
            data: null
            request_id: 8f9c2b7a-1d3e-4f5a-9b6c-0d1e2f3a4b5c
            timestamp: 1724035200
    MissingParameter:
      description: 参数缺失（code=2002，必填参数未提供）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example:
            code: 2002
            message: 参数缺失
            data: null
            request_id: 8f9c2b7a-1d3e-4f5a-9b6c-0d1e2f3a4b5c
            timestamp: 1724035200
    SceneNotFound:
      description: 场景不存在（code=3001，含已软删除场景）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example:
            code: 3001
            message: 资源不存在
            data: null
            request_id: 8f9c2b7a-1d3e-4f5a-9b6c-0d1e2f3a4b5c
            timestamp: 1724035200
    SimInstanceNotFound:
      description: 仿真实例不存在（code=3001，Carla 管理 API 返回 404 或实例已回收）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example:
            code: 3001
            message: 资源不存在
            data: null
            request_id: 8f9c2b7a-1d3e-4f5a-9b6c-0d1e2f3a4b5c
            timestamp: 1724035200
    SimResultNotReady:
      description: |
        仿真结果未就绪（code=3003，资源状态冲突）：实例仍处 pending/running 终态前状态，
        请先轮询 GET /api/v1/scene/simulations/{sim_instance_id} 待进入终态后再查结果。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example:
            code: 3003
            message: 资源状态冲突
            data: null
            request_id: 8f9c2b7a-1d3e-4f5a-9b6c-0d1e2f3a4b5c
            timestamp: 1724035200
    SceneNameConflict:
      description: 场景名称已存在（code=3002，唯一索引 uq_scenes_scene_name）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example:
            code: 3002
            message: 资源已存在
            data: null
            request_id: 8f9c2b7a-1d3e-4f5a-9b6c-0d1e2f3a4b5c
            timestamp: 1724035200
    SceneStateConflict:
      description: |
        资源状态冲突（code=3003）：非 draft 编辑 / published 删除 / 非 published 下发 /
        已有运行中仿真实例且未允许并行。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example:
            code: 3003
            message: 资源状态冲突
            data: null
            request_id: 8f9c2b7a-1d3e-4f5a-9b6c-0d1e2f3a4b5c
            timestamp: 1724035200
    ServiceUnavailable:
      description: 服务不可用（code=5001）：PostgreSQL / Redis / MinIO / Carla 管理 API 不可达
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example:
            code: 5001
            message: 服务不可用
            data: null
            request_id: 8f9c2b7a-1d3e-4f5a-9b6c-0d1e2f3a4b5c
            timestamp: 1724035200
    InternalError:
      description: 服务器内部错误（code=5000，未预期异常）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example:
            code: 5000
            message: 服务器内部错误
            data: null
            request_id: 8f9c2b7a-1d3e-4f5a-9b6c-0d1e2f3a4b5c
            timestamp: 1724035200


  schemas:
    # ---------- 统一响应与错误码（不可更改） ----------
    ErrorCode:
      type: integer
      description: |
        预定义错误码（附录 A，禁止自定义）。本服务可能返回的子集：
        `0` 成功 / `1001` 未认证 / `1002` 无权限 / `1003` Token 过期 /
        `2001` 参数错误 / `2002` 参数缺失 / `3001` 资源不存在 / `3002` 资源已存在 /
        `3003` 资源状态冲突 / `5000` 服务器内部错误 / `5001` 服务不可用。
      enum: [0, 1001, 1002, 1003, 2001, 2002, 3001, 3002, 3003, 4001, 4002, 5000, 5001, 6001, 6002, 6003, 7001, 7002]

    ApiResponse:
      type: object
      description: 统一响应格式（所有业务响应/错误响应均为该结构）
      required: [code, message, data, request_id, timestamp]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          example: success
        data:
          nullable: true
          description: 业务数据；错误时为 null 或错误上下文
        request_id:
          type: string
          description: 请求追踪 ID（等于响应头 X-Request-ID）
          example: 8f9c2b7a-1d3e-4f5a-9b6c-0d1e2f3a4b5c
        timestamp:
          type: integer
          format: int64
          description: Unix epoch 秒
          example: 1724035200

    HealthResponse:
      type: object
      required: [code, message, data, request_id, timestamp]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [ok] }

    ReadyResponse:
      type: object
      required: [code, message, data, request_id, timestamp]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        data:
          type: object
          description: 各依赖探测结果（true=可用）
          required: [database, redis]
          properties:
            database: { type: boolean }
            redis: { type: boolean }

    # ---------- 受控词表 ----------
    SceneStatus:
      type: string
      description: |
        场景状态受控词表（contracts/database/enums.md 第 6 节，DB CHECK 约束同源）。
        `draft` 可编辑；`published` 可下发/导出；`archived` 只读可删。
      enum: [draft, published, archived]

    SceneType:
      type: string
      description: |
        场景类型（4.2.1 分类体系的叶子场景）。
        取值为**可扩展受控字典**，单一事实来源见 `contracts/scene-taxonomy.yaml`（scene_types[].value）；
        新增类型仅需编辑该字典，无需修改本契约固定枚举或后端逻辑即可入库。
        「分类 → 类型」映射与中文标签见 `x-hunter-scene-types`；入库时由应用层按字典校验，越界拦截。
      minLength: 1
      maxLength: 64
      x-controlled-vocabulary: contracts/scene-taxonomy.yaml
      x-controlled-vocabulary-field: scene_types[].value
      example: straight_cruise

    SimulationStatus:
      type: string
      description: |
        Carla 仿真实例运行状态（4.4 节"运行中"）。
        ⚠ 设计文档仅给出"运行中"，其余取值由本契约补充，见 `x-hunter-pending-confirmation`。
        CARLA 状态映射：CREATED/LOADING/READY→pending，RUNNING/PAUSED→running，
        COMPLETED/SUCCEEDED→succeeded，FAILED→failed，CANCELED/CANCELLED→canceled；
        未知 CARLA 状态映射为 failed（message=carla_status_unknown），原始值保留在 carla_status。
      enum: [pending, running, succeeded, failed, canceled]

    SimulationMode:
      type: string
      description: 仿真模式（数据采集与分析系统 ↔ CARLA 详细设计 6.1.1）
      enum: [sil, vil, replay]

    SimulationQuality:
      type: string
      description: CARLA 渲染/物理质量档位（创建实例参数）
      enum: [Low, Medium, High]

    VilCalibration:
      type: object
      description: VIL 会话坐标标定（平台只做结构校验，坐标语义由 CARLA 校验）
      additionalProperties: false
      required: [calibration_id, map_x, map_y, map_heading, odom_x, odom_y, odom_heading]
      properties:
        calibration_id: { type: string, minLength: 1, maxLength: 128, description: "标定 ID（追溯用）" }
        map_x: { type: number, description: "标定参考点地图 X / m" }
        map_y: { type: number, description: "标定参考点地图 Y / m" }
        map_heading: { type: number, description: "标定参考点地图航向 rad" }
        odom_x: { type: number, description: "对应 odom X / m" }
        odom_y: { type: number, description: "对应 odom Y / m" }
        odom_heading: { type: number, description: "对应 odom 航向 rad" }

    VilConfig:
      type: object
      description: VIL 数据面参数（CARLA vil-mapper 使用）
      additionalProperties: false
      required: [calibration]
      properties:
        calibration: { $ref: "#/components/schemas/VilCalibration" }
        target_hz: { type: integer, minimum: 1, maximum: 30, default: 10, description: "VIL 状态目标频率 Hz" }
        data_timeout_ms: { type: integer, minimum: 50, maximum: 5000, default: 500, description: "数据超时阈值 ms" }
        extrapolation_ms: { type: integer, minimum: 0, maximum: 2000, default: 150, description: "丢帧外推上限 ms" }

    ReplayConfig:
      type: object
      description: 实车数据回放配置（mode=replay）
      additionalProperties: false
      required: [vehicle_id, start_time, end_time]
      properties:
        vehicle_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
          description: "回放数据来源车辆 ID"
        start_time: { type: number, minimum: 0, description: "回放起始时间 Unix epoch 秒" }
        end_time: { type: number, minimum: 0, description: "回放结束时间 Unix epoch 秒（必须大于 start_time）" }
        include_sensors: { type: boolean, default: true, description: "是否回放传感器数据" }

    SceneSimConfig:
      type: object
      description: 仿真运行配置（质量档位 + VIL 参数）
      additionalProperties: false
      properties:
        allow_parallel:
          type: boolean
          default: false
          description: "允许同一场景并行运行多个实例（默认 false，避免资源争抢）"
        quality: { $ref: "#/components/schemas/SimulationQuality" }
        vil:
          allOf:
            - $ref: "#/components/schemas/VilConfig"
          nullable: true
          description: "VIL 数据面参数（mode=vil 时必填）"


    # ---------- 4.2.2 场景配置结构（字段名不可更改） ----------
    SpawnPoint:
      type: object
      description: |
        生成点（自车/参与者）。⚠ 4.2.2 节仅给出 `spawn_point` 字段名，未定义内部结构；
        本契约按 Carla transform 语义定义（位置 m + 朝向 rad），需人工确认。

        **坐标语义（V1.25.0 口径，两套语义不可混淆）**：
        - `map.spawn_point`：自车出生点。目录模板与批量生成一律写**占位原点 (0,0,0)**，
          它不是“待仿真消费的绝对坐标”；有效车道坐标由仿真端在下发后按地图取得并替换；
        - `actors[].spawn_point`：参与者**相对 `map.spawn_point` 的偏移**（x/y 米、yaw 弧度）；
          平台不折算、不改写，仿真端替换自车基准后**必须把该偏移叠加到新基准**；
        - 下发载荷根节点附 `spawn_semantics: relative_to_ego` 标记（口径详见
          x-hunter-scene-config-contract.spawn_point_semantics）。

        **有效性由谁保证**：有效车道坐标只能由实机 `world.get_map().get_spawn_points()` 得到，
        平台侧无法维护（CARLA 客户端与服务器必须同版本，而部署环境的服务器为源码编译的
        dev build），因此自 V1.25.0 起平台不再维护出生点表、不再在 G3 判定有效性、
        不再在下发前拦截原点。替换算法与验收判据见 `docs/HunterSim传感器挂载换算方案.md` 第二部分。
      required: [x, y, yaw]
      properties:
        x: { type: number, description: "X 坐标（m）" }
        y: { type: number, description: "Y 坐标（m）" }
        z: { type: number, default: 0.0, description: "Z 坐标（m）" }
        yaw: { type: number, minimum: -3.141592653589793, maximum: 3.141592653589793, description: "朝向（rad）" }
        lane_id: { type: string, nullable: true, description: "车道 ID（⚠ 语义待确认，可选）" }

    MapType:
      type: string
      description: "地图类型（⚠ 编码值为契约提出，设计文档未给出取值域）"
      enum: [carla_town, hd_map, site_map]

    SceneMap:
      type: object
      description: 场景地图段（4.2.2 节 map）
      required: [map_id, map_type, spawn_point]
      properties:
        map_id: { type: string, minLength: 1, maxLength: 128, description: "地图标识（Carla 地图名 / 高精地图 ID）" }
        map_type: { $ref: "#/components/schemas/MapType" }
        spawn_point: { $ref: "#/components/schemas/SpawnPoint" }

    EgoVehicle:
      type: object
      description: 自车初始状态段（4.2.2 节 ego_vehicle）
      required: [model, initial_speed, initial_steer]
      properties:
        model: { type: string, minLength: 1, maxLength: 64, example: HUNTER_SE, description: "车型（车端基线：HUNTER SE）" }
        initial_speed: { type: number, minimum: 0, description: "初始速度（m/s）" }
        initial_steer: { type: number, minimum: -1, maximum: 1, description: "初始转向（归一化 -1..1）" }

    Weather:
      type: object
      description: |
        环境条件段（4.2.2 节 weather，7 个字段全部必填）。
        取值范围按 Carla WeatherParameters 语义定义（设计文档未给出取值范围，见 x-hunter-pending-confirmation）。
      required: [cloudiness, rain, wetness, fog, wind, sun_azimuth, sun_altitude]
      properties:
        cloudiness: { type: number, minimum: 0, maximum: 100, description: "云量 %" }
        rain: { type: number, minimum: 0, maximum: 100, description: "降雨强度 %" }
        wetness: { type: number, minimum: 0, maximum: 100, description: "地面积水 %" }
        fog: { type: number, minimum: 0, maximum: 100, description: "雾浓度 %" }
        wind: { type: number, minimum: 0, maximum: 100, description: "风速强度 %" }
        sun_azimuth: { type: number, minimum: 0, maximum: 360, description: "太阳方位角（度）" }
        sun_altitude: { type: number, minimum: -90, maximum: 90, description: "太阳高度角（度，负值为夜间）" }

    ActorType:
      type: string
      description: "参与者类型（与遥测 perception.object_types 域一致：vehicle/pedestrian/other）"
      enum: [vehicle, pedestrian, other]

    ActorBehavior:
      type: object
      description: |
        参与者行为编排（4.2.2 节 actors[].behavior）。
        behavior_type 取值域为**受控字典**（contracts/scene-taxonomy.yaml 的 behavior_types，
        纵/横/复合/博弈/失效五组，如 lane_follow / cut_in / cross_road / static 等）；
        parameters 为行为参数自由结构（受控枚举键 rule/edge/coordinate_system/... 出现即校验取值）。
      required: [behavior_type]
      properties:
        behavior_type: { type: string, minLength: 1, maxLength: 64, example: lane_follow, x-controlled-vocabulary: contracts/scene-taxonomy.yaml, "x-controlled-vocabulary-field": "behavior_types[].value" }
        parameters:
          type: object
          additionalProperties: true
          description: 行为参数（如目标速度、加减速度、触发距离），结构随 behavior_type 而定

    Actor:
      type: object
      description: 场景参与者（4.2.2 节 actors[]）
      required: [actor_id, type, spawn_point, behavior]
      properties:
        actor_id: { type: string, minLength: 1, maxLength: 64, description: "场景内参与者唯一标识" }
        type: { $ref: "#/components/schemas/ActorType" }
        spawn_point: { $ref: "#/components/schemas/SpawnPoint" }
        behavior: { $ref: "#/components/schemas/ActorBehavior" }


    SceneEventType:
      type: string
      description: |
        场景事件类型（4.2.2 节 events[].type）。
        ⚠ 设计文档未定义取值域；本契约按 4.2.1 场景与 4.5 实车触发事件提出候选值，需人工确认。
      enum:
        - collision
        - cut_in
        - pedestrian_crossing
        - emergency_brake
        - manual_takeover
        - sensor_failure
        - obstacle_appearance

    SceneEventTrigger:
      type: object
      description: |
        事件触发条件（4.2.2 节 events[].trigger）。
        condition 为触发表达式标识（如 OpenSCENARIO 条件名或 `ego.position.x > 10`）；
        condition_type 为**受控**触发条件类型（contracts/scene-taxonomy.yaml 的 trigger_condition_types，可选）；
        parameters 为其参数，受控枚举键（rule/edge/coordinate_system/relative_distance_type/distribution）
        出现即校验取值，其余自由键不拒绝（兼容 4.5 节实车回放自动提取）。
      required: [condition]
      properties:
        condition: { type: string, minLength: 1, maxLength: 256 }
        condition_type: { type: string, minLength: 1, maxLength: 64, nullable: true, example: distance, x-controlled-vocabulary: contracts/scene-taxonomy.yaml, "x-controlled-vocabulary-field": "trigger_condition_types[].value" }
        parameters: { type: object, additionalProperties: true }

    SceneEventAction:
      type: object
      description: |
        事件触发后的动作（4.2.2 节 events[].action）。
        action_type 取值域为**受控字典**（contracts/scene-taxonomy.yaml 的 action_types，OpenSCENARIO 六组，
        如 speed_change / lane_change / stop / emergency_stop / degrade_control 等）；parameters 受控枚举键出现即校验取值。
      required: [action_type]
      properties:
        action_type: { type: string, minLength: 1, maxLength: 64, example: speed_change, x-controlled-vocabulary: contracts/scene-taxonomy.yaml, "x-controlled-vocabulary-field": "action_types[].value" }
        parameters: { type: object, additionalProperties: true }

    SceneEvent:
      type: object
      description: 场景事件（4.2.2 节 events[]）
      required: [event_id, type, trigger, action]
      properties:
        event_id: { type: string, minLength: 1, maxLength: 64, description: "场景内事件唯一标识" }
        type: { $ref: "#/components/schemas/SceneEventType" }
        trigger: { $ref: "#/components/schemas/SceneEventTrigger" }
        action: { $ref: "#/components/schemas/SceneEventAction" }

    SuccessCriteria:
      type: object
      description: 场景成功判据（4.2.2 节 success_criteria）
      required: [max_speed_deviation, no_collision, min_safe_distance]
      properties:
        max_speed_deviation: { type: number, minimum: 0, description: "最大速度偏差（m/s）" }
        no_collision: { type: boolean, default: true, description: "是否要求全程无碰撞（true=通过判据）" }
        min_safe_distance: { type: number, minimum: 0, description: "最小安全距离（m）" }

    SceneConfig:
      type: object
      description: |
        场景仿真配置（4.2.2 节结构中的仿真相关段，落库 scenes.config_json）。
        7 个字段全部必填，与 x-hunter-scene-config-contract 声明一致。
      required: [map, ego_vehicle, weather, actors, events, success_criteria, duration]
      properties:
        map: { $ref: "#/components/schemas/SceneMap" }
        ego_vehicle: { $ref: "#/components/schemas/EgoVehicle" }
        weather: { $ref: "#/components/schemas/Weather" }
        actors:
          type: array
          maxItems: 100
          description: 参与者列表（可为空数组）
          items: { $ref: "#/components/schemas/Actor" }
        events:
          type: array
          maxItems: 100
          description: 事件列表（可为空数组）
          items: { $ref: "#/components/schemas/SceneEvent" }
        success_criteria: { $ref: "#/components/schemas/SuccessCriteria" }
        duration: { type: number, exclusiveMinimum: 0, description: "场景时长（s）；⚠ 上限未定义，下发前校验" }


    SceneMeta:
      type: object
      description: |
        场景元信息（4.2.2 节结构中的元信息段，一一对应 scene_svc.scenes 列）。
        与 SceneConfig 合并即为 4.2.2 节完整场景配置结构。
      required: [scene_id, scene_name, scene_type, description, version, creator, tags, status, create_time, update_time]
      properties:
        scene_id: { type: string, format: uuid }
        scene_name: { type: string, minLength: 1, maxLength: 128 }
        scene_type: { $ref: "#/components/schemas/SceneType" }
        description: { type: string, nullable: true, maxLength: 1024 }
        version: { type: string, pattern: "^\\d+\\.\\d+\\.\\d+$", example: 1.0.0, description: "语义化版本（导出时写入 x-scenario-version）" }
        creator: { type: string, format: uuid, description: "创建者 user_id（逻辑外键 → user_svc.users）" }
        tags:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 32 }
        status: { $ref: "#/components/schemas/SceneStatus" }
        create_time: { type: string, format: date-time }
        update_time: { type: string, format: date-time }

    Scene:
      description: 场景完整对象 = SceneMeta（元信息，4.2.2 元信息段）+ config（仿真配置段）
      allOf:
        - $ref: "#/components/schemas/SceneMeta"
        - type: object
          required: [config]
          properties:
            config: { $ref: "#/components/schemas/SceneConfig" }

    SceneTemplate:
      type: object
      description: 场景模板（4.2.1 分类体系预置；config 可直接作为创建请求的 config 提交）
      required: [template_id, template_name, scene_type, description, config]
      properties:
        template_id: { type: string, minLength: 1, maxLength: 64 }
        template_name: { type: string, minLength: 1, maxLength: 128 }
        scene_type: { $ref: "#/components/schemas/SceneType" }
        description: { type: string, nullable: true }
        config: { $ref: "#/components/schemas/SceneConfig" }

    # ---------- 业务数据段（统一响应 data 字段） ----------
    SceneListData:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Scene" }
        total: { type: integer, minimum: 0, description: "满足筛选条件的总数（软删除数据不计入）" }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 200 }

    SceneTemplateListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SceneTemplate" }
        total: { type: integer, minimum: 0 }

    SceneDeleteData:
      type: object
      required: [scene_id, deleted]
      properties:
        scene_id: { type: string, format: uuid }
        deleted: { type: boolean, description: "软删除结果（true=deleted_at 已写入）" }

    SceneExportData:
      type: object
      required: [format, file_name, object_key, size_bytes, download_url, expires_in]
      properties:
        format: { $ref: "#/components/schemas/SceneExportFormat" }
        file_name: { type: string, description: "导出文件名（含扩展名）" }
        object_key: { type: string, description: "MinIO hunter-scene-assets 对象键" }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$", nullable: true, description: "文件 SHA-256（完整性校验）" }
        download_url: { type: string, format: uri, description: "预签名下载地址（有效期 15 分钟，支持 Range 分片下载）" }
        expires_in: { type: integer, description: "预签名过期秒数（MinIO 契约：下载 900 秒）" }

    SceneRunData:
      type: object
      required: [sim_instance_id, scene_id, status, started_at]
      properties:
        sim_instance_id: { type: string, description: "Carla 仿真实例 ID（4.4 节第 5 步）" }
        sim_id: { type: string, nullable: true, description: "平台仿真会话 ID（动态 Topic 前缀；由平台生成后传给 CARLA）" }
        scene_id: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/SimulationMode" }
        vehicle_id: { type: string, nullable: true, description: "VIL/回放关联车辆 ID（SIL 为 null）" }
        status: { $ref: "#/components/schemas/SimulationStatus" }
        carla_status: { type: string, nullable: true, description: "CARLA 原始状态（排障用）" }
        vil_state_topic: { type: string, nullable: true, description: "VIL 状态 Topic（mode=vil；carla.{sim_id}.vil_state）" }
        sensor_data_topic: { type: string, nullable: true, description: "仿真回传 Topic（carla.{sim_id}.sensor_data）" }
        stream_url: { type: string, format: uri, nullable: true, description: "CARLA 视频流地址（服务端返回时透传）" }
        started_at: { type: string, format: date-time, description: "下发成功时间（UTC）" }
        param_overrides:
          type: object
          additionalProperties: true
          description: "实际生效的参数覆盖（回显，便于追溯）"

    SimulationProgress:
      type: object
      description: |
        仿真实例进度快照（4.4 节第 6 步，决策 G-20①）。
        ⚠ 进度字段 Carla 管理 API 未定义（待确认 #9），服务端宽松透传，缺失置 null。
      required: [sim_instance_id, status]
      properties:
        sim_instance_id: { type: string, description: "Carla 仿真实例 ID" }
        scene_id: { type: string, format: uuid, nullable: true, description: "关联场景 ID（Carla 响应携带时透传）" }
        mode: { $ref: "#/components/schemas/SimulationMode" }
        vehicle_id: { type: string, nullable: true, description: "VIL/回放关联车辆 ID" }
        status: { $ref: "#/components/schemas/SimulationStatus" }
        carla_status: { type: string, nullable: true, description: "CARLA 原始状态（排障用）" }
        progress_percent: { type: number, minimum: 0, maximum: 100, nullable: true, description: "完成百分比（Carla 未提供时 null）" }
        current_time_s: { type: number, minimum: 0, nullable: true, description: "已仿真时长（秒）" }
        total_time_s: { type: number, minimum: 0, nullable: true, description: "场景总时长（秒，对应 SceneConfig.duration）" }
        actors_count: { type: integer, minimum: 0, nullable: true, description: "参与者数量" }
        collisions: { type: integer, minimum: 0, nullable: true, description: "碰撞次数" }
        lane_invasions: { type: integer, minimum: 0, nullable: true, description: "车道入侵次数" }
        ego_state:
          type: object
          additionalProperties: true
          nullable: true
          description: "VIL 自车位姿/速度/转角（CARLA 透传）"
        message: { type: string, nullable: true, maxLength: 512, description: "状态补充说明（失败原因 / paused 等）" }
        updated_at: { type: string, format: date-time, nullable: true, description: "Carla 侧最后更新时间（UTC）" }

    SimulationArtifact:
      type: object
      description: 仿真产物（日志 / 视频 / 指标文件等；落 hunter-scene-assets 时换发预签名 URL）
      required: [name]
      properties:
        name: { type: string, maxLength: 256, description: "产物名称/文件名" }
        object_key: { type: string, nullable: true, description: "MinIO hunter-scene-assets 对象键（非对象存储产物为 null）" }
        size_bytes: { type: integer, format: int64, minimum: 0, nullable: true }
        download_url: { type: string, format: uri, nullable: true, description: "预签名下载地址（有效期 15 分钟，与 4.3 节一致）" }
        expires_in: { type: integer, nullable: true, description: "预签名过期秒数（仅 download_url 非空时返回）" }

    SimulationResult:
      type: object
      description: |
        仿真实例结果（4.4 节第 7 步，决策 G-20①；仅终态实例可查）。
        ⚠ 结果结构 Carla 侧未定义（待确认 #9），success_criteria_result 为宽松对象透传。
      required: [sim_instance_id, status]
      properties:
        sim_instance_id: { type: string }
        scene_id: { type: string, format: uuid, nullable: true }
        mode: { $ref: "#/components/schemas/SimulationMode" }
        vehicle_id: { type: string, nullable: true, description: "VIL/回放关联车辆 ID" }
        status: { $ref: "#/components/schemas/SimulationStatus" }
        carla_status: { type: string, nullable: true, description: "CARLA 原始状态" }
        success: { type: boolean, nullable: true, description: "是否达成 success_criteria（Carla 未判定时 null）" }
        evaluation:
          type: object
          additionalProperties: true
          nullable: true
          description: "安全/效率/舒适/任务评估（scene_test 报告或 CARLA 评估结果）"
        success_criteria_result:
          type: object
          additionalProperties: true
          nullable: true
          description: "成功判据逐项结果（透传 Carla/评估器输出，结构待确认 #9）"
        message: { type: string, nullable: true, maxLength: 512, description: "失败原因 / 取消原因等补充说明" }
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/SimulationArtifact" }
          description: "产物清单（对象存储产物已换发预签名 URL）"
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true, description: "仿真结束时间（UTC）" }

    SimulationControlData:
      type: object
      description: 仿真控制结果（pause / resume / cancel）
      required: [sim_instance_id, status]
      properties:
        sim_instance_id: { type: string, description: "Carla 仿真实例 ID" }
        status: { $ref: "#/components/schemas/SimulationStatus" }
        carla_status: { type: string, nullable: true, description: "控制后的 CARLA 原始状态" }
        message: { type: string, nullable: true, maxLength: 512, description: "补充说明（如 paused）" }


    # ---------- 成功响应（data 已定型，便于前端 TS 类型生成） ----------
    SceneResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/Scene" }

    SceneListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/SceneListData" }

    SceneTemplateListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/SceneTemplateListData" }

    SceneDeleteResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/SceneDeleteData" }

    SceneExportResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/SceneExportData" }

    SceneRunResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/SceneRunData" }

    SimulationProgressResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/SimulationProgress" }

    SimulationResultResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/SimulationResult" }

    SimulationControlResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/SimulationControlData" }

    # ---------- 请求体 ----------
    SceneCreateRequest:
      type: object
      description: |
        创建场景请求：元信息（写入 scenes 列）+ config（写入 config_json，4.2.2 结构）。
        status / creator / version / create_time 由服务端生成，不接收客户端传值。
      required: [scene_name, scene_type, config]
      additionalProperties: false
      properties:
        scene_name: { type: string, minLength: 1, maxLength: 128 }
        scene_type: { $ref: "#/components/schemas/SceneType" }
        description: { type: string, nullable: true, maxLength: 1024 }
        tags:
          type: array
          maxItems: 20
          default: []
          items: { type: string, minLength: 1, maxLength: 32 }
        config: { $ref: "#/components/schemas/SceneConfig" }

    SceneUpdateRequest:
      type: object
      description: |
        更新场景请求（PUT 全量语义）。元信息与 config 必须整体提交，
        运行中/已发布场景返回 3003；status / version / creator 不可改。
      required: [scene_name, scene_type, config]
      additionalProperties: false
      properties:
        scene_name: { type: string, minLength: 1, maxLength: 128 }
        scene_type: { $ref: "#/components/schemas/SceneType" }
        description: { type: string, nullable: true, maxLength: 1024 }
        tags:
          type: array
          maxItems: 20
          default: []
          items: { type: string, minLength: 1, maxLength: 32 }
        config: { $ref: "#/components/schemas/SceneConfig" }

    SceneDuplicateRequest:
      type: object
      description: 复制场景请求（可省略请求体）
      additionalProperties: false
      properties:
        new_scene_name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
          description: "新场景名称；省略时按 <源名称>-copy 生成（冲突追加序号）"

    ScenePublishRequest:
      type: object
      description: |
        发布场景请求（可省略请求体）。
        ⚠ 版本号策略：本契约规定仅在显式传 version 时更新 scenes.version，否则保持不变。
      additionalProperties: false
      properties:
        version:
          type: string
          nullable: true
          pattern: "^\\d+\\.\\d+\\.\\d+$"
          description: "发布版本（可选，语义化版本；需 ≥ 当前版本）"

    SceneExportFormat:
      type: string
      description: 导出格式（4.3 节：Carla ScenarioRunner XML + OpenSCENARIO 1.2）
      enum: [carla_scenariorunner_xml, openscenario_1_2]

    SceneExportRequest:
      type: object
      description: |
        导出请求：支持批量导出（一次一个文件，多场景合并写入同一导出文件集）。
        ⚠ 批量语义（单文件内多场景 vs 多文件打包）设计文档未定义，见 x-hunter-pending-confirmation。
      required: [scene_ids, format]
      additionalProperties: false
      properties:
        scene_ids:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
        format: { $ref: "#/components/schemas/SceneExportFormat" }

    SceneRunRequest:
      type: object
      description: |
        场景下发请求（可省略请求体）。
        param_overrides 仅允许覆盖 4.2.2 结构中的白名单路径（如 ego_vehicle.initial_speed、
        weather.*、duration），服务端以白名单校验后深合并；禁止覆盖 map.map_id。

        模式约束：
        - `sil`（默认）：vehicle_id 可为空；
        - `vil`：vehicle_id + sim_config.vil 必填；同一车辆同时仅允许一个活动 VIL 会话；
        - `replay`：vehicle_id + replay_config 必填（end_time > start_time）。
      additionalProperties: false
      properties:
        param_overrides:
          type: object
          additionalProperties: true
          description: "参数化覆盖（白名单路径深合并；键为点分路径）"
        sim_config:
          allOf:
            - $ref: "#/components/schemas/SceneSimConfig"
          description: "仿真运行配置"
        mode: { $ref: "#/components/schemas/SimulationMode" }
        vehicle_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
          nullable: true
          description: "VIL/回放关联车辆 ID；SIL 可为空"
        replay_config:
          allOf:
            - $ref: "#/components/schemas/ReplayConfig"
          nullable: true
          description: "回放配置（mode=replay 必填）"

    # ---------- 仿真节点控制面（V1.24.0：node_dispatch，地址自学习） ----------
    SimNodeId:
      type: string
      pattern: "^[a-z0-9][a-z0-9._-]{2,63}$"
      description: |
        节点标识：与 IP 无关、节点自行命名并保持长期稳定（`node_dispatch.instance_binding`：
        实例只绑 node_id，因此地址变化不会使已有实例失控）。
      example: huntersim-lab-01

    SimNodeProtocol:
      type: string
      enum: [http, https]
      description: 拼接节点基址所用协议（缺省取 SIM_NODE_MANAGER_SCHEME）

    SimNodeEndpointSource:
      type: string
      enum: [real-ip, forwarded-for, socket-peer]
      description: |
        地址来源标记（排障用，判断是否被代理/网关改写）：`real-ip` = `X-Real-IP`；
        `forwarded-for` = `X-Forwarded-For` 首跳；`socket-peer` = TCP 对端。取值语义见
        `node_dispatch.endpoint_learning`。

    SimNodeRegisterRequest:
      type: object
      description: |
        节点能力声明（幂等 upsert）。⚠ 不携带地址字段：`endpoint_ip` / `endpoint_source` /
        `learned_at` 只能由服务端从入站请求头自学习写入（见 `node_dispatch.endpoint_learning`）；
        请求体只声明监听端口与协议。
      additionalProperties: false
      properties:
        carla_version:
          type: string
          nullable: true
          maxLength: 64
          description: 节点上 CARLA 服务版本（仅展示与兼容性排查）
        maps:
          type: array
          nullable: true
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 64 }
          description: |
            可用地图清单（选节点策略：声明了 maps 且不含目标地图的在线节点被排除；
            未声明视为通用）
        capacity:
          type: integer
          minimum: 1
          maximum: 32
          default: 1
          description: 可同时运行的仿真实例上限（节点自述值，平台不做二次削减）
        labels:
          type: object
          nullable: true
          additionalProperties: { type: string, maxLength: 128 }
          description: 自定义标签（机房/显卡型号等，仅展示）
        manager_port:
          type: integer
          nullable: true
          minimum: 1
          maximum: 65535
          description: |
            节点 CARLA 管理 API 端口（缺省取 SIM_NODE_MANAGER_DEFAULT_PORT，默认 8090）；
            与学习到的 IP 共拼装下发基址
        protocol:
          allOf:
            - $ref: "#/components/schemas/SimNodeProtocol"
          nullable: true
          description: 拼基址的协议（缺省取 SIM_NODE_MANAGER_SCHEME）
        runtime_hint:
          type: string
          nullable: true
          maxLength: 256
          description: 节点自述服务地址（**仅展示，绝不参与寻址**）

    SimNodeHeartbeatRequest:
      type: object
      description: |
        轻量续租（请求体可完全省略）。心跳同时是一次地址自学习，因此 IP 变化无需额外调用。
      additionalProperties: false
      properties:
        running_instance_ids:
          type: array
          nullable: true
          maxItems: 32
          items: { type: string, maxLength: 128 }
          description: 节点正在运行的实例 ID（用于空闲容量估算；超出 capacity 仅告警不改写）
        capacity:
          type: integer
          nullable: true
          minimum: 1
          maximum: 32
          description: 容量变更时携带
        message:
          type: string
          nullable: true
          maxLength: 512
          description: 节点侧健康提示（回显给运维，不参与调度判定）

    SimNodeData:
      type: object
      description: |
        节点视图。`endpoint_*` 四条是排障与下发的唯一事实来源：只反映**最后一次注册/心跳
        时学到的地址**（IP 漂移后下一次心跳自动刷新，无需人工处置）。
      required: [node_id, owner, online, lease_seconds]
      properties:
        node_id: { $ref: "#/components/schemas/SimNodeId" }
        owner:
          type: string
          description: 首次注册绑定的调用方身份（服务令牌为 `service:{client_id}`）
        online:
          type: boolean
          description: 心跳未超租约（`SIM_NODE_LEASE_SECONDS`）
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: 最后一次成功注册/心跳时间
        lease_seconds:
          type: integer
          minimum: 1
          description: 当前生效的租约秒数（节点据此计算心跳间隔，建议 ≤ lease/3）
        carla_version: { type: string, nullable: true, maxLength: 64 }
        maps:
          type: array
          nullable: true
          maxItems: 64
          items: { type: string, maxLength: 64 }
        capacity: { type: integer, minimum: 1, maximum: 32 }
        running_count:
          type: integer
          minimum: 0
          description: 心跳上报的运行中实例数（选节点时算空闲容量用）
        labels:
          type: object
          nullable: true
          additionalProperties: { type: string, maxLength: 128 }
        endpoint_ip:
          type: string
          nullable: true
          maxLength: 45
          description: 当前学习到的节点来源地址（IPv6 已去方括号，拼 URL 时自动加回）
        manager_port:
          type: integer
          nullable: true
          minimum: 1
          maximum: 65535
          description: 节点 CARLA 管理 API 端口
        protocol:
          allOf:
            - $ref: "#/components/schemas/SimNodeProtocol"
          nullable: true
        endpoint_source:
          allOf:
            - $ref: "#/components/schemas/SimNodeEndpointSource"
          nullable: true
        learned_at:
          type: string
          format: date-time
          nullable: true
          description: 最后一次地址刷新时间（与 `last_seen_at` 同点写入）
        runtime_hint: { type: string, nullable: true, maxLength: 256, description: "仅展示，不参与寻址" }
        registered_at:
          type: string
          format: date-time
          nullable: true
          description: 首次注册时间（upsert 不会覆写）
        message: { type: string, nullable: true, maxLength: 512 }

    SimNodeListData:
      type: object
      description: |
        节点清单（GET /api/v1/scene/sim-nodes）。`items` 复用 `SimNodeDetailData`：
        登记表可用时附带管理字段（`display_name`/`token_id`/`kafka_cert_sn`/`plat_cert_sn` 等），
        未登记或无登记表时为 `null`（向后兼容，仅新增可空字段）。
      required: [items, total]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/SimNodeDetailData" }
        total: { type: integer, minimum: 0 }

    SimNodeResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/SimNodeData" }

    SimNodeListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/SimNodeListData" }

    # ---------- V1.24.1 仿真端管理：详情 / 登记 / 令牌 / 证书 ----------
    SimNodeDetailData:
      description: |
        节点详情视图（`SimNodeData` 叠加登记表 `scene_svc.sim_node_registry` 字段）。
        Redis 实时态提供 `endpoint_*`/`online`/`last_seen_at`/`running_count`；
        PostgreSQL 登记表提供 `display_name`/`token_*`/`kafka_cert_*`/`plat_cert_*`（懒建：首次访问自动建行）。
      allOf:
        - $ref: "#/components/schemas/SimNodeData"
        - type: object
          properties:
            display_name: { type: string, nullable: true, maxLength: 128, description: 管理员设定的展示名称 }
            registry_description: { type: string, nullable: true, maxLength: 500, description: 管理员设定的备注 }
            owner_client_id: { type: string, nullable: true, description: 注册时绑定的调用方 client_id }
            token_id: { type: string, nullable: true, description: 已签发服务令牌的 jti；未签发/已撤销 = null }
            token_issued_at: { type: string, format: date-time, nullable: true }
            kafka_cert_sn: { type: string, nullable: true, description: Kafka 客户端证书序列号（大写 HEX） }
            kafka_cert_issued_at: { type: string, format: date-time, nullable: true }
            plat_cert_sn: { type: string, nullable: true, description: 平台访问证书序列号（大写 HEX） }
            plat_cert_issued_at: { type: string, format: date-time, nullable: true }
            registry_first_seen_at:
              type: string
              format: date-time
              nullable: true
              description: 登记行创建时间（≈ 管理员首次查看时间）
            registry_labels:
              type: object
              nullable: true
              additionalProperties: { type: string, maxLength: 128 }
              description: 管理员在登记表设定的标签（与节点自报 `labels` 分开）
            # ---- V1.24.2 一键开通编排态（未开通/懒建行时为默认骨架）----
            provision_state:
              type: string
              nullable: true
              enum: [pending, in_progress, ready, failed]
              description: 四步聚合态（provision_status.state）
            provision_steps:
              type: array
              nullable: true
              items: { $ref: "#/components/schemas/SimNodeProvisionStep" }
              description: 按 db/scram/topics/cert 顺序展平的步骤列表
            scram_username:
              type: string
              nullable: true
              description: Kafka SCRAM 主体名（= sim-{node_id}）；⚠ 口令本身永不返回
            scram_credential_updated_at: { type: string, format: date-time, nullable: true }
            cert_not_after:
              type: string
              format: date-time
              nullable: true
              description: 证书到期快照（取 Kafka 证书）

    SimNodeRegistryPatch:
      type: object
      description: 管理员 PATCH 请求体（仅更新登记基础信息，不涉及令牌/证书）
      additionalProperties: false
      properties:
        display_name: { type: string, nullable: true, maxLength: 128, description: 展示名称；传空串 = 清除 }
        description: { type: string, nullable: true, maxLength: 500, description: 备注描述；传空串 = 清除 }
        labels:
          type: object
          nullable: true
          additionalProperties: { type: string, maxLength: 128 }
          description: 管理员自定义标签（整体覆盖）

    IssueTokenResult:
      type: object
      description: 签发服务令牌一次性响应（`access_token` 不落日志，仅响应体出现）
      required: [node_id, access_token, token_id]
      properties:
        node_id: { $ref: "#/components/schemas/SimNodeId" }
        access_token:
          type: string
          writeOnly: true
          description: 一次性服务令牌（JWT）；平台不落盘不写日志，丢失后需重新签发
        token_id: { type: string, description: 服务令牌的 jti（登记展示用；撤销按 client_id=node_id） }
        expires_at: { type: string, format: date-time, nullable: true, description: 令牌到期时间；永久令牌为 null }

    IssueCertResult:
      type: object
      description: 签发/重签证书响应
      required: [node_id, cert_type, serial_hex, issued_at]
      properties:
        node_id: { $ref: "#/components/schemas/SimNodeId" }
        cert_type: { type: string, enum: [kafka, platform] }
        serial_hex: { type: string, description: 新证书序列号（大写十六进制） }
        issued_at: { type: string, format: date-time }

    SimNodeDetailResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/SimNodeDetailData" }

    SimNodeRegistryPatchResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/SimNodeDetailData" }

    IssueTokenResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/IssueTokenResult" }

    IssueCertResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/IssueCertResult" }

    SimNodeEmptyResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data: { type: object, nullable: true, description: 恒为 null }

    # ---------- V1.24.2 一键开通（provision / rotate-scram / deprovision） ----------
    SimNodeProvisionRequest:
      type: object
      description: |
        一键开通请求体（管理员指定 node_id + 基础元信息）。node_id 格式同 `SimNodeId`；
        开通后节点用同一 node_id 完成注册/心跳（地址仍由服务端自学习，不经本体传递）。
      required: [node_id]
      additionalProperties: false
      properties:
        node_id: { $ref: "#/components/schemas/SimNodeId" }
        display_name: { type: string, nullable: true, maxLength: 128, description: 展示名称 }
        description: { type: string, nullable: true, maxLength: 500, description: 备注描述 }
        labels:
          type: object
          nullable: true
          additionalProperties: { type: string, maxLength: 128 }
          description: 管理员自定义标签（机房/显卡型号等）
        takeover_existing:
          type: boolean
          default: false
          description: SCRAM/Topic/证书已存在时接管复用（跳过创建，state=skipped；回滚时不清理这些外部既有资源）

    SimNodeProvisionStep:
      type: object
      description: 单步编排状态（对齐车辆 ProvisionStep；name=db|scram|topics|cert）
      required: [name, state]
      properties:
        name: { type: string, enum: [db, scram, topics, cert] }
        state: { type: string, enum: [pending, in_progress, ok, failed, skipped] }
        error: { type: string, nullable: true, maxLength: 500, description: 失败时错误摘要（已截断） }
        ts: { type: integer, nullable: true, description: 步骤完成 epoch 秒 }

    SimNodeProvisionResult:
      type: object
      description: 一键开通结果（成功含一次性口令与证书序列号；四步终态快照）
      required: [node_id, scram_username, provision_state, steps]
      properties:
        node_id: { $ref: "#/components/schemas/SimNodeId" }
        scram_username:
          type: string
          description: Kafka SCRAM 主体名（sim-node_id 形式，与证书 CN 一致）
        scram_password:
          type: string
          writeOnly: true
          description: 一次性 SCRAM 口令（服务端生成）；不落库/不入接入包/不写日志，丢失后需 rotate-scram
        kafka_cert_sn: { type: string, nullable: true, description: Kafka 客户端证书序列号（大写 HEX） }
        plat_cert_sn: { type: string, nullable: true, description: 平台访问证书序列号（大写 HEX） }
        provision_state:
          type: string
          enum: [pending, in_progress, ready, failed]
          description: 四步聚合态
        steps:
          type: array
          items: { $ref: "#/components/schemas/SimNodeProvisionStep" }
          description: 按 db/scram/topics/cert 顺序展平

    RotateScramResult:
      type: object
      description: 口令轮换一次性响应（scram_password 不落日志）
      required: [node_id, scram_username, scram_password]
      properties:
        node_id: { $ref: "#/components/schemas/SimNodeId" }
        scram_username: { type: string }
        scram_password:
          type: string
          writeOnly: true
          description: 新一次性口令（仅此响应可见）
        credential_updated_at: { type: string, format: date-time }

    SimNodeDeprovisionResult:
      type: object
      description: 下线回收摘要（各资源清理结果；供审计）
      required: [node_id]
      properties:
        node_id: { $ref: "#/components/schemas/SimNodeId" }
        cert_dir_removed: { type: boolean, description: 证书目录是否已删（不存在=true） }
        scram_removed: { type: boolean, description: SCRAM 用户是否已删（不存在=true） }
        topics_removed:
          type: array
          items: { type: string }
          description: 已删的节点级回传 Topic 名（含 .dlq）
        registry_removed: { type: boolean, description: 登记行是否已删 }
        redis_removed: { type: boolean, description: Redis 登记是否已清理 }

    SimNodeProvisionResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/SimNodeProvisionResult" }

    RotateScramResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/RotateScramResult" }

    SimNodeDeprovisionResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/SimNodeDeprovisionResult" }


# =====================================================================
# 扩展字段：机器可校验契约（由 services/scene-service/app/tests/test_openapi_contract.py 强制校验）
# =====================================================================
x-hunter-service:
  name: scene-service
  port: 8081
  gateway_prefix: /api/v1/scene
  db_schema: scene_svc
  db_tables: [scenes, sim_node_registry]
  minio_buckets: [hunter-scene-assets]
  redis_keys:
    - pattern: "cache:scene:{scene_id}"
      type: "String(JSON)"
      ttl_seconds: 3600
      usage: "GET /api/v1/scene/{scene_id} 场景详情缓存（写操作后主动失效）"
    - pattern: "vil:session:{vehicle_id}"
      type: "String(JSON)"
      ttl_seconds: 7200
      usage: "VIL 会话映射（scene-service 写；vil-forwarder 读）"
    - pattern: "vil:active"
      type: "Set"
      ttl_seconds: null
      usage: "活动 VIL 车辆集合（创建 SADD；终态/取消 SREM）"
    - pattern: "sim:instance:{sim_instance_id}"
      type: "String(JSON)"
      ttl_seconds: 86400
      usage: "仿真实例元数据（pause/resume/cancel 与 Topic 清理）"
    - pattern: "sim:node:{node_id}"
      type: "String(JSON)"
      ttl_seconds: 90
      usage: "节点注册信息与**自学习地址**（每次注册/心跳覆盖；owner / maps / capacity / running / endpoint_ip / manager_port / protocol / endpoint_source / learned_at）"
    - pattern: "sim:node:seen"
      type: "ZSet"
      ttl_seconds: null
      usage: "member = node_id，score = 最后心跳 epoch 秒（在线判定与节点枚举索引；过期成员读取时懒清理 ZREM）"
    - pattern: "sim:runtime:{sim_instance_id}"
      type: "String(JSON)"
      ttl_seconds: 86400
      usage: "实例→节点归属绑定（node_id / scene_id / sim_id / last_status / updated_at）；仅存 node_id，地址在每次调用时解析"
    - pattern: "sim:instance:active"
      type: "ZSet"
      ttl_seconds: null
      usage: "活动实例索引（创建 ZADD；终态回收/复核为终态时 ZREM）"
  config_source: "pydantic-settings（环境变量 / K8s ConfigMap scene-service-config + Secret hunter-app-secrets）"
  required_env:
    - SERVICE_NAME
    - API_PORT
    - DATABASE_URL
    - REDIS_URL
    - MINIO_ENDPOINT
    - MINIO_BUCKET_SCENE_ASSETS
    # ---------- MinIO / 导出（4.3 节） ----------
    - MINIO_REGION
    - SCENE_EXPORT_OBJECT_PREFIX            # 契约 x-hunter-export.object_prefix（scenarios/）
    - SCENE_EXPORT_PRESIGN_EXPIRE_SECONDS   # 契约固定 900（15 分钟下载预签名）
    - SCENE_EXPORT_MAX_SCENES               # 契约 SceneExportRequest.scene_ids maxItems = 50
    # ---------- Carla 管理 API（4.4 节；⚠ 键名与子路径待确认 #9） ----------
    - CARLA_MANAGEMENT_ENDPOINT             # ⚠ 键名待确认（禁止在代码中硬编码 Carla 地址）
    - CARLA_INSTANCE_CREATE_PATH            # ② 创建仿真实例路径（默认 /api/v1/instances）
    - CARLA_INSTANCE_QUERY_PATH             # 并行实例查询路径（默认 /api/v1/instances）
    - CARLA_SCENARIO_SUBMIT_PATH            # ③④ 下发场景配置路径（含 {sim_instance_id}）
    - CARLA_INSTANCE_GET_PATH               # ⑥ 进度查询路径（含 {sim_instance_id}，决策 G-20①）
    - CARLA_INSTANCE_RESULT_PATH            # ⑦ 结果查询路径（含 {sim_instance_id}，决策 G-20①）
    - CARLA_REQUEST_TIMEOUT_SECONDS
    - CARLA_REQUEST_MAX_RETRIES
    # ---------- 场景约束与缓存（4.2 节 + Redis Key 契约） ----------
    - SCENE_DURATION_MAX_SECONDS            # ⚠ 上限设计文档未定义（待确认 #9）
    - SCENE_PARAM_OVERRIDE_ALLOWED_PATHS    # 参数覆盖白名单顶层路径
    - SCENE_PARAM_OVERRIDE_FORBIDDEN_PATHS  # 参数覆盖禁止路径（含 map）
    - SCENE_DETAIL_CACHE_TTL_SECONDS        # cache:scene:{scene_id} TTL（契约 3600）
    - SCENE_DUPLICATE_NAME_SUFFIX
    - SCENE_DUPLICATE_MAX_ATTEMPTS
    - SCENE_DEFAULT_VERSION
    # ---------- CARLA 车辆蓝图几何表（V1.24.9，口径见 x-hunter-simulation-flow.camera_mount_reference） ----------
    # V1.25.0：已删除 SCENE_CARLA_SPAWN_POINTS_PATH（平台不再维护地图可用出生点）
    - SCENE_CARLA_VEHICLE_GEOMETRY_PATH     # 空 = 镜像内置 config/carla_vehicle_geometry.json；表由 scripts/collect_carla_vehicle_geometry.py 导出
    # ---------- RBAC（资源域 scene：create/read/update/delete/execute） ----------
    - SCENE_READ_ROLES
    - SCENE_WRITE_ROLES
    - SCENE_EXECUTE_ROLES
    - SCENE_SCOPE_BY_CREATOR                # 数据权限隔离开关（默认关闭）
    - SCENE_SCOPE_EXEMPT_ROLES
    # ---------- 实车场景自动提取（4.5 节） ----------
    - ANALYTICS_RESULT_TOPIC
    - SCENE_EXTRACTION_GROUP_ID
    - SCENE_EXTRACTION_CONSUMER_ENABLED
    - KAFKA_EXTRACTION_POLL_TIMEOUT_SECONDS
    - SCENE_EXTRACTION_CREATOR_ID           # ⚠ 自动提取无人类操作者，系统 uuid 待确认
    - SCENE_EXTRACTION_DEFAULT_EGO_MODEL
    - SCENE_EXTRACTION_MIN_SAFE_DISTANCE
    - SCENE_EXTRACTION_MAX_SPEED_DEVIATION
    # ---------- 仿真节点控制面与动态地址直推（V1.24.0，x-hunter-simulation-flow.node_dispatch） ----------
    - SIM_DISPATCH_MODE                     # direct（默认，固定地址）| node（按自学习地址直推节点 CARLA 管理 API）
    - SIM_NODE_LEASE_SECONDS                # 在线租约秒数（sim:node TTL 与离线判定窗口，默认 90）
    - SIM_NODE_DEFAULT_CAPACITY             # 注册未声明 capacity 时的默认可并发数（默认 1）
    - SIM_NODE_ROLES                        # 允许调用节点控制面的角色（默认 data-uploader,admin）
    - SIM_NODE_MANAGER_DEFAULT_PORT         # 节点 CARLA 管理 API 默认端口（默认 8090）
    - SIM_NODE_MANAGER_SCHEME               # 拼基址默认协议（http|https，默认 http）
    - SIM_NODE_TRUST_FORWARDED_FOR          # 是否采信 X-Real-IP / X-Forwarded-For（false = 只认 TCP 对端）
    - SIM_NODE_ALLOWED_NETWORKS             # 节点地址 CIDR 白名单（逗号分隔，空 = 不限制）
    - SIM_NODE_CLIENT_CACHE_MAX             # 每节点 CARLA 客户端缓存上限（超出按插入序淘汰）
    - SIM_INSTANCE_TTL_SECONDS              # sim:instance / sim:runtime 保留期（默认 86400）
  performance:
    api_p95_ms: 200             # 13.2 节：API 响应 P95 ≤ 200ms
    list_default_page_size: 20
    list_max_page_size: 200

#: 设计文档 12.2 节 scene-service REST 端点清单（本契约不得擅自增删；回归测试逐条比对）
x-hunter-endpoints:
  source: "设计文档 12.2 节"
  endpoints:
    - "GET /api/v1/scene"
    - "GET /api/v1/scene/{scene_id}"
    - "POST /api/v1/scene"
    - "PUT /api/v1/scene/{scene_id}"
    - "DELETE /api/v1/scene/{scene_id}"
    - "POST /api/v1/scene/{scene_id}/duplicate"
    - "POST /api/v1/scene/{scene_id}/publish"
    - "POST /api/v1/scene/export"
    - "POST /api/v1/scene/{scene_id}/run"
    - "GET /api/v1/scene/templates"
    # 决策 G-20① 新增（设计文档 12.2 节清单未列，4.4 节步骤⑥⑦补齐，待设计文档同步勘误）
    - "GET /api/v1/scene/simulations/{sim_instance_id}"
    - "GET /api/v1/scene/simulations/{sim_instance_id}/result"
    # CARLA 仿真控制（接入方案 P1：pause/resume/cancel；设计文档 12.2 未列，需同步勘误）
    - "POST /api/v1/scene/simulations/{sim_instance_id}/pause"
    - "POST /api/v1/scene/simulations/{sim_instance_id}/resume"
    - "POST /api/v1/scene/simulations/{sim_instance_id}/cancel"
    # 仿真节点控制面（V1.24.0 动态地址直推；设计文档 12.2 未列，需同步勘误）
    - "GET /api/v1/scene/sim-nodes"
    - "PUT /api/v1/scene/sim-nodes/{node_id}"
    - "POST /api/v1/scene/sim-nodes/{node_id}/heartbeat"
    # 仿真端管理（V1.24.1：详情/登记/令牌/证书/下线；RBAC 复用 scene:*）
    - "GET /api/v1/scene/sim-nodes/{node_id}"
    - "PATCH /api/v1/scene/sim-nodes/{node_id}"
    - "DELETE /api/v1/scene/sim-nodes/{node_id}"
    - "POST /api/v1/scene/sim-nodes/{node_id}/issue-token"
    - "DELETE /api/v1/scene/sim-nodes/{node_id}/token"
    - "POST /api/v1/scene/sim-nodes/{node_id}/issue-kafka-cert"
    - "POST /api/v1/scene/sim-nodes/{node_id}/issue-platform-cert"
    - "GET /api/v1/scene/sim-nodes/{node_id}/bundle"
    # 仿真端一键开通（V1.24.2：对齐车辆 provisioning；建节点即产出 SCRAM 口令 + 双证书 + 接入包）
    - "POST /api/v1/scene/sim-nodes"
    - "POST /api/v1/scene/sim-nodes/{node_id}/rotate-scram"
    - "POST /api/v1/scene/sim-nodes/{node_id}/retry-provision"
  ops_endpoints: ["GET /healthz", "GET /readyz", "GET /metrics"]

x-hunter-scene-types:
  source: "contracts/scene-taxonomy.yaml（单一事实来源）；设计文档 4.2.1 分类体系 + GB/T 47025—2026 覆盖面"
  status: confirmed_extensible
  note: |
    取值以受控字典为准，可持续扩充：新增类型仅需编辑 scene-taxonomy.yaml，无需改本契约或后端逻辑。
    categories[].types 的并集必须等于 scene-taxonomy.yaml 的 scene_types 全集（契约测试交叉校验）。
    叶子类型共 48（basic 12 / interactive 10 / environment 8 / corner_case 16 / custom 1 / real_vehicle 1）。
  categories:
    - value: basic
      label: 基础场景
      types: [straight_cruise, curve_driving, car_following, lane_change, overtaking, ramp_merge, ramp_exit, tunnel_driving, roundabout, narrow_road_meeting, uturn, parking]
      type_labels:
        straight_cruise: 直线巡航
        curve_driving: 弯道行驶
        car_following: 跟车行驶
        lane_change: 变道行驶
        overtaking: 超车借道
        ramp_merge: 匝道汇入
        ramp_exit: 匝道汇出
        tunnel_driving: 隧道通行
        roundabout: 环岛通行
        narrow_road_meeting: 窄路会车
        uturn: 掉头
        parking: 泊车
    - value: interactive
      label: 交互场景
      types: [cut_in, cut_out, pedestrian_crossing, occluded_pedestrian, intersection_meeting, unprotected_turn, construction_detour, cyclist_interaction, queue_creep, wrong_way_encounter]
      type_labels:
        cut_in: 前车切入
        cut_out: 前车切出
        pedestrian_crossing: 行人横穿
        occluded_pedestrian: 鬼探头
        intersection_meeting: 路口会车
        unprotected_turn: 无信号路口转弯冲突
        construction_detour: 施工绕行
        cyclist_interaction: 非机动车交互
        queue_creep: 拥堵蠕行
        wrong_way_encounter: 逆行借道冲突
    - value: environment
      label: 环境场景
      types: [rainy, night, foggy, backlight, snowy, icy, haze, dusk_dawn]
      type_labels:
        rainy: 雨天
        night: 夜间
        foggy: 雾天
        backlight: 强光逆光
        snowy: 雪天
        icy: 结冰路面
        haze: 霾低能见度
        dusk_dawn: 黄昏黎明
    - value: corner_case
      label: 极端场景（Corner Case）
      types: [emergency_braking, obstacle_appearance, sensor_failure, multi_vehicle_mixed, stationary_obstacle, debris_spillage, animal_crossing, door_opening, child_chasing_ball, aggressive_cut_in, accident_scene, degraded_localization, comms_failure, actuator_failure, driver_incapacitation, minimal_risk_manoeuvre]
      type_labels:
        emergency_braking: 紧急制动
        obstacle_appearance: 障碍物突现
        sensor_failure: 传感器失效
        multi_vehicle_mixed: 多车混行
        stationary_obstacle: 静止障碍物
        debris_spillage: 路面遗撒物
        animal_crossing: 动物穿行
        door_opening: 开门杀
        child_chasing_ball: 儿童追球
        aggressive_cut_in: 激进加塞博弈
        accident_scene: 事故现场绕行
        degraded_localization: 定位丢失地图失配
        comms_failure: 通信中断
        actuator_failure: 执行器故障
        driver_incapacitation: 驾驶员失能
        minimal_risk_manoeuvre: 最小风险策略
    - value: custom
      label: 自定义场景
      types: [custom]
      type_labels:
        custom: 自定义
    - value: real_vehicle
      label: 实车回放
      source: "4.5 节：实车场景自动提取产物标记为「实车回放」类型"
      types: [real_vehicle_replay]
      type_labels:
        real_vehicle_replay: 实车回放

x-hunter-scene-config-contract:
  source: "设计文档 4.2.2 节（场景配置 JSON 结构，字段名不可更改）"
  note: "metadata_fields 一一对应 scene_svc.scenes 列；simulation_fields 写入 scenes.config_json"
  metadata_fields: [scene_id, scene_name, scene_type, description, version, creator, tags]
  simulation_fields: [map, ego_vehicle, weather, actors, events, success_criteria, duration]
  nested_fields:
    map: [map_id, map_type, spawn_point]
    ego_vehicle: [model, initial_speed, initial_steer]
    weather: [cloudiness, rain, wetness, fog, wind, sun_azimuth, sun_altitude]
    actors: [actor_id, type, spawn_point, behavior]
    events: [event_id, type, trigger, action]
    success_criteria: [max_speed_deviation, no_collision, min_safe_distance]
  storage:
    metadata_fields: "scene_svc.scenes 独立列"
    simulation_fields: "scene_svc.scenes.config_json (JSONB，GIN 索引 idx_scenes_config_json)"
  required_all: true          # 上述字段全部必填（actors/events 允许空数组）
  spawn_point_semantics:
    status: "已固化（V1.25.0 反转职责；原待确认项 #3 中的 spawn_point 部分）"
    stored: "map.spawn_point = 自车出生点（目录模板为占位原点 (0,0,0)）；actors[].spawn_point = 相对 map.spawn_point 的偏移"
    dispatched: "下发载荷原样保留上述两组值，根节点附 spawn_semantics=relative_to_ego（不做任何折算）"
    consumer_transform: "仿真端：先按地图取有效出生坐标替换自车基准，再对每个参与者 x/y/z 叠加偏移、yaw 相加后归一到 [-pi, pi]"
    validity_owner: "有效车道坐标的校验与替换由仿真端（HunterSim）承担；平台不维护出生点表"
    origin_guard: "无（V1.24.8~V1.24.10 曾拦原点返 2001，V1.25.0 推翻）"
    consumer_note: "若仿真端尚未实现替换，自车仍会落在世界原点（黑屏风险）；该风险属仿真端未实现，不属平台缺陷"

x-hunter-lifecycle:
  source: "contracts/database/enums.md 第 6 节（scenes.status）+ 设计文档 12.2 节"
  states: [draft, published, archived]
  editable_states: [draft]
  deployable_states: [published]
  exportable_states: [draft, published, archived]
  deletable_states: [draft, archived]
  transitions:
    - {from: draft, to: published, endpoint: "POST /api/v1/scene/{scene_id}/publish"}
    - {from: published, to: archived, endpoint: null}
  note: "⚠ archived 仅存在于状态词表，12.2 节未定义归档端点，本契约不擅自新增（见 x-hunter-pending-confirmation）"

x-hunter-export:
  source: "设计文档 4.3 节"
  formats:
    - value: carla_scenariorunner_xml
      extension: .xml
      description: "Carla ScenarioRunner 场景文件（可直接由 scenario_runner.py 执行）"
    - value: openscenario_1_2
      extension: .xosc
      description: "OpenSCENARIO 1.2 标准描述文件（写入 x-scenario-version 字段）"
  bucket: hunter-scene-assets
  object_prefix: "scenarios/"
  presign_expires_in_seconds: 900     # MinIO 契约：下载预签名 15 分钟
  range_download: true                # MinIO 契约：支持 Range 分片下载
  naming: "scene-{scene_id}-{version}.{ext}"


x-hunter-simulation-flow:
  source: "设计文档 4.4 节（场景下发流程，7 步）"
  status_values: [pending, running, succeeded, failed, canceled]
  steps:
    - "① 校验场景配置完整性（4.2.2 结构 + 状态必须为 published）"
    - "② 调用 Carla 管理 API 创建仿真实例（连接超时/重试，失败返回 5001）"
    - "③ 下发场景配置 JSON（4.2.2 结构 + param_overrides 白名单深合并）"
    - "④ Carla 加载地图、生成参与者、设置环境（weather/actors）"
    - "⑤ 返回 sim_instance_id，场景运行状态更新为 running"
    - "⑥ 实时监控仿真进度：GET /api/v1/scene/simulations/{sim_instance_id}（决策 G-20①，无状态代理 Carla）"
    - "⑦ 仿真结束 → 回收资源 → 保存结果：GET /api/v1/scene/simulations/{sim_instance_id}/result（决策 G-20①；产物预签名 15 分钟）"
  implementations_pending:
    - "主动推送（Carla 回调 / WebSocket 进度推送）未实现：本期前端轮询进度端点；如需推送另行立项"
    - "⑦ 结果落库（Carla → hunter-scene-assets 产物转存）由 Carla 侧完成，平台仅代理查询（产物 key 约定待确认 #9）"
  entrypoint_env: CARLA_MANAGEMENT_ENDPOINT   # ⚠ 键名待确认
  timeout_policy: "连接/读超时与重试次数需环境变量化（禁止硬编码）"
  # ---------- V1.23.7：地址与子路径的配置语义（错误码不变，仅细化可定位性） ----------
  endpoint_address_contract:
    format: "scheme://host[:port]；scheme 仅允许 http/https；禁止携带子路径（子路径走 *_PATH 键）"
    validation: "客户端构造期校验；形态非法不阻塞启动，但任何调用在**发出请求前**返回 5001"
    rationale: "实机：.env 中 `KEY=   # 注释` 的行尾注释被 docker compose 当成值下发，值非空 ⇒ 绕过「未配置」判定 ⇒ httpx UnsupportedProtocol 被兜底文案误报为「不可达」"
    subpath_defaults: "CARLA_INSTANCE_*_PATH 为空串/纯空白时回落服务默认值（compose 以 ${VAR:-} 透传，避开插值默认值含 `{` 时的截断）；模板缺 {sim_instance_id} 占位符 → 5001「子路径配置非法」，不得泄为 5000"
    injection_parity: "compose（infra/deploy/docker-compose.yml）与 K8s ConfigMap（infra/k8s/services/scene-service.yaml）自 V1.23.7 起对称注入 8 个子路径 + 超时/重试"
  failure_message_taxonomy:
    - {message: "Carla 管理 API 未配置", cause: "CARLA_MANAGEMENT_ENDPOINT 为空", retryable_by_config: "填地址并 force-recreate"}
    - {message: "Carla 管理 API 地址非法", cause: "值形态不符 endpoint_address_contract（含行尾注释污染）", retryable_by_config: "改值；不发请求，无副作用"}
    - {message: "Carla 管理 API 子路径配置非法", cause: "模板缺 {sim_instance_id} 或含非法占位符", retryable_by_config: "改 *_PATH 键"}
    - {message: "Carla 管理 API 连接超时", cause: "CARLA_REQUEST_TIMEOUT_SECONDS 内未响应（对端同步阻塞/防火墙丢包）", retryable_by_config: "调大超时或修对端异步返回"}
    - {message: "Carla 管理 API 不可达", cause: "传输层错误（DNS 不可解析 / 连接被拒）", retryable_by_config: "修地址与网络"}
    - {message: "Carla 管理 API 返回 <code>", cause: "连得通但路由/权限不对", retryable_by_config: "核对子路径（待确认 #9）"}

  # ---------- V1.25.0：出生点职责反转（平台原样下发，仿真端替换占位原点） ----------
  spawn_point_dispatch:
    status: delegated_to_simulator
    problem: "平台下发的 map.spawn_point 常为 (0,0,0)（目录模板占位值），自车落在 CARLA 内置城镇的世界原点会黑屏或只见路面"
    authority: "有效出生坐标只能由实机 CARLA ``world.get_map().get_spawn_points()`` 得到；客户端与服务器必须同版本，而部署环境服务器为源码编译的 dev build，平台侧无从导出、也不得猜测坐标"
    platform_behavior:
      - "下发链路（本端点）：出生点与参与者偏移均按场景存量值原样下发，不折算、不拦原点"
      - "校验链路（生成/编译/G3）：只校地图非空、白名单、生成点数值有限、几何围栏（按 base + offset）"
      - "批量生成脚本：固定写占位原点 (0,0,0)，不再校出生点表（旧退出码 2 已取消）"
    simulator_responsibility:
      - "取当前地图的候选出生点，丢弃原点退化坐标，按场景稳定散列选一个（可复现）、同批实例分散放置"
      - "把选出的坐标写为自车 transform，并把 actors[].spawn_point 偏移叠加到该基准（平台不再代算）"
      - "hd_map / site_map 等非 carla_town 不做替换；日志记录替换前后坐标以便回查"
    dispatch_transform: "无（相对偏移原样下发）；载荷根节点附 spawn_semantics=relative_to_ego；map.spawn_point 保持原值"
    rejected_alternative: "V1.24.8~V1.24.10 的平台侧实机表 + G3 拦截 + 下发 2001 + 相对→绝对折算：在目标部署环境结构性做不到（采不出有效坐标），已整体删除"
    risk: "仿真端实现替换前，原点场景仍会黑屏（旧行为回归）；平台侧已无兜底手段"

  # ---------- V1.24.9：传感器挂载尺寸参考（平台侧缓解；挂载换算仍在仿真端） ----------
  camera_mount_reference:
    status: platform_side_ready
    problem: "仿真画面不黑但只看到路面：传感器挂载点按写死偏移给出，碰到蓝图资产缺失回退全尺寸车辆时镜头埋进车身/贴地。挂载点属仿真端实现细节，平台不代算，只给换算依据"
    authority: "车辆尺寸只能来自实机 CARLA 蓝图（blueprint.get_dimension() / get_bounding_box()），由 scripts/collect_carla_vehicle_geometry.py 导出到 services/scene-service/config/carla_vehicle_geometry.json（SCENE_CARLA_VEHICLE_GEOMETRY_PATH 可覆盖）；平台不编造尺寸"
    payload_field: "下发载荷根节点 sensor_mount_reference（纯附加信息，不改变任何现有字段）"
    resolution: "按 ego_vehicle.model 解析蓝图：model_to_blueprint 显式映射 → 蓝图 ID 归一化 → display_name 归一化（大小写/空格/连字符差异不敏感）"
    semantics:
      dimension_m: "实机长宽高（米）"
      bounding_box_m: "包围盒 center（相对车辆自身原点的盒心偏移）与 extent（半尺寸），车辆坐标系 X 向前、Z 向上"
      envelope_m: "由 center ± extent 推导的边界：front/rear_edge_x_m、side_edge_y_m（左右对称，Y 轴朝向由仿真端解释）、roof/bottom_z_m、half_*_m"
      mount_policy: "derive_from_blueprint_bounding_box：挂载点 = 上述边界 ± 仿真端自身余量；平台不下发具体挂载坐标"
    status_values:
      resolved: "已命中蓝图，携带 dimension_m / bounding_box_m / envelope_m"
      table_uncalibrated: "出厂骨架未采集（calibrated=false），不携带任何数字；仿真端应回退自身蓝图查询"
      blueprint_unmatched: "表已校准但 ego_vehicle.model 未登记映射，不携带任何数字"
      table_unavailable: "几何表文件缺失/结构非法；不影响下发（仅记平台日志），不携带任何数字"
    non_blocking: "参考块的构造失败不阻断下发（与出生点硬拦解耦）；未命中时不携带数字是为了避免仿真端把空信息当尺寸"
    remaining_work: "问题 2 的完整修复仍需仿真端消费本字段（按包围盒换算挂载点、替代写死偏移，并处理 hunter_se 资产缺失时的回退蓝图尺寸），属 HunterSim 侧本轮未改动"
    handoff_doc: "docs/HunterSim传感器挂载换算方案.md（已交付给仿真端的实现方案与验收判据：§3 锚点±余量换算规则、§4 改造清单与本地实测降级、§7 自检脚本、§8 七条验收判据；本仓库不代写 HunterSim 代码）"

  # ---------- V1.24.0：下发链路模式（direct 固定地址 / node 地址自学习动态直推） ----------
  node_dispatch:
    status: implemented
    source: "实机拓扑确认（平台有线接交换机，HunterSim 走 WiFi；二者同网段：实录 192.168.31.35 可访问 192.168.31.20:8090）"
    rationale: |
      HunterSim 只能出向连接平台（WiFi），但平台与它同网段 ⇒ 平台可回访 HunterSim 上的
      CARLA 管理端口。因此不需要任务队列/长轮询：平台只需知道“节点现在在哪个 IP”，
      而这个信息在节点每次注册/心跳时从入站请求头自然获得。
    delivery: push_to_learned_endpoint
    addressing_rule: |
      地址来源 = 入站请求头自学习，仅由注册/心跳写入，每次覆盖；实例侧只持久化 `node_id`，
      地址在每次调用时解析。因此：节点重连/DHCP 换址后，下一次心跳即刷新登记表；已下发实例的
      后续操控（③⑥⑦）每次调用都重新解析地址 ⇒ IP 漂移自愈，不需要任何人工处置。
      禁止把地址串随实例持久化（否则地址一变就只会打中旧地址、只能等失败）。
    endpoint_learning:
      sources_in_order: ["X-Real-IP", "X-Forwarded-For 首跳", "TCP 对端（request.client.host）"]
      trust_header: "SIM_NODE_TRUST_FORWARDED_FOR=false 时只认 TCP 对端（直连部署/防头伪造）"
      validation: "每个候选值必须过 ipaddress 字面量校验（域名/多值/空白=非法），非法则丢弃并降级到下一来源"
      allowed_networks: "SIM_NODE_ALLOWED_NETWORKS（CIDR 逗号分隔白名单，空=不限制）；不命中同样降级"
      all_failed: "注册/心跳返回 2001「无法判定节点地址来源」（不把无法下发的节点登为在线）"
      base_url: "`{protocol}://{ip}:{manager_port}`；IPv6 拼为 `{protocol}://[{ip}]:{manager_port}`"
      port_and_protocol: "取注册体 manager_port / protocol，缺省取 SIM_NODE_MANAGER_DEFAULT_PORT / SIM_NODE_MANAGER_SCHEME"
      never_used: "节点自述的 runtime_hint 与业务字段一律不参与寻址"
    direction: "平台 → 节点（同步直推，与 direct 模式同方向）"
    transport: "httpx（复用 CarlaManagementClient，子路径与请求体完全共用 CARLA_INSTANCE_*_PATH）"
    # ---------- V1.24.2：下发通道 mTLS 保护（替代旧“不实现鉴权/手工注入凭据”） ----------
    security:
      mode: mTLS_client_cert
      status: contract_defined   # 本轮定契约；代码接入为后续步骤（sim_dispatch 注入证书）
      platform_side: "平台以 sim-platform-{node_id} 客户端证书（provision 时签发、存 SIM_NODE_CERTS_DIR/{node_id}/platform/）呈现"
      node_side: "节点 CARLA 管理 API 须启用 TLS 并信任平台 CA（接入包内含平台 CA 证书），仅接受 CN=sim-platform-{node_id} 的客户端"
      rationale: |
        旧现状：平台→节点直推无任何鉴权（节点管理端口裸 HTTP），依赖同网段隔离；V1.24.2 改为平台 mTLS
        ⇒ 下发通道双向可验证，不再依赖“凭据由运行环境手工注入”（见 carla.py kafka 段旧注释）。
      backoff: "SIM_DISPATCH_MTLS_ENABLED=false 时退回旧直推（仅供灰度/回滚），生产默认应置 true"
    auth: "服务令牌（api-gateway POST /api/v1/user/service-token）；角色限 SIM_NODE_ROLES（默认 data-uploader,admin）；节点清单用 scene:read"
    gateway_reuse: |
      节点控制面落在既有前缀 /api/v1/scene 下 ⇒ 无需修改 x-hunter-gateway-routes；
      网关只剥离逐跳头与身份头、注入 X-Real-IP / X-Forwarded-For ⇒ 两个地址头可透传到服务。
    auth: "服务令牌（api-gateway POST /api/v1/user/service-token）；角色限 SIM_NODE_ROLES（默认 data-uploader,admin）；节点清单用 scene:read"
    owner_binding: "首次注册写入 owner=service:{client_id}；owner 不一致的写调用 → 1002（防越权接管节点）"
    lease: "sim:node:{node_id} SET EX SIM_NODE_LEASE_SECONDS（默认 90）+ ZADD sim:node:seen；在线 = score > now - lease"
    step_mapping:
      - "② 创建实例：select_node(map_id) → node_endpoint(node_id) → POST {base_url}{CARLA_INSTANCE_CREATE_PATH}（sim_instance_id 由节点 CARLA 返回，与 direct 一致）"
      - "③ 下发场景：sim:runtime 取 node_id → POST {base_url}{CARLA_SCENARIO_SUBMIT_PATH}"
      - "⑥ 进度：sim:runtime 取 node_id → GET {base_url}{CARLA_INSTANCE_GET_PATH}，结果回写 last_status/updated_at"
      - "⑦ 结果/操控：同上走 CARLA_INSTANCE_RESULT_PATH / PAUSE / RESUME / STOP_PATH"
    node_selection: |
      在线节点中取空闲容量（capacity - len(running_instance_ids)）最多者，同空闲度按 node_id 升序（确定性）；
      声明了 maps 且不含目标地图的节点被排除（未声明视为通用）；`prefer` 显式指定时必须在线。
      ⚠ 容量为节点自述值：本模式为同步直推，超额时由节点上的 CARLA 直接拒绝 ⇒ 失败按 5001 原样暴露。
    instance_binding: "sim:runtime:{sim_instance_id} = {node_id, scene_id, sim_id, last_status, updated_at}；**只绑 node_id，不绑地址串**（抗 IP 漂移的落点）"
    active_index: |
      sim:instance:active 支撑“同场景已有活动实例”判定：候选只向**其归属节点单点** get_instance 复核
      （不向全部节点 fan-out）；复核为终态则移出索引并继续下一个。
    client_cache: "dict[node_id, (base_url, client)] + asyncio.Lock；base_url 变化则新建并 aclose 旧的；超过 SIM_NODE_CLIENT_CACHE_MAX 按插入序淘汰"
    log_events:
      - {event: sim_node_registered, fields: "node_id / owner / capacity / endpoint_ip / endpoint_source"}
      - {event: sim_node_endpoint_learned, fields: "node_id / ip / source / manager_port"}
      - {event: sim_node_endpoint_refreshed, fields: "node_id / old_base_url / new_base_url（IP 漂移自愈点）"}
      - {event: sim_node_dispatch_target, fields: "node_id / base_url / scene_id"}
      - {event: sim_node_offline, fields: "node_id / lease_seconds"}
      - {event: sim_node_client_cache_evicted, fields: "node_id / max"}
    failure_semantics:
      - {code: 5001, message: "无可用仿真节点", cause: "无在线节点（或均不满足地图/指定节点约束）"}
      - {code: 5001, message: "仿真节点离线", cause: "节点租约已过或登记无合法地址；details 含 node_id / lease_seconds"}
      - {code: 5001, message: "仿真实例缺少节点归属", cause: "sim:runtime 已过期/丢失（超出保留期或跨环境）"}
      - {code: 5001, message: "Carla 管理 API 不可达/连接超时", cause: "目标 ip:port 连不通；details.endpoint 回显当前基址（不得吞为 5000）"}
      - {code: 2001, message: "无法判定节点地址来源", cause: "注册/心跳时所有地址来源均不合法"}
    finalization: "终态回收与 direct 模式同源：进度/结果轮询进入终态 → _finalize_instance（释放 VIL 会话 + 延迟删除动态 Topic）；无回报端点"
    mode_switch: |
      SIM_DISPATCH_MODE=direct|node（默认 direct，现有部署零影响）；node 模式下 CARLA_MANAGEMENT_ENDPOINT
      不参与寻址（子路径配置继续复用）。切换不会使已有实例失控：旧实例仍可通过新模式的归属索引找回。
    network_precondition: |
      node 模式要求**平台主机可入站访问 HunterSim 的 CARLA 管理端口**（容器内预检：
      `curl -m 3 http://<节点IP>:8090/api/v1/instances`；Windows 防火墙放行节点入站）。
      WiFi AP 开客户端隔离时本模式不成立 ⇒ 改回 direct 或给节点固定 IP。
    pending:
      - "节点侧 CARLA 管理 API 是否与平台 direct 模式同源版本（子路径与请求体形状）需实机验证（实录显示 8090 可用）"
      - "服务令牌轮换与多节点共用令牌时的 owner 粒度（当前：一个 client_id = 一组节点的 owner）"

# =====================================================================
# V1.24.2 仿真端一键开通编排（对齐 vehicle-service.yaml x-hunter-provisioning）
# =====================================================================
x-hunter-sim-provisioning:
  source: "对齐 services/vehicle-service/app/services/provisioner.py（DB→SCRAM→Topics→Cert 四步 + 逆序回滚）"
  status: contract_defined   # 本轮定契约；scene-service 实现 sim_provisioner.py 为后续步骤
  entrypoint: "POST /api/v1/scene/sim-nodes（provisionSimNode，RBAC scene:execute）"
  steps: [db, scram, topics, cert]        # 顺序固定；回滚逆序 cert→topics→scram（DB 行保留供审计/续跑）
  resource_per_step:
    db: "INSERT scene_svc.sim_node_registry（初始 provision_status 骨架）"
    scram: "AdminClient UPSERT SCRAM-SHA-512 用户：username=sim-{node_id}，口令 = secrets.token_urlsafe(24)"
    topics: "创建节点级回传 Topic simulation.{node_id}.result + 死信 .dlq（契约见 contracts/kafka/topics.yaml#simulation_node_topics）"
    cert: "openssl 签发双证书：Kafka 客户端 CN=sim-{node_id} + 平台访问 CN=sim-platform-{node_id}，落 SIM_NODE_CERTS_DIR/{node_id}/"
  provision_status_schema:
    state: "pending|in_progress|ready|failed"
    steps: "{db|scram|topics|cert} 各 {name,state,error,ts}；state=pending|in_progress|ok|failed|skipped"
  credentials_model:
    scram_password: "仅经开通/轮换响应一次性返回；不落 DB/不入 bundle/不写日志（与车辆一致）"
    bundle: "ZIP 含 CA + Kafka/平台证书 + kafka.properties（sasl.username=sim-{node_id}，口令位以占位符提示取自开通响应）+ README"
    takeover_existing: "true 时 SCRAM/Topic/证书已存在则接管复用（skipped）；回滚不清理这些外部既有资源"
  lifecycle_endpoints:
    provision: "POST /sim-nodes（一键开通）"
    rotate_scram: "POST /sim-nodes/{node_id}/rotate-scram（重发口令）"
    retry_provision: "POST /sim-nodes/{node_id}/retry-provision（从失败步续跑）"
    reissue_cert: "POST /sim-nodes/{node_id}/issue-kafka-cert | issue-platform-cert（单项重签，保留）"
    deprovision: "DELETE /sim-nodes/{node_id}（证书目录→SCRAM→节点级 Topic→登记行→Redis）"
  kafka_admin:
    scram_mechanism: SCRAM-SHA-512
    impl_note: "复用/对齐 vehicle-service kafka_admin（confluent-kafka KIP-95 alter_user_scram_credentials + kafka-python-ng AdminClient）；是否下沉 hunter_common 共用待实现步骤评估"
  dispatch_security: "见 x-hunter-simulation-flow.node_dispatch.security（平台 mTLS sim-platform-{node_id} 证书保护平台→节点下发）"
  backward_compat:
    - "保留现有 8 个管理端点（详情/PATCH/令牌/证书/bundle/删除）；一键开通为新增主入口，不强制取代逐项签发"
    - "存量懒建行 provision_status 默认 {state:pending,steps:{}}；首次一键开通或 PATCH 时回写"

x-hunter-real-vehicle-extraction:
  source: "设计文档 4.5 节"
  transport: kafka
  produces: []                 # 提取结果直接落库，不经 Kafka（contracts/kafka 无 scene 生产方）
  consume:
    topic: analytics_result
    group_id: scene-service-analytics-result
    schema: contracts/kafka/schemas/analytics_result.schema.json
  triggers:
    - {event_type: harsh_braking, condition: "减速度 > 3 m/s²", event_level: warning}
    - {event_type: collision_warning, condition: "TTC < 1.5 s", event_level: critical}
    - {event_type: manual_takeover, condition: "人工接管", event_level: info}
  window: {pre_seconds: 10, post_seconds: 10}       # 事件前后各 10 秒
  extracted: [ego_trajectory, object_trajectories, environment]
  output:
    scene_type: real_vehicle_replay
    status: draft
    config_storage: "scene_svc.scenes.config_json"
  idempotency_key: "(vehicle_id, window_start)"
  note: "⚠ 触发来源待核对：topics.yaml 将 scene-service 列为 event_raw 消费方，consumer-groups.yaml 仅登记 analytics_result"

x-hunter-rate-limits:
  source: "设计文档 附录 D（接口限流配置）"
  endpoint_limits: []          # 附录 D 的 3 条接口级限流不含 scene 域端点
  inherit_gateway:
    global_qps: 10000
    per_user_qps: 100
    per_ip_qps: 200
  over_limit_response: "HTTP 429 + code=5001 + Retry-After（复用错误码，见 x-hunter-pending-confirmation）"

x-hunter-kafka:
  produces: []
  consumes:
    - topic: analytics_result
      group_id: scene-service-analytics-result
      schema: contracts/kafka/schemas/analytics_result.schema.json
      enabled: true
    - topic: event_raw
      group_id: null
      schema: contracts/kafka/schemas/event.schema.json
      enabled: false
      reason: "⚠ 触发源待核对（event_raw 未登记 scene-service 消费组，禁止擅自新增消费组）"

x-hunter-error-status-map:
  source: "设计文档 附录 A 错误码 + common/python/hunter_common/exceptions.py ErrorCode"
  note: "⚠ 设计文档未定义错误码→HTTP 状态映射；此处与 services/scene-service/app/core/error_handlers.py 的 HTTP_STATUS_BY_CODE 对齐"
  map:
    1001: 401
    1002: 403
    1003: 401
    2001: 422
    2002: 422
    3001: 404
    3002: 409
    3003: 409
    4001: 409
    4002: 409
    5000: 500
    5001: 503
    6001: 422
    6002: 422
    6003: 422
    7001: 409
    7002: 502


x-hunter-pending-confirmation:
  source: "本契约编写过程中发现的、设计文档未明确的决策点；确认后回填契约再实现代码"
  note: "每项均影响 Step 2 及之后的实现范围，未确认前实现必须按本契约当前取值（禁止另起一套）"
  items:
    - id: 1
      question: "scenes.scene_type 取值域：设计文档只给出「分类 → 场景」两级结构，未给出编码值"
      contract_decision: "scene_type 取「叶子场景」编码（如 straight_cruise），分类映射见 x-hunter-scene-types"
      impact: "DB 无 CHECK 约束、前后端筛选与 OpenSCENARIO 导出映射"
    - id: 2
      question: "4.4 节第 6/7 步（实时监控仿真进度、保存仿真结果）无 REST 端点"
      contract_decision: "已决策（G-20①）：新增 GET /api/v1/scene/simulations/{sim_instance_id}（进度）与 …/result（结果）两端点，服务端无状态代理 Carla 管理 API，不落库实例状态；进度/结果子路径环境变量化（#9 延续）"
      impact: "前端仿真面板轮询这两个端点；Carla 实例回收后历史结果不可查（如需持久化另行立项）"
    - id: 3
      question: "spawn_point / actor.behavior / event.trigger / event.action 内部结构未定义"
      contract_decision: "按 Carla transform 与 OpenSCENARIO 条件语义给出最小结构，behavior_type/action_type 暂为字符串；spawn_point 坐标语义已固化（V1.25.0 反转职责）：map.spawn_point 为自车出生点（目录模板为占位原点 (0,0,0)）、actors[].spawn_point 为相对偏移，下发时**不折算、不拦原点**，仅打 spawn_semantics=relative_to_ego；占位原点替换与有效性校验由仿真端（HunterSim）承担"
      impact: "场景编辑器字段级校验与导出实现；存量将出生点写为 (0,0,0) 的场景照常下发，画面是否不再黑屏取决于仿真端是否已实现替换（见 docs/HunterSim传感器挂载换算方案.md 第一部分）"
    - id: 4
      question: "scenes.status 含 archived，但 12.2 节无归档端点"
      contract_decision: "契约不新增归档端点；lifecycle.transitions 中 published→archived 的 endpoint 为 null"
      impact: "归档能力是否本期交付"
    - id: 5
      question: "删除规则：published 场景是否允许直接删除"
      contract_decision: "仅 draft/archived 可删除，published 返回 3003（需先归档）"
      impact: "DELETE /scene/{scene_id} 状态校验分支"
    - id: 6
      question: "场景导出返回形式：XML 文本直返 / MinIO 预签名 URL；批量导出语义"
      contract_decision: "MinIO hunter-scene-assets + 预签名 15 分钟；批量导出为单文件集（命名 scene-{scene_id}-{version}.{ext}）"
      impact: "网关响应体大小、前端下载体验、MinIO 生命周期（永久）"
    - id: 7
      question: "version 语义：发布时是否自动递增"
      contract_decision: "仅当请求显式传 version 时更新；否则保持不变"
      impact: "publish 实现与前端展示"
    - id: 8
      question: "rate limit 超限响应错误码（附录 A 无 429 专属码）"
      contract_decision: "复用 5001 + HTTP 429 + Retry-After 响应头（与网关契约一致）"
      impact: "网关/服务错误处理"
    - id: 9
      question: "Carla 管理 API 地址与配置键名、仿真并发上限、场景时长上限"
      contract_decision: "键名暂定 CARLA_MANAGEMENT_ENDPOINT，值域与上限均需环境变量化；实现侧以 CARLA_INSTANCE_CREATE_PATH / CARLA_INSTANCE_QUERY_PATH（默认 /api/v1/instances）与 CARLA_SCENARIO_SUBMIT_PATH（默认 /api/v1/instances/{sim_instance_id}/scenario）及 SCENE_DURATION_MAX_SECONDS（默认 600s）落地；G-20① 追加 CARLA_INSTANCE_GET_PATH / CARLA_INSTANCE_RESULT_PATH（默认 /api/v1/instances/{sim_instance_id} 与 …/result），人工确认后仅调整配置不改代码；V1.23.7 补：地址形态门禁与 5001 文案分流见 x-hunter-simulation-flow.endpoint_address_contract / failure_message_taxonomy"
      impact: "Step 3 服务层实现与 K8s ConfigMap"
    - id: 10
      question: "实车场景提取触发源：analytics_result 还是 event_raw"
      contract_decision: "以 consumer-groups.yaml 登记为准，仅消费 analytics_result；event_raw 标记 enabled=false"
      impact: "Step 5 消费者实现与 data-analytics 的 analytics_result 契约"
    - id: 11
      question: "场景模板数据来源（内置静态清单 / DB 表 / MinIO 资源）"
      contract_decision: "契约只定义响应结构，不新增 DB 表；来源待确认"
      impact: "GET /scene/templates 实现方式与是否需要新表"
    - id: 12
      question: "weather 各字段取值范围（设计文档未给）"
      contract_decision: "按 Carla WeatherParameters 语义（0-100 / 方位角 0-360 / 高度角 -90~90）"
      impact: "场景编辑器滑块范围与导出映射"

